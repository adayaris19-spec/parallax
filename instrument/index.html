<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="color-scheme" content="dark">
<title>PARALLAX — The Sky</title>
<style>
/* ============================================================================
   PARALLAX / THE SKY — a map of everything.

   Google Maps, for space. Search a thing — a planet, an asteroid, a star, an
   exoplanet, a galaxy — go to it, and inspect it.

   TWO VIEWS, because space does not have one natural projection:
     SOLAR SYSTEM   a top-down orbital plot, positions computed live from
                    published elements, zoomable from Mercury out to Sedna.
     THE SKY        the whole celestial sphere in RA/Dec, carrying stars,
                    exoplanet hosts and deep sky.

   WHERE THE DATA COMES FROM. A local index of about a hundred and forty
   well-known objects ships in the page so the map is never empty and search is
   instant. Anything not in it is resolved live against the real archives:

     JPL Small-Body Database      any asteroid or comet, elements and physics
     NASA Exoplanet Archive       any confirmed exoplanet and its host
     CDS Sesame                   any named star, nebula, cluster or galaxy

   Every value carries where it came from, and every field that is derived
   rather than measured says so. A live source that cannot be reached says that
   too, rather than quietly returning nothing.
   ========================================================================== */
:root{
  --bg:#070d16; --bg2:#0b1523; --panel:#0f1c2d; --panel2:#132437; --sink:#0a1420;
  --line:#1d3350; --line2:#2b4b70; --line3:#3f6a99;
  --ink:#e9f2fb; --ink2:#b3c9de; --dim:#7793ad;
  --acc:#4fb8f5; --acc2:#2f9de0; --accbg:rgba(79,184,245,.12);
  --warm:#ff9b6a; --gold:#ffd27a; --green:#54d6a5; --violet:#a48cf0; --red:#ff6f61;
  --f:'Inter','Inter var',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --m:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Consolas,'Roboto Mono',Menlo,monospace;
  --bar:52px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
:focus:not(:focus-visible){outline:none}
a{color:var(--acc)}
.n{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.015em}

#app{display:grid;grid-template-rows:var(--bar) minmax(0,1fr);height:100dvh}
#bar{display:flex;align-items:center;gap:12px;padding:0 14px;background:#050a12;
  border-bottom:1px solid var(--line);position:relative}
#bar .mk{display:flex;align-items:center;gap:8px;flex:none;text-decoration:none;color:inherit}
#bar .mk b{font-family:var(--m);font-size:12.5px;letter-spacing:.32em;font-weight:700;color:#fff}
#bar .sl{font-family:var(--m);font-size:10px;letter-spacing:.18em;color:var(--acc);
  border-left:1px solid var(--line2);padding-left:12px;flex:none;text-transform:uppercase;white-space:nowrap}
#search{flex:1;max-width:520px;margin-left:14px;position:relative}
#search input{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:6px;
  color:var(--ink);padding:9px 12px 9px 34px;font-size:14px}
#search input:focus{border-color:var(--acc);background:var(--panel2)}
#search input::placeholder{color:var(--dim)}
#search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim);
  pointer-events:none;font-size:13px}
#sug{position:absolute;left:0;right:0;top:calc(100% + 5px);background:var(--panel);
  border:1px solid var(--line2);border-radius:7px;max-height:52vh;overflow-y:auto;z-index:40;
  box-shadow:0 22px 50px -18px #000;display:none}
#sug.on{display:block}
#sug button{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line);padding:9px 12px;cursor:pointer;color:var(--ink)}
#sug button:last-child{border-bottom:0}
#sug button:hover,#sug button.hot{background:var(--accbg)}
#sug .nm{font-size:14px}
#sug .mt{font-family:var(--m);font-size:10.5px;color:var(--dim);letter-spacing:.05em;margin-top:2px}
#sug .grp{padding:6px 12px;font-family:var(--m);font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim);background:var(--sink);border-bottom:1px solid var(--line)}
#bar .st{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--m);font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);flex:none;max-width:30vw;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#bar .st i{width:7px;height:7px;border-radius:50%;background:#2b4b70;flex:none}
#bar .st i.go{background:var(--acc);animation:bl 1.1s infinite}
#bar .st i.ok{background:var(--green)} #bar .st i.bad{background:var(--red)}
@keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}
#bar a.out{color:var(--dim);font-family:var(--m);font-size:10px;letter-spacing:.12em;
  text-decoration:none;border-bottom:1px solid var(--line2);flex:none;text-transform:uppercase}
#bar a.out:hover{color:#fff;border-color:var(--acc)}

#main{display:grid;grid-template-columns:minmax(0,1fr) 372px;min-height:0}
#stage{position:relative;min-width:0;background:
  radial-gradient(62% 78% at 50% 44%,#0d1b2c 0%,var(--bg2) 52%,var(--bg) 100%)}
#sky{display:block;width:100%;height:100%;cursor:grab}
#sky.drag{cursor:grabbing}
.hud{position:absolute;display:flex;gap:6px;z-index:5}
#views{top:12px;left:12px}
#views button,#zoomer button,.hbtn{background:rgba(15,28,45,.86);border:1px solid var(--line2);
  color:var(--ink2);border-radius:6px;padding:7px 12px;cursor:pointer;font-family:var(--m);
  font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;backdrop-filter:blur(8px)}
#views button:hover,#zoomer button:hover,.hbtn:hover{color:#fff;border-color:var(--acc)}
#views button.on{background:var(--acc);border-color:var(--acc);color:#04121e;font-weight:700}
#zoomer{bottom:14px;left:12px;flex-direction:column;align-items:flex-start}
#zoomer .row{display:flex;gap:6px}
#scaleTag{margin-top:7px;font-family:var(--m);font-size:10px;letter-spacing:.1em;color:var(--dim);
  background:rgba(7,13,22,.8);padding:4px 8px;border-radius:4px;border:1px solid var(--line)}
#legend{position:absolute;right:12px;bottom:14px;z-index:5;background:rgba(7,13,22,.82);
  border:1px solid var(--line);border-radius:6px;padding:9px 11px;font-family:var(--m);font-size:9.5px;
  letter-spacing:.08em;color:var(--dim);backdrop-filter:blur(8px);max-width:230px}
#legend b{display:block;color:var(--ink2);margin-bottom:6px;letter-spacing:.15em;text-transform:uppercase;
  font-size:9px}
#legend span{display:inline-flex;align-items:center;gap:6px;margin:2px 9px 2px 0}
#legend i{width:8px;height:8px;border-radius:50%}
#tip{position:absolute;pointer-events:none;z-index:6;background:rgba(7,13,22,.94);
  border:1px solid var(--line2);border-radius:5px;padding:6px 9px;font-size:12.5px;display:none;
  white-space:nowrap;box-shadow:0 10px 26px -10px #000}
#tip.on{display:block}
#tip .t2{font-family:var(--m);font-size:10px;color:var(--dim);margin-top:2px}

#insp{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;min-width:0}
#insp .none{padding:26px 20px;color:var(--dim)}
#insp .none h2{font-size:17px;color:var(--ink);margin-bottom:9px}
#insp .none p{font-size:13.5px;line-height:1.55;margin:0 0 12px}
#insp .none .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
#insp .none .chips button{background:var(--panel2);border:1px solid var(--line2);color:var(--ink2);
  border-radius:20px;padding:5px 11px;cursor:pointer;font-size:12.5px}
#insp .none .chips button:hover{border-color:var(--acc);color:var(--acc)}
.ihead{padding:15px 17px 13px;border-bottom:1px solid var(--line);background:
  linear-gradient(180deg,var(--panel2),var(--panel))}
.ihead .kind{font-family:var(--m);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  margin-bottom:7px}
.ihead h2{font-size:clamp(19px,2.2vw,25px);line-height:1.16;margin:0 0 6px}
.ihead .alt{font-family:var(--m);font-size:11px;color:var(--dim);letter-spacing:.04em}
.ihead .src{margin-top:9px;display:inline-flex;align-items:center;gap:6px;font-family:var(--m);
  font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);
  border:1px solid var(--line2);border-radius:20px;padding:3px 9px}
.blk{padding:13px 17px;border-bottom:1px solid var(--line)}
.blk h3{font-family:var(--m);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);margin:0 0 9px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline}
.kv dt{font-size:12.4px;color:var(--dim);white-space:nowrap}
.kv dd{margin:0;font-family:var(--m);font-size:13px;color:var(--ink);text-align:right;
  font-variant-numeric:tabular-nums;word-break:break-word}
.kv dd u{text-decoration:none;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  margin-left:7px;padding:1px 5px;border-radius:3px;border:1px solid}
.kv dd u.meas{color:var(--green);border-color:rgba(84,214,165,.4)}
.kv dd u.calc{color:var(--acc);border-color:rgba(79,184,245,.4)}
.kv dd u.asm{color:var(--gold);border-color:rgba(255,210,122,.4)}
.blk p{font-size:13.2px;line-height:1.55;color:var(--ink2);margin:0 0 .7em}
.blk p:last-child{margin-bottom:0}
.act{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.act button{background:var(--acc);border:0;color:#04121e;border-radius:5px;padding:8px 13px;
  cursor:pointer;font-weight:650;font-size:13px}
.act button:hover{background:var(--acc2)}
.act button.gh{background:none;border:1px solid var(--line2);color:var(--ink2);font-weight:400}
.act button.gh:hover{border-color:var(--acc);color:var(--acc)}
.act button[disabled]{opacity:.5;cursor:not-allowed}
.lit{border-left:2px solid var(--line2);padding-left:11px;margin-top:10px}
.lit .li{padding:8px 0;border-bottom:1px solid var(--line)}
.lit .li:last-child{border-bottom:0}
.lit .li a{color:var(--ink);text-decoration:none;font-size:13.2px;line-height:1.4;
  border-bottom:1px solid var(--line2)}
.lit .li a:hover{color:var(--acc);border-color:var(--acc)}
.lit .li .m{font-family:var(--m);font-size:10px;color:var(--dim);margin-top:3px}
.lit .li .w{font-size:12.4px;color:var(--ink2);margin-top:4px;line-height:1.45}
.warn{background:rgba(255,111,97,.08);border:1px solid rgba(255,111,97,.3);border-radius:5px;
  padding:9px 11px;font-size:12.6px;color:#ffb4ad;line-height:1.5}
.mini{font-family:var(--m);font-size:10.5px;color:var(--dim);letter-spacing:.05em}

@media(max-width:1040px){
  #main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  #insp{border-left:0;border-top:1px solid var(--line);max-height:46vh}
  #bar .sl{display:none} #bar .st{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

      <circle cx="12" cy="12" r="1.4" fill="#fff"/></svg><b>PARALLAX</b></a>
  <span class="sl">The Sky</span>

</div>

/* ===========================================================================
   2. ORBITS
   =========================================================================== */
function jdNow(){return J2000+(Date.now()-946728000000)/86400000;}
function solveKepler(M,e){
  var es=e*DEG,E=M+es*Math.sin(M*RAD);
  for(var i=0;i<14;i++){
    var dM=M-(E-es*Math.sin(E*RAD)),dE=dM/(1-e*Math.cos(E*RAD));
    E+=dE;if(Math.abs(dE)<1e-11)break;}
  return E;
}
function orbitXY(el,T){
  var a=el.a+(el.aD||0)*T,e=el.e+(el.eD||0)*T,I=(el.I+(el.ID||0)*T);
  var L=el.L+(el.LD||0)*T,W=el.W+(el.WD||0)*T,O=el.O+(el.OD||0)*T;
  var w=W-O,M=((L-W)%360+540)%360-180;
  return elXY(a,e,I,O,w,M);
}
function elXY(a,e,I,O,w,M){
  var E=solveKepler(((M%360)+540)%360-180,e);
  var xp=a*(Math.cos(E*RAD)-e),yp=a*Math.sqrt(1-e*e)*Math.sin(E*RAD);
  var cw=Math.cos(w*RAD),sw=Math.sin(w*RAD),cO=Math.cos(O*RAD),sO=Math.sin(O*RAD),
      ci=Math.cos(I*RAD),si=Math.sin(I*RAD);
  return {
    x:(cw*cO-sw*sO*ci)*xp+(-sw*cO-cw*sO*ci)*yp,
    y:(cw*sO+sw*cO*ci)*xp+(-sw*sO+cw*cO*ci)*yp,
    z:(sw*si)*xp+(cw*si)*yp};
}
function sbXY(b,jd){
  var n=0.9856076686/(b.a*Math.sqrt(b.a));            /* deg/day */
  var M=b.M+n*(jd-b.ep);
  return elXY(b.a,b.e,b.I,b.O,b.w,M);
}
function posOf(o,jd){
  var T=(jd-J2000)/36525;
  if(o.cls!=='solar')return null;
  return o.body.aD!=null?orbitXY(o.body,T):sbXY(o.body,jd);
}
function orbitPath(o,steps){
  var pts=[],b=o.body,i;
  if(b.aD!=null){
    var T=(jdNow()-J2000)/36525;
    var a=b.a+b.aD*T,e=b.e+b.eD*T,I=b.I+b.ID*T,O=b.O+b.OD*T,w=(b.W+b.WD*T)-O;
    for(i=0;i<=steps;i++)pts.push(elXY(a,e,I,O,w,i*360/steps));
  }else{
    for(i=0;i<=steps;i++)pts.push(elXY(b.a,b.e,b.I,b.O,b.w,i*360/steps));
  }
  return pts;
}

var CV=$('#sky'),CX=CV.getContext('2d'),DPR=Math.min(2,window.devicePixelRatio||1);
var VIEW='solar';
var SOL={au:12,cx:0,cy:0};      /* pixels per AU, and centre offset in pixels */
var SKY={ra:180,dec:0,z:1};     /* centre and zoom */
var HOT=null,SEL=null,PICKS=[];

function resize(){
  var r=CV.parentElement.getBoundingClientRect();
  CV.width=Math.round(r.width*DPR);CV.height=Math.round(r.height*DPR);
  CV.style.width=r.width+'px';CV.style.height=r.height+'px';
  draw();
}
addEventListener('resize',resize);

function W(){return CV.width/DPR;} function H(){return CV.height/DPR;}
function solProj(p){return {x:W()/2+SOL.cx+p.x*SOL.au,y:H()/2+SOL.cy-p.y*SOL.au};}
function skyProj(ra,dec){
  var dra=((ra-SKY.ra+540)%360)-180;
  return {x:W()/2-dra*(W()/360)*SKY.z,y:H()/2-(dec-SKY.dec)*(H()/180)*SKY.z};
}
function draw(){
  CX.setTransform(DPR,0,0,DPR,0,0);
  CX.clearRect(0,0,W(),H());
  PICKS=[];
  if(VIEW==='solar')drawSolar();else drawSky();
  drawScaleTag();
}
function starfield(){
  /* a deterministic field so the room has depth without pretending to be data */
  var s=1;CX.save();
  for(var i=0;i<220;i++){
    s=(s*16807)%2147483647;var x=(s/2147483647)*W();
    s=(s*16807)%2147483647;var y=(s/2147483647)*H();
    s=(s*16807)%2147483647;var a=0.05+(s/2147483647)*0.28;
    CX.fillStyle='rgba(200,225,255,'+a.toFixed(2)+')';
    CX.fillRect(x,y,1,1);
  }
  CX.restore();
}
function drawSolar(){
  starfield();
  var jd=jdNow();
  /* range rings, labelled in AU */
  CX.save();
  var c=solProj({x:0,y:0});
  [0.4,1,5.2,9.5,19.2,30.1,39.5,67.8,506].forEach(function(r){
    var px=r*SOL.au;
    if(px<14||px>Math.max(W(),H())*1.4)return;
    CX.beginPath();CX.arc(c.x,c.y,px,0,Math.PI*2);
    CX.strokeStyle='rgba(79,184,245,.10)';CX.lineWidth=1;CX.stroke();
    CX.fillStyle='rgba(119,147,173,.75)';CX.font='10px ui-monospace,monospace';
    CX.fillText(r+' AU',c.x+px+4,c.y-3);
  });
  CX.restore();
  /* orbits then bodies, small bodies under planets */
  var all=INDEX.filter(function(o){return o.cls==='solar';});
  all.forEach(function(o){
    var pts=orbitPath(o,180),first=true;
    CX.beginPath();
    pts.forEach(function(p){var q=solProj(p);if(first){CX.moveTo(q.x,q.y);first=false;}else CX.lineTo(q.x,q.y);});
    CX.closePath();
    CX.strokeStyle=SEL&&SEL.id===o.id?'rgba(79,184,245,.85)':'rgba(140,175,210,.20)';
    CX.lineWidth=SEL&&SEL.id===o.id?1.6:1;CX.stroke();
  });
  /* the Sun */
  CX.beginPath();CX.arc(c.x,c.y,6,0,Math.PI*2);
  var g=CX.createRadialGradient(c.x,c.y,0,c.x,c.y,26);
  g.addColorStop(0,'#fff6cf');g.addColorStop(.35,'rgba(255,208,110,.55)');g.addColorStop(1,'rgba(255,180,60,0)');
  CX.fillStyle=g;CX.fillRect(c.x-26,c.y-26,52,52);
  CX.beginPath();CX.arc(c.x,c.y,5,0,Math.PI*2);CX.fillStyle='#ffeaa0';CX.fill();
  PICKS.push({x:c.x,y:c.y,r:9,o:{id:'sun',name:'The Sun',kind:'G2V star',cls:'solar',sun:true,col:'#ffeaa0'}});
  all.forEach(function(o){
    var p=posOf(o,jd);if(!p)return;
    var q=solProj(p);
    if(q.x<-40||q.x>W()+40||q.y<-40||q.y>H()+40)return;
    var rad=o.body.rad||3;
    CX.beginPath();CX.arc(q.x,q.y,rad,0,Math.PI*2);CX.fillStyle=o.col;CX.fill();
    if(SEL&&SEL.id===o.id){
      CX.beginPath();CX.arc(q.x,q.y,rad+7,0,Math.PI*2);
      CX.strokeStyle='#4fb8f5';CX.lineWidth=1.6;CX.stroke();
    }
    if(SOL.au>3||o.kind==='planet'){
      CX.fillStyle='rgba(220,236,250,.8)';CX.font='11px '+"'Inter',system-ui,sans-serif";
      CX.fillText(o.name.replace(/^\d+\s/,''),q.x+rad+5,q.y+4);
    }
    PICKS.push({x:q.x,y:q.y,r:Math.max(9,rad+5),o:o});
  });
}
function drawSky(){
  starfield();
  /* grid */
  CX.save();CX.strokeStyle='rgba(79,184,245,.10)';CX.lineWidth=1;
  CX.fillStyle='rgba(119,147,173,.7)';CX.font='10px ui-monospace,monospace';
  for(var ra=0;ra<360;ra+=30){
    var a=skyProj(ra,0);
    if(a.x<-30||a.x>W()+30)continue;
    CX.beginPath();CX.moveTo(a.x,0);CX.lineTo(a.x,H());CX.stroke();
    CX.fillText((ra/15).toFixed(0)+'h',a.x+4,H()-8);
  }
  for(var d=-60;d<=60;d+=30){
    var b=skyProj(SKY.ra,d);
    if(b.y<0||b.y>H())continue;
    CX.beginPath();CX.moveTo(0,b.y);CX.lineTo(W(),b.y);CX.stroke();
    CX.fillText((d>0?'+':'')+d+'°',6,b.y-4);
  }
  CX.restore();
  var hosts={};
  INDEX.forEach(function(o){if(o.exo)hosts[o.exo.host]=true;});
  INDEX.filter(function(o){return o.cls==='sky';}).forEach(function(o){
    var ra,dec,r,col=o.col;
    if(o.star){ra=o.star.ra;dec=o.star.dec;
      r=o.star.mag==null?4:Math.max(1.6,5.2-o.star.mag*0.42);}
    else if(o.deep){ra=o.deep.ra;dec=o.deep.dec;r=4.4;}
    else return;
    var q=skyProj(ra,dec);
    if(q.x<-20||q.x>W()+20||q.y<-20||q.y>H()+20)return;
    if(o.deep){
      CX.beginPath();CX.ellipse(q.x,q.y,r+2.5,r,0,0,Math.PI*2);
      CX.strokeStyle=col;CX.lineWidth=1.2;CX.stroke();
      CX.fillStyle='rgba(84,214,165,.16)';CX.fill();
    }else{
      CX.beginPath();CX.arc(q.x,q.y,r,0,Math.PI*2);CX.fillStyle=col;CX.fill();
      if(hosts[o.name]){
        CX.beginPath();CX.arc(q.x,q.y,r+4.5,0,Math.PI*2);
        CX.strokeStyle='rgba(164,140,240,.8)';CX.lineWidth=1.1;CX.stroke();
      }
    }
    if(SEL&&SEL.id===o.id){
      CX.beginPath();CX.arc(q.x,q.y,r+9,0,Math.PI*2);CX.strokeStyle='#4fb8f5';CX.lineWidth=1.6;CX.stroke();
    }
    if(SKY.z>1.5||(o.star&&o.star.mag!=null&&o.star.mag<2.1)||o.deep){
      CX.fillStyle='rgba(220,236,250,.78)';CX.font='11px '+"'Inter',system-ui,sans-serif";
      CX.fillText(o.name,q.x+r+5,q.y+4);
    }
    PICKS.push({x:q.x,y:q.y,r:Math.max(9,r+5),o:o});
  });
}
function drawScaleTag(){
  var t;
  if(VIEW==='solar'){
    var across=(W()/SOL.au);
    t=across<3?'field '+across.toFixed(2)+' AU across':
      across<200?'field '+across.toFixed(0)+' AU across':
      'field '+(across/63241).toFixed(3)+' light years across';
  }else{
    t='field '+(360/SKY.z).toFixed(0)+'° of sky · '+INDEX.filter(function(o){return o.cls==='sky';}).length+' objects on file';
  }
  $('#scaleTag').textContent=t;
}
/* pointer */
var drag=null;
CV.addEventListener('pointerdown',function(e){
  drag={x:e.clientX,y:e.clientY,moved:false};CV.classList.add('drag');CV.setPointerCapture(e.pointerId);});
CV.addEventListener('pointermove',function(e){
  var r=CV.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  if(drag){
    var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;
    if(VIEW==='solar'){SOL.cx+=dx;SOL.cy+=dy;}
    else{SKY.ra=((SKY.ra-dx/((W()/360)*SKY.z))%360+360)%360;
      SKY.dec=Math.max(-89,Math.min(89,SKY.dec+dy/((H()/180)*SKY.z)));}
    drag.x=e.clientX;drag.y=e.clientY;draw();return;
  }
  var hit=pick(mx,my);
  if(hit!==HOT){HOT=hit;
    var T=$('#tip');
    if(hit){T.className='on';
      T.innerHTML='<div>'+esc(hit.o.name)+'</div><div class="t2">'+esc(hit.o.kind)+'</div>';
      T.style.left=Math.min(W()-200,mx+14)+'px';T.style.top=(my+14)+'px';
    }else T.className='';
  }else if(hit){
    var T2=$('#tip');T2.style.left=Math.min(W()-200,mx+14)+'px';T2.style.top=(my+14)+'px';
  }
});
CV.addEventListener('pointerup',function(e){
  var wasDrag=drag&&drag.moved;drag=null;CV.classList.remove('drag');
  if(wasDrag)return;
  var r=CV.getBoundingClientRect(),hit=pick(e.clientX-r.left,e.clientY-r.top);
  if(hit)select(hit.o);
});
CV.addEventListener('pointerleave',function(){$('#tip').className='';HOT=null;});
CV.addEventListener('wheel',function(e){
  e.preventDefault();
  var k=e.deltaY<0?1.16:1/1.16;
  if(VIEW==='solar')SOL.au=Math.max(0.01,Math.min(4000,SOL.au*k));
  else SKY.z=Math.max(0.6,Math.min(60,SKY.z*k));
  draw();
},{passive:false});
function pick(mx,my){
  var best=null,bd=1e9;
  for(var i=PICKS.length-1;i>=0;i--){
    var p=PICKS[i],d=Math.hypot(p.x-mx,p.y-my);
    if(d<=p.r&&d<bd){bd=d;best=p;}
  }
  return best;
}

   4. SEARCH — local first, then the live archives
   =========================================================================== */
var SBDB='https://ssd-api.jpl.nasa.gov/sbdb.api';
var EXOTAP='https://exoplanetarchive.ipac.caltech.edu/TAP/sync';
var SESAME='https://cds.unistra.fr/cgi-bin/nph-sesame/-oxp/SNV';
function jget(url,ms){
  var ctl=new AbortController(),t=setTimeout(function(){ctl.abort();},ms||14000);
  return fetch(url,{signal:ctl.signal})
    .then(function(r){clearTimeout(t);
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.text();})
    .catch(function(e){clearTimeout(t);throw e;});
}
function score(name,q){
  var n=name.toLowerCase(),i=n.indexOf(q);
  if(i<0)return -1;
  return (i===0?100:40-i)+(n.length===q.length?50:0);
}
function localSearch(q){
  q=q.toLowerCase().trim();if(!q)return [];
  return INDEX.map(function(o){return {o:o,s:score(o.name,q)};})
    .filter(function(x){return x.s>=0;})
    .sort(function(a,b){return b.s-a.s;}).slice(0,12).map(function(x){return x.o;});
}
var SUGT=null,LIVE=[];
$('#q').addEventListener('input',function(){
  var v=$('#q').value;
  clearTimeout(SUGT);
  renderSug(localSearch(v),null);
  if(txt(v).length>=3)SUGT=setTimeout(function(){liveSearch(txt(v));},420);
});
$('#q').addEventListener('keydown',function(e){
  var btns=$$('#sug button[data-i]');
  if(e.key==='Enter'){
    var hot=$('#sug button.hot')||btns[0];
    if(hot)hot.click();
    return;
  }
  if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;
  e.preventDefault();
  var cur=btns.indexOf($('#sug button.hot'));
  var nx=e.key==='ArrowDown'?Math.min(btns.length-1,cur+1):Math.max(0,cur-1);
  btns.forEach(function(b,i){b.classList.toggle('hot',i===nx);});
});
document.addEventListener('click',function(e){
  if(!$('#search').contains(e.target))$('#sug').classList.remove('on');});
function renderSug(local,live){
  var S=$('#sug'),h='',i=0;
  if(local.length){
    h+='<div class="grp">On file · instant</div>';
    local.forEach(function(o){
      h+='<button data-i="'+(i++)+'" data-id="'+esc(o.id)+'"><div class="nm">'+esc(o.name)+
        '</div><div class="mt">'+esc(o.kind)+'</div></button>';});
  }
  if(live&&live.length){
    h+='<div class="grp">From the archives · live</div>';
    live.forEach(function(o,k){
      h+='<button data-i="'+(i++)+'" data-live="'+k+'"><div class="nm">'+esc(o.name)+
        '</div><div class="mt">'+esc(o.kind)+' · '+esc(o.src)+'</div></button>';});
  }
  if(!h)h='<div class="grp">Nothing on file — still asking the archives…</div>';
  S.innerHTML=h;S.classList.add('on');
  LIVE=live||LIVE;
  $$('#sug button[data-i]').forEach(function(b){
    b.addEventListener('click',function(){
      $('#sug').classList.remove('on');

      else select(LIVE[Number(b.dataset.live)]);

/* The three archives, asked in parallel. Each one that fails says so rather
   than silently narrowing the result set. */
function liveSearch(q){
  status('go','Asking the archives for “'+q+'”');
  var out=[],fails=[];
  var pSB=jget(SBDB+'?sstr='+encodeURIComponent(q)+'&phys-par=1&full-prec=1')
    .then(function(t){
      var j=JSON.parse(t);
      if(j&&j.object){
        out.push({id:'live:sbdb:'+j.object.fullname,name:j.object.fullname||q,
          kind:txt(j.object.kind_name)||'small body',src:'JPL SBDB',cls:'solar',live:j,col:'#ff9b7a'});
      }else if(j&&j.list&&j.list.length){
        j.list.slice(0,6).forEach(function(r){
          out.push({id:'live:sbdb:'+r.pdes,name:r.name||r.pdes,kind:'small body',
            src:'JPL SBDB',cls:'solar',lookup:r.pdes,col:'#ff9b7a'});});
      }
    },function(){fails.push('JPL Small-Body Database');});
  var adql="select pl_name,hostname,disc_year,discoverymethod,pl_rade,pl_bmasse,pl_orbper,sy_dist,ra,dec "+
    "from ps where upper(pl_name) like upper('%"+q.replace(/'/g,"''")+"%') and default_flag=1";
  var pEX=jget(EXOTAP+'?query='+encodeURIComponent(adql)+'&format=json')
    .then(function(t){
      var rows=JSON.parse(t);
      (rows||[]).slice(0,6).forEach(function(r){
        out.push({id:'live:exo:'+r.pl_name,name:r.pl_name,kind:'exoplanet',src:'NASA Exoplanet Archive',
          cls:'sky',exolive:r,col:'#a48cf0'});});
    },function(){fails.push('NASA Exoplanet Archive');});
  var pSE=jget(SESAME+'?'+encodeURIComponent(q))
    .then(function(t){
      var ra=/<jradeg>([-\d.]+)<\/jradeg>/i.exec(t),de=/<jdedeg>([-\d.]+)<\/jdedeg>/i.exec(t);
      var ty=/<otype>([^<]+)<\/otype>/i.exec(t);
      if(ra&&de)out.push({id:'live:sesame:'+q,name:q,kind:(ty&&ty[1])||'catalogued object',
        src:'CDS Sesame',cls:'sky',
        deep:{ra:Number(ra[1]),dec:Number(de[1]),dist:null,kind:(ty&&ty[1])||''},col:'#54d6a5'});
    },function(){fails.push('CDS Sesame');});
  Promise.allSettled([pSB,pEX,pSE]).then(function(){
    if(txt($('#q').value)!==q)return;
    renderSug(localSearch(q),out);
    if(fails.length===3)status('bad','No archive could be reached');
    else if(fails.length)status('ok',fails.length+' of 3 archives unreachable');
    else status('ok',out.length?out.length+' live result'+(out.length===1?'':'s'):'Nothing live matched');
    if(fails.length)LASTFAIL=fails;else LASTFAIL=null;
  });
}
var LASTFAIL=null;

   5. THE INSPECTOR
   =========================================================================== */
function tag(t){return '<u class="'+t+'">'+({meas:'measured',calc:'derived',asm:'assumed'}[t])+'</u>';}
function row(k,v,t){
  if(v==null||v==='')return '';
  return '<dt>'+esc(k)+'</dt><dd>'+esc(String(v))+(t?tag(t):'')+'</dd>';
}
function blk(title,body){return body?'<div class="blk"><h3>'+esc(title)+'</h3>'+body+'</div>':'';}
function select(o){
  if(!o)return;
  SEL=o;$('#q').value='';draw();
  if(o.lookup){                      /* a search-list hit needs a second call */
    status('go','Fetching '+o.name);
    jget(SBDB+'?sstr='+encodeURIComponent(o.lookup)+'&phys-par=1&full-prec=1')
      .then(function(t){var j=JSON.parse(t);o.live=j;status('ok','Ready');inspect(o);},
        function(){status('bad','Could not fetch that object');inspect(o);});
    inspect(o);return;
  }
  inspect(o);
  if(o.cls==='solar'&&o.body)goTo(o);
  if(o.cls==='sky'&&(o.star||o.deep)){
    VIEW='sky';$$('#views button').forEach(function(x){x.classList.toggle('on',x.dataset.view==='sky');});
    var c=o.star||o.deep;SKY.ra=c.ra;SKY.dec=c.dec;SKY.z=Math.max(SKY.z,4);legend();draw();
  }
}
function goTo(o){
  VIEW='solar';$$('#views button').forEach(function(x){x.classList.toggle('on',x.dataset.view==='solar');});
  var a=o.body.a||1;
  SOL.au=Math.max(0.02,Math.min(3000,(Math.min(W(),H())*0.36)/a));
  SOL.cx=0;SOL.cy=0;legend();draw();
}
function inspect(o){
  var I=$('#insp'),h='';
  h+='<div class="ihead"><div class="kind" style="color:'+(o.col||'#4fb8f5')+'">'+esc(o.kind)+'</div>'+
    '<h2>'+esc(o.name)+'</h2>'+
    (o.src?'<div class="src">Source · '+esc(o.src)+'</div>':
      '<div class="src">Source · shipped with the page</div>')+'</div>';

  if(o.sun){
    h+=blk('Physical','<dl class="kv">'+row('Spectral type','G2V','meas')+
      row('Radius','695,700 km','meas')+row('Mass','1.989e30 kg','calc')+
      row('Surface temperature','5772 K','meas')+row('Age','4.6 Gyr','calc')+'</dl>');
    h+=blk('Position','<p>The origin of this map. Everything else here is plotted relative to it.</p>');
  }

  if(o.body){
    var jd=jdNow(),p=posOf(o,jd),b=o.body;
    if(p){
      var r=Math.sqrt(p.x*p.x+p.y*p.y+p.z*p.z);
      h+=blk('Where it is right now','<dl class="kv">'+
        row('Distance from the Sun',fmt(r,4)+' AU','calc')+
        row('Ecliptic X / Y / Z',fmt(p.x,4)+', '+fmt(p.y,4)+', '+fmt(p.z,4)+' AU','calc')+
        row('Light travel from the Sun',fmt(r*499.005/60,2)+' min','calc')+'</dl>'+
        '<p class="mini" style="margin-top:9px">Computed for this moment from the elements below.'+
        (b.aD==null?' Mean anomaly at epoch is approximate for this object, so the orbit is right and the position along it is indicative.':'')+'</p>');
      h+=blk('Orbit','<dl class="kv">'+
        row('Semi-major axis',fmt(b.a,6)+' AU','meas')+
        row('Eccentricity',fmt(b.e,6),'meas')+
        row('Inclination',fmt(b.I,4)+'°','meas')+
        row('Period',fmt(Math.pow(b.a,1.5),4)+' yr','calc')+
        row('Perihelion',fmt(b.a*(1-b.e),5)+' AU','calc')+
        row('Aphelion',fmt(b.a*(1+b.e),5)+' AU','calc')+'</dl>');
    }
    if(b.phys){
      var pr='';
      Object.keys(b.phys).forEach(function(k){
        if(k==='note')return;
        pr+=row(k.charAt(0).toUpperCase()+k.slice(1),b.phys[k],'meas');});
      h+=blk('Physical','<dl class="kv">'+pr+'</dl>'+
        (b.phys.note?'<p style="margin-top:9px">'+esc(b.phys.note)+'</p>':''));
    }
  }
  if(o.moon){
    var m=o.moon;
    h+=blk('Physical','<dl class="kv">'+row('Radius',m.radius,'meas')+row('Mass',m.mass,'meas')+
      row('Orbital period',m.period,'meas')+row('Orbits',m.parent,'meas')+'</dl>'+
      '<p class="mini" style="margin-top:9px">Moons are inspected here and drawn at their parent — '+
      'at solar-system scale they sit inside the planet\'s own disc.</p>');
  }
  if(o.star){
    var s=o.star;
    h+=blk('Position and distance','<dl class="kv">'+
      row('Right ascension',fmt(s.ra,4)+'° ('+fmt(s.ra/15,3)+'h)','meas')+
      row('Declination',fmt(s.dec,4)+'°','meas')+
      row('Distance',fmt(s.ly,2)+' light years','meas')+
      row('Distance',fmt(s.ly*63241,0)+' AU','calc')+'</dl>');
    h+=blk('The star','<dl class="kv">'+
      row('Spectral type',s.sp,'meas')+
      row('Apparent magnitude',s.mag==null?null:fmt(s.mag,2),'meas')+
      (s.mag!=null&&s.ly?row('Absolute magnitude',
        fmt(s.mag-5*(Math.log10(s.ly/3.26156)-1),2),'calc'):'')+'</dl>');
    var hosted=INDEX.filter(function(x){return x.exo&&x.exo.host===o.name;});
    if(hosted.length)h+=blk('Planets on file',hosted.map(function(x){
      return '<div class="li" style="padding:7px 0;border-bottom:1px solid var(--line)">'+
        '<a href="#" data-goid="'+esc(x.id)+'">'+esc(x.name)+'</a>'+
        '<div class="m">'+esc(x.exo.note)+'</div></div>';}).join(''));
  }
  if(o.exo){
    var e=o.exo;
    h+=blk('Discovery','<dl class="kv">'+row('Host star',e.host,'meas')+
      row('Discovered',e.year,'meas')+row('Method',e.method,'meas')+'</dl>'+
      '<p style="margin-top:9px">'+esc(e.note)+'</p>');
    var hs=INDEX.filter(function(x){return x.star&&x.name===e.host;})[0];
    if(hs)h+=blk('Where to look','<p>Go to <a href="#" data-goid="'+esc(hs.id)+'">'+esc(hs.name)+
      '</a> — RA '+fmt(hs.star.ra,3)+'°, Dec '+fmt(hs.star.dec,3)+'°, '+fmt(hs.star.ly,1)+' ly.</p>');
  }
  if(o.exolive){
    var r2=o.exolive;
    h+=blk('From the archive','<dl class="kv">'+
      row('Host star',r2.hostname,'meas')+row('Discovered',r2.disc_year,'meas')+
      row('Method',r2.discoverymethod,'meas')+
      row('Radius',r2.pl_rade==null?null:fmt(r2.pl_rade,2)+' R⊕','meas')+
      row('Mass',r2.pl_bmasse==null?null:fmt(r2.pl_bmasse,2)+' M⊕','meas')+
      row('Orbital period',r2.pl_orbper==null?null:fmt(r2.pl_orbper,4)+' d','meas')+
      row('System distance',r2.sy_dist==null?null:fmt(r2.sy_dist,2)+' pc','meas')+
      row('RA / Dec',r2.ra==null?null:fmt(r2.ra,4)+'° / '+fmt(r2.dec,4)+'°','meas')+'</dl>');
  }
  if(o.live&&o.live.object){
    var L=o.live,ob=L.object,el={};
    ((L.orbit&&L.orbit.elements)||[]).forEach(function(x){el[x.name]=x;});
    h+=blk('Identity','<dl class="kv">'+row('Full name',ob.fullname,'meas')+
      row('Designation',ob.des,'meas')+row('Class',ob.orbit_class&&ob.orbit_class.name,'meas')+
      (ob.neo?row('Near-Earth object','yes','meas'):'')+
      (ob.pha?row('Potentially hazardous','yes','meas'):'')+'</dl>');
    var eh='';
    ['a','e','i','om','w','ma','per','q','ad'].forEach(function(k){
      if(el[k])eh+=row(({a:'Semi-major axis',e:'Eccentricity',i:'Inclination',om:'Long. of node',
        w:'Arg. of perihelion',ma:'Mean anomaly',per:'Period',q:'Perihelion',ad:'Aphelion'})[k],
        el[k].value+(el[k].units?' '+el[k].units:''),'meas');});
    h+=blk('Orbit — live from JPL',eh?'<dl class="kv">'+eh+'</dl>':'<p>No elements returned.</p>');
    var ph='';
    ((L.phys_par)||[]).slice(0,10).forEach(function(x){
      ph+=row(x.title||x.name,x.value+(x.units?' '+x.units:''),'meas');});
    if(ph)h+=blk('Physical — live from JPL','<dl class="kv">'+ph+'</dl>');
  }
  if(o.deep&&!o.star){
    h+=blk('Position','<dl class="kv">'+row('Right ascension',fmt(o.deep.ra,4)+'°','meas')+
      row('Declination',fmt(o.deep.dec,4)+'°','meas')+
      row('Distance',o.deep.dist,'meas')+'</dl>');
  }

  /* the catalog idea, folded in: what is actually known, and what to read */
  h+='<div class="blk"><h3>What the literature says</h3>'+
    '<p>Sweep the archives for what has been published on this object — the same engine the Record '+
    'runs, pointed at a thing instead of a claim.</p>'+
    '<div class="act"><button id="litBtn">Read the literature</button>'+
    '<button class="gh" id="copyBtn">Copy identity</button></div>'+
    '<div id="litOut"></div></div>';

  if(LASTFAIL&&LASTFAIL.length)
    h+='<div class="blk"><div class="warn"><b>'+LASTFAIL.length+' archive'+
      (LASTFAIL.length===1?'':'s')+' could not be reached</b><br>'+esc(LASTFAIL.join(', '))+
      '. Results are from what is on file plus whatever did answer. This is usually the service '+
      'itself, not your connection.</div></div>';

  I.innerHTML=h;I.scrollTop=0;
  $$('#insp [data-goid]').forEach(function(a){
    a.addEventListener('click',function(e){e.preventDefault();select(findLocal(a.dataset.goid));});});
  var lb=$('#litBtn');if(lb)lb.addEventListener('click',function(){readLit(o,lb);});
  var cb=$('#copyBtn');

    var lines=[o.name,o.kind];
    if(o.star)lines.push('RA '+o.star.ra+' Dec '+o.star.dec+' · '+o.star.ly+' ly · '+o.star.sp);
    if(o.body)lines.push('a='+o.body.a+' AU e='+o.body.e+' i='+o.body.I+'°');

function readLit(o,btn){
  btn.disabled=true;btn.textContent='Sweeping…';
  status('go','Reading the literature on '+o.name);
  var q='What is known about '+o.name+(o.kind?' ('+o.kind+')':'');
  fetch(SUPA,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,
    Authorization:'Bearer '+KEY},body:JSON.stringify({question:q,limit:20,slice:0,slices:1})})
  .then(function(r){return r.text();})

    if(S.state)h+='<p style="margin:10px 0">'+esc(S.state)+'</p>';
    rs.forEach(function(r){
      h+='<div class="li">'+(r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+
        esc(r.title)+'</a>':esc(r.title))+
        '<div class="m">'+(r.year||'')+(r.venue?' · '+esc(String(r.venue).slice(0,40)):'')+
        (r.citations!=null?' · '+r.citations+' cites':'')+'</div>'+
        (r.why?'<div class="w">'+esc(r.why)+'</div>':'')+'</div>';});
    if(S.nextTest)h+='<p style="margin-top:11px"><b>What would settle the open question:</b> '+
      esc(S.nextTest)+'</p>';

    btn.textContent='Read again';btn.disabled=false;
  })
  .catch(function(e){
    $('#litOut').innerHTML='<div class="warn" style="margin-top:10px">Could not reach the sweep '+
      'engine — '+esc(String(e&&e.message||e)).slice(0,140)+'</div>';

    'About a hundred and forty objects ship with the page and resolve instantly; anything else '+
    'is fetched live from JPL, the NASA Exoplanet Archive and CDS.</p>'+
    '<p>Or just click anything on the map.</p>'+
    '<div class="chips">'+
    ['Bennu','Titan','Proxima Centauri','TRAPPIST-1e','Andromeda Galaxy (M31)','99942 Apophis',
     'Betelgeuse','Orion Nebula (M42)'].map(function(n){
      return '<button data-jump="'+esc(n)+'">'+esc(n)+'</button>';}).join('')+'</div></div>';
  $$('#insp [data-jump]').forEach(function(b){
    b.addEventListener('click',function(){
      var hit=localSearch(b.dataset.jump)[0];
      if(hit)select(hit);});});
}

/* ===========================================================================
   6. BOOT
   =========================================================================== */
legend();blank();resize();
status('ok','Ready · '+INDEX.length+' objects on file');
setInterval(function(){if(VIEW==='solar')draw();},60000);   /* positions creep */
(function(){
  var m=/[?&#]go=([^&]+)/.exec(location.search+location.hash);
  if(m){try{var hit=localSearch(decodeURIComponent(m[1].replace(/\+/g,' ')))[0];
    if(hit)select(hit);}catch(e){}}
})();
</script>
