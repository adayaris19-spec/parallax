# Test renders for the short-form video work (docs/shorts). Splits one shot's frames across GitHub's free
# machines so a 5-second shot takes minutes instead of hours. Free on a public repository; uses no secrets.
# It runs when tools/shorts-lab/render-request.json changes on the working branch. Nothing is published:
# the finished clip is kept as a run artifact for 7 days.
name: Shorts lab render
on:
  push:
    branches: [claude/shorts-system]
    paths: ["tools/shorts-lab/render-request.json"]
permissions:
  contents: read
concurrency:
  group: shorts-lab-render
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      frames: ${{ steps.m.outputs.frames }}
      spp: ${{ steps.m.outputs.spp }}
      scale: ${{ steps.m.outputs.scale }}
      q: ${{ steps.m.outputs.q }}
    steps:
      - uses: actions/checkout@v4
      - name: Split the frames into chunks
        id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, math
          r = json.load(open("tools/shorts-lab/render-request.json"))
          n = int(r["frames"]); k = max(1, min(int(r.get("chunks", 20)), n)); per = math.ceil(n / k)
          inc = [{"chunk": i, "first": i * per, "last": min(n, (i + 1) * per) - 1} for i in range(k) if i * per < n]
          print("matrix=" + json.dumps({"include": inc}))
          print(f"frames={n}"); print(f"spp={int(r.get('spp', 32))}"); print(f"scale={float(r.get('scale', 1))}"); print(f"q={float(r.get('q', 1))}")
          PY
      - name: Site data (kept between runs)
        id: cache
        uses: actions/cache@v4
        with:
          path: labdata
          key: shorts-lab-data-v1-${{ hashFiles('tools/shorts-lab/prep_site_data.py', 'tools/shorts-lab/undraco.py', 'tools/shorts-lab/gibs_fetch.py') }}
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.13"
      - name: Fetch the terrain, models, Earth image and ephemeris
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install -q numpy opencv-python-headless DracoPy
          python tools/shorts-lab/prep_site_data.py labdata
          du -sh labdata
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache/restore@v4
        with:
          path: labdata
          key: shorts-lab-data-v1-${{ hashFiles('tools/shorts-lab/prep_site_data.py', 'tools/shorts-lab/undraco.py', 'tools/shorts-lab/gibs_fetch.py') }}
          fail-on-cache-miss: true
      - name: Blender as a Python package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxi6 libxkbcommon0 libsm6 libxfixes3 libxxf86vm1 libgl1 libegl1
          pip install -q bpy==5.3.0 numpy scipy opencv-python-headless OpenEXR DracoPy skyfield
      - name: Render frames ${{ matrix.first }} to ${{ matrix.last }}
        env:
          SPP: ${{ needs.plan.outputs.spp }}
          SCALE: ${{ needs.plan.outputs.scale }}
          Q: ${{ needs.plan.outputs.q }}
        run: |
          mkdir -p frames
          python tools/shorts-lab/base_scene.py labdata frames ${{ matrix.first }} ${{ matrix.last }} ${{ needs.plan.outputs.frames }} > render.log 2>&1 || { tail -40 render.log; exit 1; }
          grep -E "^\[" render.log | tail -12
          ls frames/*.exr | wc -l
      - name: Camera response (done here so every machine shares the work)
        run: python tools/shorts-lab/comp_real.py frames out ${{ matrix.first }} ${{ matrix.last }}
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.chunk }}
          path: out/*.png
          retention-days: 1
          compression-level: 0
  finish:
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          merge-multiple: true
          path: out
      - name: Encode
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ls out | wc -l
          ffmpeg -v error -y -framerate 24 -i out/c_%04d.png -c:v libx264 -crf 21 -preset slow -pix_fmt yuv420p -movflags +faststart clip.mp4
          ls -la clip.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: clip
          path: clip.mp4
          retention-days: 7
