<title>PARALLAX — The Frontier</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --paper:#EDEAE3;
  --entry:#F5F3EE;
  --ink:#16171A;
  --ink-2:#54565C;
  --ink-3:#84868D;
  --rule:#CFCBC2;
  --hair:#DEDAD2;
  --axis:#1B4B63;
  --kill:#9A5B12;
  --kill-fill:rgba(154,91,18,.13);
  --dead:#8E3B3B;
  --live:#2C6E49;
  --font-ui:"Helvetica Neue",Helvetica,"Segoe UI",Roboto,system-ui,sans-serif;
  --font-num:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1013;
    --entry:#15181C;
    --ink:#E6E7E9;
    --ink-2:#9A9DA4;
    --ink-3:#6C6F76;
    --rule:#282C32;
    --hair:#1D2126;
    --axis:#6FB2CE;
    --kill:#D2913F;
    --kill-fill:rgba(210,145,63,.15);
    --dead:#C97070;
    --live:#5FA97F;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1013; --entry:#15181C; --ink:#E6E7E9; --ink-2:#9A9DA4; --ink-3:#6C6F76;
  --rule:#282C32; --hair:#1D2126; --axis:#6FB2CE; --kill:#D2913F;
  --kill-fill:rgba(210,145,63,.15); --dead:#C97070; --live:#5FA97F;
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-ui);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.wrap{max-width:56rem;margin:0 auto;padding:0 1.25rem}

/* ---------- masthead ---------- */
header{border-bottom:1px solid var(--rule)}
.mast{display:flex;flex-wrap:wrap;gap:1.25rem 2.5rem;align-items:baseline;padding:1.5rem 0 1.1rem}
.mark{font-weight:800;letter-spacing:-.02em;font-size:1.05rem}
.mark span{color:var(--ink-3);font-weight:500;letter-spacing:.16em;font-size:.7rem;
  text-transform:uppercase;margin-left:.6rem}
.tally{display:flex;gap:1.75rem;margin-left:auto}
.tally div{display:flex;flex-direction:column;gap:.1rem}
.tally b{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:1.3rem;
  font-weight:600;line-height:1}
.tally span{font-family:var(--font-num);font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3)}
.tally .w b{color:var(--dead)}
.provenance{
  font-family:var(--font-num);font-size:.68rem;letter-spacing:.04em;color:var(--ink-3);
  padding-bottom:1rem;max-width:46rem;
}
.provenance b{color:var(--ink-2);font-weight:400}

/* ---------- the register ---------- */
main{padding:0 0 5rem}
.entry{border-bottom:1px solid var(--rule);padding:2rem 0}
.entry.closed{opacity:.62}
.head{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:baseline;margin-bottom:.7rem}
.cid{font-family:var(--font-num);font-size:.7rem;letter-spacing:.08em;color:var(--ink-3)}
.chip{font-family:var(--font-num);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid var(--rule);padding:.15rem .42rem;color:var(--ink-2)}
.chip.open{color:var(--live);border-color:var(--live)}
.chip.withdrawn,.chip.refuted{color:var(--dead);border-color:var(--dead)}
.sig{margin-left:auto;font-family:var(--font-num);font-size:.78rem;color:var(--axis)}
h2{font-size:1.32rem;line-height:1.22;letter-spacing:-.015em;font-weight:650;margin:0 0 .55rem;
  text-wrap:balance;max-width:44rem}
.said{color:var(--ink-2);margin:0 0 1.1rem;max-width:42rem;font-size:.95rem}

figure{margin:0 0 1.1rem;background:var(--entry);border:1px solid var(--hair);padding:1rem 1.1rem .8rem}
figure svg{display:block;width:100%;height:auto;overflow:visible}
figcaption{font-family:var(--font-num);font-size:.66rem;color:var(--ink-3);margin-top:.65rem;
  line-height:1.5;letter-spacing:.02em}

/* the kill condition is the widest, loudest structural element on an entry */
.killrow{border-left:3px solid var(--kill);background:var(--kill-fill);padding:.7rem .9rem;
  margin:0 0 .9rem;max-width:44rem}
.killrow .lab{font-family:var(--font-num);font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--kill);display:block;margin-bottom:.25rem}
.killrow p{margin:0;font-size:.9rem;color:var(--ink)}

.meta{display:flex;flex-wrap:wrap;gap:.35rem 1.4rem;font-family:var(--font-num);
  font-size:.68rem;color:var(--ink-3);letter-spacing:.02em}
.meta b{font-weight:400;color:var(--ink-2)}
.meta a{color:var(--axis)}
.audit{font-family:var(--font-num);font-size:.68rem;color:var(--ink-2);
  border-top:1px dashed var(--rule);margin-top:.9rem;padding-top:.6rem;max-width:44rem}
.audit .ok{color:var(--live)}
.audit .no{color:var(--dead)}
.retracted{border-left:3px solid var(--dead);padding:.7rem .9rem;margin:.9rem 0 0;
  max-width:44rem;font-size:.9rem;color:var(--ink-2)}
.retracted .lab{font-family:var(--font-num);font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dead);display:block;margin-bottom:.25rem}

.state{padding:4rem 0;max-width:38rem}
.state h2{font-size:1.5rem}
.state p{color:var(--ink-2)}
footer{border-top:1px solid var(--rule);padding:1.5rem 0 3rem;font-family:var(--font-num);
  font-size:.66rem;color:var(--ink-3);letter-spacing:.04em;line-height:1.7}
@media (max-width:640px){ .tally{margin-left:0;gap:1.25rem} h2{font-size:1.15rem} }
</style>

    if (joint > 0) {
      const dir = s[1].value >= s[0].value ? 1 : -1;
      for (let k = 1; k <= Math.ceil(Math.abs(fig.sigma)) + 1; k++) {
        const v = s[0].value + dir * k * joint;
        if (v >= lo && v <= hi) ticks.push({ x: x(v), k });
      }
    }
  }

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(claim.title)}">
    ${bands.map((b) => `
      <rect x="${b.a.toFixed(1)}" y="52" width="${Math.max(1, b.b - b.a).toFixed(1)}" height="96"
            fill="var(--kill-fill)" stroke="var(--kill)" stroke-width=".75" stroke-dasharray="3 3"/>
      <text x="${((b.a + b.b) / 2).toFixed(1)}" y="26" text-anchor="middle"
            font-family="ui-monospace,monospace" font-size="10.5" fill="var(--kill)"
            letter-spacing=".5">lands here → ${esc(b.label)}</text>`).join('')}

    <line x1="${L}" y1="${y0}" x2="${W - R}" y2="${y0}" stroke="currentColor" opacity=".3"/>
    ${ticks.map((t) => `
      <line x1="${t.x.toFixed(1)}" y1="${y0 - (t.k === 3 ? 11 : 5)}"
            x2="${t.x.toFixed(1)}" y2="${y0 + (t.k === 3 ? 11 : 5)}"
            stroke="var(--axis)" stroke-width="${t.k === 3 ? 1.6 : .8}" opacity="${t.k === 3 ? 1 : .55}"/>
      ${t.k === 3 ? `<text x="${t.x.toFixed(1)}" y="${y0 - 16}" text-anchor="middle"
            font-family="ui-monospace,monospace" font-size="10" fill="var(--axis)">3σ</text>` : ''}`).join('')}

    ${s.map((d, i) => {
      const cx = x(d.value), e = d.err || 0;
      const yy = i === 0 ? y0 - 22 : y0 + 22;
      return `
      <line x1="${x(d.value - e).toFixed(1)}" y1="${yy}" x2="${x(d.value + e).toFixed(1)}" y2="${yy}"
            stroke="currentColor" stroke-width="1.4"${i === 1 ? ' stroke-dasharray="4 3"' : ''}/>
      <line x1="${x(d.value - e).toFixed(1)}" y1="${yy - 5}" x2="${x(d.value - e).toFixed(1)}" y2="${yy + 5}" stroke="currentColor" stroke-width="1.4"/>
      <line x1="${x(d.value + e).toFixed(1)}" y1="${yy - 5}" x2="${x(d.value + e).toFixed(1)}" y2="${yy + 5}" stroke="currentColor" stroke-width="1.4"/>
      <circle cx="${cx.toFixed(1)}" cy="${yy}" r="4.5"
              fill="${i === 0 ? 'currentColor' : 'var(--paper)'}" stroke="currentColor" stroke-width="1.8"/>
      <text x="${cx.toFixed(1)}" y="${i === 0 ? 44 : 172}" text-anchor="middle"
            font-family="ui-monospace,monospace" font-size="11.5" fill="currentColor">
        ${sig(to(d.value))} ± ${sig(to(e), 2)}
        <tspan fill="var(--ink-3)" font-size="10"> ${esc(d.label)}</tspan>
      </text>`;
    }).join('')}

    <text x="${W - R}" y="${y0 + 25}" text-anchor="end" font-family="ui-monospace,monospace"
          font-size="10" fill="var(--ink-3)">${esc(unit)}</text>
  </svg>`;
}

/* THE STRIP, for an orphan.
   The claim is that nothing has been written about this object, so the figure
   that carries it is the object placed among its own catalogue: an ordinary
   value in a crowded index that no one has looked at. A sky position would be
   the obvious choice and it is not available — GWOSC gives these events no
   coordinates at all — so the strip is drawn from the quantity every one of
   them does carry. */
function strip(claim, population) {
  const o = claim.observed || {};
  const v = Number(o.value);
  if (!Number.isFinite(v)) return null;

  const peers = (population || []).filter((p) => Number.isFinite(p));
  const all = peers.length ? peers.concat([v]) : [v];
  const lo0 = Math.min(...all), hi0 = Math.max(...all);
  const pad = (hi0 - lo0) * 0.06 || Math.abs(v) * 0.2 || 1;
  const lo = lo0 - pad, hi = hi0 + pad;

  const W = 720, H = 96, L = 12, R = 12, y0 = 58;
  const x = (t) => L + ((t - lo) / (hi - lo)) * (W - L - R);

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(claim.object)} among its catalogue">
    <line x1="${L}" y1="${y0}" x2="${W - R}" y2="${y0}" stroke="currentColor" opacity=".3"/>
    ${peers.map((p) => `<line x1="${x(p).toFixed(1)}" y1="${y0 - 7}" x2="${x(p).toFixed(1)}" y2="${y0 + 7}"
        stroke="currentColor" stroke-width=".9" opacity=".28"/>`).join('')}
    <line x1="${x(v).toFixed(1)}" y1="${y0 - 22}" x2="${x(v).toFixed(1)}" y2="${y0 + 14}"
          stroke="var(--kill)" stroke-width="2"/>
    <circle cx="${x(v).toFixed(1)}" cy="${y0 - 22}" r="4" fill="var(--kill)"/>
    <text x="${x(v).toFixed(1)}" y="${y0 - 31}" text-anchor="middle"
          font-family="ui-monospace,monospace" font-size="11.5" fill="var(--kill)">
      ${sig(v)} ${esc(o.unit || '')}
    </text>
    <text x="${L}" y="${y0 + 28}" font-family="ui-monospace,monospace" font-size="10" fill="var(--ink-3)">${sig(lo)}</text>
    <text x="${W - R}" y="${y0 + 28}" text-anchor="end" font-family="ui-monospace,monospace" font-size="10" fill="var(--ink-3)">${sig(hi)}</text>
  </svg>`;
}

// ---------------------------------------------------------------------------
// the entry
// ---------------------------------------------------------------------------

/* Recompute sigma from the two values and their error bars and say whether it
   matches what was stored. This is the shortest path from "a machine asserts
   this" to "I checked it myself", and it costs one line. */
function auditLine(fig) {
  const s = (fig.series || []).filter((d) => d && Number.isFinite(d.value));
  if (s.length !== 2 || !Number.isFinite(fig.sigma)) return '';
  const joint = Math.sqrt((s[0].err || 0) ** 2 + (s[1].err || 0) ** 2);
  if (!(joint > 0)) return '';
  const got = Math.abs(s[0].value - s[1].value) / joint;
  const ok = Math.abs(got - fig.sigma) < 0.02;
  return `<div class="audit">σ = |${s[0].value.toExponential(4)} − ${s[1].value.toExponential(4)}|
    / √(${(s[0].err || 0).toExponential(3)}² + ${(s[1].err || 0).toExponential(3)}²)
    = <b>${got.toFixed(2)}</b> &nbsp;·&nbsp; stored ${Number(fig.sigma).toFixed(2)}
    <span class="${ok ? 'ok' : 'no'}">${ok ? '✓ agrees' : '✗ does not agree'}</span></div>`;
}

function entry(c, population) {
  const fig = c.figure || {};
  const o = c.observed || {};
  const closed = c.status && c.status !== 'open';

  let svg = null, caption = '';
  if (fig.type === 'interval') {
    svg = interval(fig, c);
    caption = `Solid mark and filled dot: the archive. Dashed mark and open dot: the paper. ` +
      `Both values in ${esc(o.unit || '')}, plotted from the normalised figures the ` +
      `comparison actually used. Dashed regions are where a re-measurement at the precision ` +
      `the kill condition names would have to land to settle it. Ticks step in units of the ` +
      `joint error; the tall one is 3σ, the threshold below which this is not a claim.`;
  } else if (o.value !== undefined && o.value !== null) {
    const pop = population[`${o.source}|${c.quantity}`] || [];
    svg = strip(c, pop);
    caption = pop.length
      ? `${esc(c.object)} against ${pop.length} other ${esc(c.quantity)} values ${esc(o.source)} ` +
        `carries. It is an ordinary entry in a crowded catalogue, which is the point: nothing ` +
        `about it stood out enough for anyone to write it down.`
      : `${esc(c.object)} at its catalogued ${esc(c.quantity)}. No comparison population was ` +
        `available on this load, so the strip shows the value alone.`;
    if (o.ra === null || o.ra === undefined) {
      caption += ` No sky position is drawn because ${esc(o.source)} does not publish coordinates ` +
        `for these events.`;
    }
  }

  const links = [];
  if (o.url) links.push(`<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.source || 'archive')} record ↗</a>`);
  /* The archive side has a URL. The paper side has a year, a value and the
     sentence it came from, and no identifier at all — the extractor keeps no
     DOI. Drawing a link glyph there would invent a citation, and leaving the
     space blank reads as an oversight, so the gap is named. */
  if (c.kind === 'tension' && c.reported && !c.reported.record_id) {
    links.push(`<span style="color:var(--dead)">paper not identified — value traced to its sentence only</span>`);
  }
  if (o.reference) links.push(`on the authority of <b>${esc(o.reference)}</b>`);
  if (Number.isFinite(o.ra) && Number.isFinite(o.dec)) links.push(`ra <b>${sig(o.ra, 7)}</b> dec <b>${sig(o.dec, 6)}</b>`);
  if (o.lit_count === 0) links.push(`papers naming it <b>0</b>`);
  if (c.opened_at) links.push(`open since <b>${esc(String(c.opened_at).slice(0, 10))}</b>`);

  return `<article class="entry${closed ? ' closed' : ''}">
    <div class="head">
      <span class="cid">${esc(c.claim_id)}</span>
      <span class="chip ${esc(c.status || 'open')}">${esc(c.status || 'open')}</span>
      <span class="chip">${esc(c.kind)}</span>
      ${Number.isFinite(c.sigma) ? `<span class="sig num">${Number(c.sigma).toFixed(2)}σ</span>` : ''}
    </div>
    <h2>${esc(c.title)}</h2>
    <p class="said">${esc(c.statement)}</p>
    ${svg ? `<figure>${svg}<figcaption>${caption}</figcaption></figure>` : ''}
    ${c.kill ? `<div class="killrow"><span class="lab">What would end this</span>
      <p>${esc(c.kill)}</p></div>` : ''}
    ${fig.type === 'interval' ? auditLine(fig) : ''}
    <div class="meta">${links.join('<span></span>')}${c.cost ? `<span>${esc(c.cost)}</span>` : ''}</div>
    ${closed && c.resolution ? `<div class="retracted"><span class="lab">${esc(c.status)}</span>
      ${esc(c.resolution)}</div>` : ''}
  </article>`;
}

// ---------------------------------------------------------------------------
// load
// ---------------------------------------------------------------------------

async function get(path) {
  const r = await fetch(`${SUPA_URL}/rest/v1/${path}`, {
    headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` },
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* Populations for the strips: every value of a quantity a source carries, so an
   orphan can be shown among its own catalogue rather than alone. Failing to get
   them is not fatal — the strip degrades to the single value and says so. */
function index(rows) {
  const by = {};
  for (const r of rows || []) {
    if (!Number.isFinite(Number(r.value))) continue;
    const k = `${r.source}|${r.quantity}`;
    (by[k] = by[k] || []).push(Number(r.value));
  }
  return by;
}

function render(claims, population, live, note) {
  const open = claims.filter((c) => !c.status || c.status === 'open');
  const closed = claims.filter((c) => c.status && c.status !== 'open');

  /* Strongest disagreement first, then the unwritten-about, then everything
     that has been closed — which stays on the page. A register that dropped its
     retractions would be the one document this instrument must never produce. */
  const rank = (c) => (Number.isFinite(c.sigma) ? -1000 + -c.sigma : 0);
  open.sort((a, b) => (rank(a) - rank(b))
    || String(b.opened_at || '').localeCompare(String(a.opened_at || '')));

  const tension = open.filter((c) => c.kind === 'tension').length;
  $('#tally').innerHTML = `
    <div><b>${open.length}</b><span>open</span></div>
    <div><b>${tension}</b><span>tensions</span></div>
    <div><b>${open.length - tension}</b><span>unexplained</span></div>
    ${closed.length ? `<div class="w"><b>${closed.length}</b><span>withdrawn</span></div>` : ''}`;

  $('#prov').innerHTML = live
    ? `Read live from the claims register. <b>${claims.length}</b> claims in total, of which
       <b>${open.length}</b> are open. Every one survived a search that could have refuted it;
       ${closed.length ? `<b>${closed.length}</b> did not, and ${closed.length === 1 ? 'it is' : 'they are'}
       still here with the reason.` : 'none have been closed yet.'}`
    : `<b>Showing a stored copy.</b> The live register could not be reached${note ? ` — ${esc(note)}` : ''},
       so this is the last known state and may be out of date. The counts and every value below are
       verbatim from that copy, not reconstructed.`;

  $('#register').innerHTML = open.concat(closed).length
    ? open.concat(closed).map((c) => entry(c, population)).join('')
    : `<div class="state"><h2>Nothing is open.</h2>
        <p>The register is empty. That is a real state and not an error: every comparison this
        instrument has run either agreed, or lacked an error bar on one side, or could not be
        traced to the text it came from — and none of those is a claim.</p></div>`;
}

function safely(fn) {
  /* A thrown render used to leave a filled masthead above an empty register,
     which is indistinguishable from a frontier with nothing open. Those are
     opposite facts and must never look alike. */
  try { fn(); } catch (e) {
    document.querySelector('#register').innerHTML =
      `<div class="state"><h2>This page failed to draw the register.</h2>
        <p>The claims were fetched but something went wrong rendering them, so nothing below is
        trustworthy and none of it is shown. This is a fault in the page, not an empty frontier.</p>
        <p class="num" style="color:var(--dead)">${esc(String(e && e.message || e))}</p></div>`;
  }
}

(async () => {
  try {
    const [claims, obs] = await Promise.all([
      get('claims?select=*&order=opened_at.desc&limit=200'),
      get('observations?select=source,quantity,value&limit=2000').catch(() => []),
    ]);
    if (!Array.isArray(claims)) throw new Error('unexpected reply');
    safely(() => render(claims, index(obs), true));
  } catch (e) {
    safely(() => render(SNAPSHOT, index(SNAPSHOT.map((c) => ({
      source: (c.observed || {}).source, quantity: c.quantity, value: (c.observed || {}).value,
    }))), false, String(e && e.message || e)));
  }
})();
</script>
