<style>
/* Light-first and committed to it. One accent, one warning colour, one
   confirmation colour. Everything else is ink on paper. */
:root{
  --ground:#F2F4F8;
  --card:#FFFFFF;
  --ink:#0C1017;
  --ink-2:#4A5261;
  --ink-3:#8B94A6;
  --hair:#E2E7EF;
  --rule:#CBD3E0;
  --accent:#2B4BFF;
  --accent-soft:rgba(43,75,255,.09);
  --accent-line:rgba(43,75,255,.28);
  --kill:#B4620A;
  --kill-soft:rgba(180,98,10,.10);
  --live:#0E7C58;
  --dead:#A33A48;
  --ui:"Inter","Helvetica Neue",Helvetica,"Segoe UI",Roboto,system-ui,sans-serif;
  --num:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  /* A faint measured grid. The instrument is graph paper, not a dashboard. */
  background-image:
    linear-gradient(rgba(43,75,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(43,75,255,.045) 1px,transparent 1px);
  background-size:44px 44px;
  color:var(--ink);
  font:15px/1.55 var(--ui);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:680px;margin:0 auto;padding:0 18px 96px}

/* ---------- masthead ---------- */
header{
  position:sticky;top:0;z-index:20;
  margin:0 -18px;padding:14px 18px 0;
  background:linear-gradient(var(--ground) 76%,transparent);
  backdrop-filter:blur(8px);
}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{margin:0;font:600 17px/1 var(--ui);letter-spacing:.30em}
.brand .dot{
  width:7px;height:7px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft);align-self:center;
}
.brand .now{margin-left:auto;font:11px/1 var(--num);color:var(--ink-3);letter-spacing:.06em}

/* Tabs are the only navigation, because there are only two surfaces. */
nav{display:flex;gap:4px;margin:13px 0 0;padding-bottom:12px}
nav button{
  appearance:none;border:1px solid transparent;background:transparent;
  color:var(--ink-3);cursor:pointer;
  font:600 11px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;
  padding:8px 13px;border-radius:999px;
}
nav button:hover{color:var(--ink-2)}
nav button[aria-selected="true"]{
  color:var(--accent);background:var(--card);border-color:var(--accent-line);
  box-shadow:0 1px 2px rgba(12,16,23,.05);
}
nav button .n{font-family:var(--num);letter-spacing:0;opacity:.75;margin-left:6px}

/* ---------- feed ---------- */
.feed{display:flex;flex-direction:column;gap:16px}
.card{
  background:var(--card);
  border:1px solid var(--hair);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 1px 2px rgba(12,16,23,.04),0 8px 24px -18px rgba(12,16,23,.35);
}

/* The figure is the hero — it sits where the image sits in a feed, and it is
   drawn from the numbers in the claim, not chosen to illustrate it. */
.hero{background:linear-gradient(180deg,#FBFCFE,#F5F7FB);border-bottom:1px solid var(--hair);padding:14px 8px 8px}
.hero svg{display:block;width:100%;height:auto}
.hero .cap{padding:2px 12px 4px;font:10px/1.5 var(--num);color:var(--ink-3)}

.body{padding:16px 18px 4px}
.kicker{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font:600 10px/1 var(--ui);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);
}
.tag{border:1px solid var(--rule);border-radius:999px;padding:4px 8px}
.tag.kind{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.tag.open{color:var(--live)}
.tag.withdrawn,.tag.refuted{color:var(--dead)}
/* text-transform on the kicker would turn σ into Σ. */
.kicker .sig{margin-left:auto;font-family:var(--num);letter-spacing:0;font-size:12px;color:var(--ink);text-transform:none}

h2{margin:9px 0 6px;font:600 20px/1.28 var(--ui);letter-spacing:-.011em}
.said{margin:0;color:var(--ink-2);font-size:14.5px}

/* The kill condition is the part that makes a claim a claim. It gets a frame. */
.kill{
  margin:14px 0 0;padding:11px 13px;border-radius:10px;
  background:var(--kill-soft);border:1px solid rgba(180,98,10,.22);
  font-size:13.5px;color:#6E3D06;
}
.kill .lab{
  display:block;font:600 9.5px/1 var(--ui);letter-spacing:.17em;text-transform:uppercase;
  color:var(--kill);margin-bottom:5px;
}

/* ---------- foot of a card: only things that carry state ---------- */
.foot{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:14px;padding:10px 18px;border-top:1px solid var(--hair);
  background:#FAFBFD;
  font:11px/1 var(--num);color:var(--ink-3);
}
.foot a{color:var(--ink-3);text-decoration:none;border-bottom:1px solid var(--hair)}
.foot a:hover{color:var(--accent);border-color:var(--accent-line)}
.watch{
  margin-left:auto;appearance:none;cursor:pointer;
  border:1px solid var(--rule);background:var(--card);color:var(--ink-2);
  border-radius:999px;padding:6px 12px;
  font:600 10px/1 var(--ui);letter-spacing:.13em;text-transform:uppercase;
}
.watch:hover{border-color:var(--accent-line);color:var(--accent)}
.watch[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- watch ---------- */
.moved{
  margin:0 0 10px;padding:10px 13px;border-radius:10px;
  border:1px solid var(--accent-line);background:var(--accent-soft);
  font:12px/1.5 var(--ui);color:var(--ink);
}
.empty{
  padding:34px 22px;text-align:center;color:var(--ink-3);
  border:1px dashed var(--rule);border-radius:16px;background:rgba(255,255,255,.6);
  font-size:14px;
}
.count{margin:0 2px 14px;font:11px/1 var(--num);color:var(--ink-3);letter-spacing:.04em}
[hidden]{display:none!important}
</style>

     "err": 1.1347123e+25,
     "label": "published 2016",
     "value": 1.14665664e+26
    }
   ]
  },
  "status": "withdrawn",
  "opened_at": "2026-08-11T17:08:37.508395+00:00",
  "resolved_at": "2026-09-01T17:34:16.437+00:00",
  "resolution": "Withdrawn by Parallax. This tension was minted before a stated value was required to appear as digits in the text it was read from. The published figure of 19.2 +/- 1.9 Earth masses could not be found in the source abstract on re-check, so the disagreement it reported against the archive value of 11.29 +/- 1.24 rests on a number this system cannot trace. The underlying question is real - the mass of Kepler-10 c has been contested since it was announced as a mega-Earth - but this claim was not evidence for it. Retracted rather than corrected, because a claim whose receipt fails is not a claim with a small error in it."
 }
];

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safely = (fn, fallback) => { try { return fn(); } catch (e) { console.error(e); return fallback; } };

const sci = v => {
  if (!Number.isFinite(v)) return "—";
  const a = Math.abs(v);
  if (a !== 0 && (a >= 1e4 || a < 1e-2)) {
    const e = Math.floor(Math.log10(a));
    return (v / 10 ** e).toFixed(2) + "e" + e;
  }
  return String(Number(v.toPrecision(4)));
};

/* ------------------------------------------------------------------ figures */

// Two measurements with their stated uncertainties on one axis, at the scale
// where the disagreement is visible. Nothing is chosen; everything is computed.
function interval(fig){
  const S = fig.series || [];
  if (S.length < 2) return "";
  const lo = Math.min(...S.map(s => s.value - s.err));
  const hi = Math.max(...S.map(s => s.value + s.err));
  const pad = (hi - lo) * .22 || 1;
  const a = lo - pad, b = hi + pad;
  const W = 640, H = 178, y0 = 96;
  const x = v => 44 + (v - a) / (b - a) * (W - 88);

  let out = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="two measurements with error bars, ${fig.sigma} sigma apart">`;
  S.forEach((s, i) => {
    const c = i === 0 ? "#2B4BFF" : "#B4620A";
    const y = i === 0 ? y0 - 24 : y0 + 24;
    const x1 = x(s.value - s.err).toFixed(1), x2 = x(s.value + s.err).toFixed(1);
    // The band each measurement rules out at one sigma of its own error.
    out += `<rect x="${x1}" y="34" width="${(x2 - x1).toFixed(1)}" height="${H - 68}" fill="${c}" opacity=".07"/>`;
    out += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${c}" stroke-width="2"/>`;
    for (const e of [x1, x2])
      out += `<line x1="${e}" y1="${y - 5}" x2="${e}" y2="${y + 5}" stroke="${c}" stroke-width="2"/>`;
    out += `<circle cx="${x(s.value).toFixed(1)}" cy="${y}" r="4.5" fill="${c}"/>`;
    out += `<text x="${x(s.value).toFixed(1)}" y="${i === 0 ? y - 13 : y + 20}" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#0C1017">${sci(s.value)} ± ${sci(s.err)}</text>`;
    out += `<text x="${x(s.value).toFixed(1)}" y="${i === 0 ? 18 : H - 6}" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" letter-spacing=".08em" fill="#8B94A6">${esc(String(s.label).toUpperCase())}</text>`;
  });
  out += `<line x1="32" y1="${y0}" x2="${W - 32}" y2="${y0}" stroke="#CBD3E0"/>`;
  out += `<text x="${W - 32}" y="${y0 - 8}" text-anchor="end" font-family="ui-monospace,monospace" font-size="10" fill="#8B94A6">${esc(fig.unit || "")}</text>`;
  out += `<text x="32" y="${y0 - 8}" font-family="ui-monospace,monospace" font-size="12" fill="#0C1017">${fig.sigma}σ</text>`;
  return out + `</svg>`;
}

// An orphan's figure is its silence: where its value sits among the objects
// measured beside it, and how many papers name it. The bar is that count.
function silence(claim, cohort){
  const o = claim.observed || {};
  const vals = cohort.map(c => (c.observed || {}).value).filter(Number.isFinite);
  const W = 640, H = 132;
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.object)} among its cohort, named by ${Number(o.lit_count) || 0} papers">`;
  if (vals.length > 1 && Number.isFinite(o.value)) {
    const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo;
    const a = span ? lo - span * .18 : lo * .9, b = span ? hi + span * .18 : hi * 1.1;
    const x = v => 44 + (v - a) / (b - a || 1) * (W - 88);
    out += `<line x1="44" y1="52" x2="${W - 44}" y2="52" stroke="#CBD3E0"/>`;
    for (const v of vals)
      out += `<circle cx="${x(v).toFixed(1)}" cy="52" r="3" fill="#8B94A6" opacity=".55"/>`;
    out += `<line x1="${x(o.value).toFixed(1)}" y1="34" x2="${x(o.value).toFixed(1)}" y2="70" stroke="#2B4BFF" stroke-width="2"/>`;
    out += `<circle cx="${x(o.value).toFixed(1)}" cy="52" r="5" fill="#2B4BFF"/>`;
    out += `<text x="${x(o.value).toFixed(1)}" y="26" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#0C1017">${sci(o.value)} ${esc(o.unit)}</text>`;
    out += `<text x="44" y="88" font-family="Inter,sans-serif" font-size="10" letter-spacing=".08em" fill="#8B94A6">${esc(String(o.quantity || "").toUpperCase())}, AGAINST ${vals.length - 1} OBJECTS SWEPT WITH IT</text>`;
  }
  // The count, to scale against fifty papers. Zero is a bar of no width.
  const n = Number(o.lit_count) || 0;
  out += `<rect x="44" y="${H - 30}" width="${W - 88}" height="14" rx="7" fill="#F2F4F8" stroke="#E2E7EF"/>`;
  if (n > 0) out += `<rect x="44" y="${H - 30}" width="${Math.min(W - 88, n * (W - 88) / 50).toFixed(1)}" height="14" rx="7" fill="#2B4BFF"/>`;
  out += `<text x="${W - 44}" y="${H - 19}" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" fill="${n ? "#0C1017" : "#A33A48"}">${n} papers name it</text>`;
  return out + `</svg>`;
}

/* -------------------------------------------------------------------- state */
const KEY = "parallax.watch.v1";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
const save = w => { try { localStorage.setItem(KEY, JSON.stringify(w)); } catch {} };

let CLAIMS = SNAPSHOT.slice();
let TAB = "frontier";

function figureFor(c){
  const f = c.figure || {};
  if (f.type === "interval") return interval(f);
  const o = c.observed || {};
  const cohort = CLAIMS.filter(x => (x.observed || {}).source === o.source &&
                                    (x.observed || {}).quantity === o.quantity);
  return silence(c, cohort);
}

function card(c, watched){
  const o = c.observed || {};
  const svg = safely(() => figureFor(c), "");
  const state = String(c.status || "open");
  return `<article class="card">
    ${svg ? `<div class="hero">${svg}<div class="cap">${esc(o.source)} · ${esc(o.reference)}${o.url ? ` · <a href="${esc(o.url)}">source</a>` : ""}</div></div>` : ""}
    <div class="body">
      <div class="kicker">
        <span class="tag kind">${esc(c.kind)}</span>
        <span class="tag ${esc(state)}">${esc(state)}</span>
        ${Number.isFinite(c.sigma) ? `<span class="sig">${c.sigma}σ</span>` : ""}
      </div>
      <h2>${esc(c.title)}</h2>
      <p class="said">${esc(c.statement)}</p>
      ${c.kill ? `<div class="kill"><span class="lab">What would end this claim</span>${esc(c.kill)}</div>` : ""}
      ${c.resolution ? `<div class="kill" style="background:rgba(163,58,72,.07);border-color:rgba(163,58,72,.22);color:#7A2A34"><span class="lab" style="color:#A33A48">How it ended</span>${esc(c.resolution)}</div>` : ""}
    </div>
    <div class="foot">
      <span>${esc(c.claim_id)}</span>
      <span>opened ${esc(String(c.opened_at || "").slice(0, 10))}</span>
      <button class="watch" data-id="${esc(c.claim_id)}" aria-pressed="${watched ? "true" : "false"}">${watched ? "Watching" : "Watch"}</button>
    </div>
  </article>`;
}

function render(){
  const w = load();
  const feed = document.getElementById("feed");
  const count = document.getElementById("count");
  document.getElementById("n-frontier").textContent = CLAIMS.length;
  document.getElementById("n-watch").textContent = Object.keys(w).length;
  document.getElementById("tab-frontier").setAttribute("aria-selected", TAB === "frontier");
  document.getElementById("tab-watch").setAttribute("aria-selected", TAB === "watch");

  if (TAB === "frontier") {
    const open = CLAIMS.filter(c => c.status === "open").length;
    count.textContent = `${CLAIMS.length} claims · ${open} open · ${CLAIMS.length - open} closed`;
    feed.innerHTML = CLAIMS.map(c => card(c, !!w[c.claim_id])).join("");
    return;
  }

  // Watch keeps the state a claim was in when it was taken, so that a change
  // to it is visible rather than something you have to remember.
  const kept = CLAIMS.filter(c => w[c.claim_id]);
  count.textContent = kept.length ? `${kept.length} watched` : "";
  if (!kept.length) {
    feed.innerHTML = `<div class="empty">Nothing watched yet. Watch a claim on the Frontier and it is kept here, with the state it was in when you took it, so a move shows.</div>`;
    return;
  }
  feed.innerHTML = kept.map(c => {
    const was = w[c.claim_id] || {};
    const moved = was.status && was.status !== c.status
      ? `<p class="moved">Moved since you watched it: <b>${esc(was.status)}</b> → <b>${esc(c.status)}</b>.</p>` : "";
    return moved + card(c, true);
  }).join("");
}

document.addEventListener("click", e => {
  const b = e.target.closest(".watch");
  if (b) {
    const id = b.dataset.id, w = load();
    if (w[id]) delete w[id];
    else {
      const c = CLAIMS.find(x => x.claim_id === id) || {};
      w[id] = { status: c.status, at: new Date().toISOString() };
    }
    save(w); render(); return;
  }
  const t = e.target.closest('[role="tab"]');
  if (t) { TAB = t.id === "tab-watch" ? "watch" : "frontier"; render(); }
});

document.getElementById("now").textContent =
  new Date().toISOString().slice(0, 16).replace("T", " ") + " UTC";
safely(() => render());

// Live claims when the page can reach the database; the snapshot stands in
// when it cannot, which is the normal case inside a sandboxed frame.
fetch(`${SUPA_URL}/claims?select=*&order=opened_at.desc&limit=200`, {
  headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` }
}).then(r => r.ok ? r.json() : null).then(rows => {
  if (Array.isArray(rows) && rows.length) { CLAIMS = rows; safely(() => render()); }
}).catch(() => {});
</script>
