<title>The Parallax Register</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* ---------------------------------------------------------------- tokens ---
   Light, and only light — no dark palette in this file and no system switch.
   Nothing has a hard edge: every surface is a rounded panel lifted off a warm
   ground by shadow rather than fenced in by a rule. Colour says two things
   only — which field an entry belongs to, and whether it is still open.       */
:root{
  --paper:#F1F0ED;
  --surface:#FFFFFF;
  --sunk:#E9E7E3;
  --ink:#101114;
  --ink-2:#5C6068;
  --ink-3:#979BA3;
  --line:#E9E7E4;
  --astro:#5B54E6;
  --astro-soft:#EEEDFD;
  --gene:#C4703A;
  --gene-soft:#FBF0E8;
  --phys:#1F8C7C;
  --phys-soft:#E7F5F2;
  --live:#DE3F68;
  --live-soft:#FDEDF1;
  --shut:#3E9370;
  --kill:#B07C1B;
  --kill-soft:#FBF3E3;
  --r-lg:24px; --r-md:18px; --r-sm:13px;
  --lift:0 1px 2px rgba(16,17,20,.04), 0 14px 34px -22px rgba(16,17,20,.30);
  --lift-2:0 2px 6px rgba(16,17,20,.05), 0 22px 46px -24px rgba(16,17,20,.36);
  --ui:"Manrope","Helvetica Neue",Helvetica,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);background:var(--paper);
  font:400 16px/1.6 var(--ui);font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;letter-spacing:-.006em;
}
body::before{
  content:"";position:fixed;inset:0 0 auto;height:520px;pointer-events:none;z-index:0;
  background:
    radial-gradient(760px 320px at 18% -8%, rgba(91,84,230,.13), transparent 70%),
    radial-gradient(680px 300px at 88% -14%, rgba(222,63,104,.10), transparent 70%);
}
.shell{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 22px 130px}
:where(button,input,a,summary,select):focus-visible{outline:2px solid var(--astro);outline-offset:3px;border-radius:8px}

/* ---------------------------------------------------------- floating nav --- */
.bar{position:sticky;top:14px;z-index:40;display:flex;justify-content:center;padding:16px 0 0}
.tabs{
  display:flex;align-items:center;gap:4px;padding:6px;
  background:rgba(255,255,255,.86);backdrop-filter:blur(14px) saturate(1.4);
  border-radius:999px;box-shadow:var(--lift-2);
}
.tabs button{
  appearance:none;border:0;cursor:pointer;background:transparent;color:var(--ink-2);
  font:600 13px/1 var(--ui);padding:10px 17px;border-radius:999px;
  transition:background .15s,color .15s;
}
.tabs button:hover{color:var(--ink);background:rgba(16,17,20,.045)}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.tabs button .n{font-family:var(--mono);font-size:11px;opacity:.55;margin-left:7px}

/* ---------------------------------------------------------- page heading ---
   Each surface introduces itself. The register's argument belongs on the
   Feed, and repeating it above Watch or the Workbench would be furniture.     */
.mast{padding:34px 0 0;text-align:center}
.mark{display:flex;align-items:center;justify-content:center;gap:11px}
.mark svg{width:30px;height:30px;flex:none}
.mark h1{margin:0;font:800 27px/1 var(--ui);letter-spacing:-.035em}
.lede{margin:16px auto 0;max-width:60ch;font:400 19px/1.5 var(--ui);color:var(--ink-2);letter-spacing:-.012em;text-wrap:balance}
.lede b{color:var(--ink);font-weight:700}
.tally{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:20px 0 0;padding:0;list-style:none;font:500 13px/1 var(--ui);color:var(--ink-2)}
.tally li{background:rgba(255,255,255,.72);padding:9px 15px;border-radius:999px;box-shadow:var(--lift)}
.tally b{color:var(--ink);font-weight:700}
.tally .hot b{color:var(--live)}
.stamp{display:block;margin:18px 0 0;font:400 11.5px/1 var(--mono);color:var(--ink-3)}
.mast.left{max-width:74ch;margin:0 auto;text-align:left}
.mast.left .lede{margin-left:0;text-align:left}

/* ----------------------------------------------------------- filter row --- */
.sift{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:26px 0 2px}
.chip{
  appearance:none;cursor:pointer;background:rgba(255,255,255,.8);border:0;
  padding:9px 15px;border-radius:999px;font:600 13px/1 var(--ui);color:var(--ink-2);
  box-shadow:var(--lift);transition:background .15s,color .15s,transform .12s;
}
.chip:hover{color:var(--ink);transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.sift input{
  flex:1;min-width:190px;background:rgba(255,255,255,.8);color:var(--ink);border:0;
  padding:11px 17px;border-radius:999px;font:500 13.5px/1 var(--ui);box-shadow:var(--lift);
}
.sift input::placeholder{color:var(--ink-3)}

/* ---------------------------------------------------------------- tiles --- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:22px 0 0}
@media(max-width:940px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.grid{grid-template-columns:1fr}}
.tile{
  display:flex;flex-direction:column;gap:11px;text-align:left;cursor:pointer;
  background:var(--surface);border:0;border-radius:var(--r-lg);box-shadow:var(--lift);
  padding:20px 21px 21px;min-height:206px;font:inherit;color:inherit;
  transition:box-shadow .18s,transform .18s;
}
.tile:hover{box-shadow:var(--lift-2);transform:translateY(-3px)}
@media (prefers-reduced-motion:reduce){.tile,.chip{transition:none}.tile:hover{transform:none}}
.tile.wide{grid-column:span 2;background:linear-gradient(152deg,#FFFFFF 58%,var(--astro-soft))}
@media(max-width:620px){.tile.wide{grid-column:span 1}}
.tile.closed{background:var(--sunk);box-shadow:none}
.head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pill{padding:5px 11px;border-radius:999px;font:600 11.5px/1 var(--ui);background:var(--astro-soft);color:var(--astro)}
.genomics .pill.fld{background:var(--gene-soft);color:var(--gene)}
.physics .pill.fld{background:var(--phys-soft);color:var(--phys)}
.pill.kind{background:rgba(16,17,20,.05);color:var(--ink-2)}
.pill.kept{background:var(--ink);color:#fff}
.head .state{margin-left:auto;font:600 11.5px/1 var(--ui);color:var(--live)}
.closed .head .state,.detail .eyebrow .state{color:var(--shut)}
.tile h3{margin:0;font:700 clamp(18px,1.6vw,22px)/1.22 var(--ui);letter-spacing:-.027em;text-wrap:balance}
.tile.wide h3{font-size:clamp(22px,2.3vw,29px);letter-spacing:-.032em}
.tile .hook{margin:0;font:400 14.5px/1.5 var(--ui);color:var(--ink-2)}
.tile .spark{margin-top:auto;padding-top:12px}
.tile .spark svg{display:block;width:100%;height:auto}
.tile .metric{margin-top:auto;padding-top:12px;display:flex;align-items:baseline;gap:8px;font:500 13px/1 var(--ui);color:var(--ink-3)}
.tile .metric b{font:800 24px/1 var(--ui);color:var(--live);letter-spacing:-.03em}
.tile.closed .metric b{color:var(--shut)}

/* -------------------------------------------------------------- detail ---- */
.back{
  appearance:none;background:rgba(255,255,255,.8);border:0;cursor:pointer;
  margin:24px 0 0;padding:9px 16px;border-radius:999px;box-shadow:var(--lift);
  font:600 13px/1 var(--ui);color:var(--ink-2);
}
.back:hover{color:var(--ink)}
.detail{max-width:70ch;margin:0 auto;padding:20px 0 0}
.detail .eyebrow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.detail h2{margin:18px 0 0;font:800 clamp(30px,4.2vw,46px)/1.06 var(--ui);letter-spacing:-.042em;text-wrap:balance}
.detail .plain{margin:18px 0 0;font:400 19.5px/1.55 var(--ui);color:var(--ink);letter-spacing:-.012em}
.detail .said{margin:16px 0 0;font:400 15.5px/1.62 var(--ui);color:var(--ink-2)}
.layer{margin:34px auto 0;max-width:74ch}
.layer > h4{margin:0 0 12px;font:700 13px/1 var(--ui);color:var(--ink-3)}

/* What turns on the answer. This is the part a reader is here for, so it is
   the largest block on the page and it is never optional. */
.stakes{background:#fff;border-radius:var(--r-lg);box-shadow:var(--lift);padding:24px 26px}
.stakes h4{margin:0 0 10px;font:800 19px/1.2 var(--ui);letter-spacing:-.028em;color:var(--ink)}
.stakes p{margin:0;font:400 17px/1.62 var(--ui);color:var(--ink-2)}

.plate{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--lift);padding:18px 16px 10px}
.plate svg{display:block;width:100%;height:auto}
.plate .cap{padding:10px 6px 2px;font:400 12px/1.5 var(--ui);color:var(--ink-3)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.sides div{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--lift);padding:16px 17px}
.sides dt{margin:0 0 7px;font:600 12px/1.3 var(--ui);color:var(--ink-3)}
.sides dd{margin:0;font:800 21px/1.15 var(--ui);letter-spacing:-.03em}
.sides dd span{font:500 12px/1 var(--mono);color:var(--ink-3)}
.sides p{margin:8px 0 0;font:400 13px/1.45 var(--ui);color:var(--ink-3)}
@media(max-width:620px){.sides{grid-template-columns:1fr}}

.guess{background:var(--live-soft);border-radius:var(--r-md);padding:20px 21px;margin:20px 0 0}
.guess p{margin:0 0 14px;font:700 17px/1.35 var(--ui);letter-spacing:-.018em}
.guess .opts{display:flex;gap:9px;flex-wrap:wrap}
.guess button{
  appearance:none;cursor:pointer;background:#fff;border:0;border-radius:999px;color:var(--ink);
  padding:11px 18px;font:600 13.5px/1.2 var(--ui);box-shadow:var(--lift);transition:background .15s,color .15s;
}
.guess button:hover{background:var(--live);color:#fff}
.guess .said-you{margin:0;font:400 14.5px/1.55 var(--ui);color:var(--ink-2)}
.guess .said-you b{color:var(--live);font-weight:700}

.kill{margin:14px 0 0;background:var(--kill-soft);border-radius:var(--r-md);padding:19px 21px}
.kill .lab{display:block;font:700 12px/1 var(--ui);color:var(--kill);margin-bottom:8px}
.kill p{margin:0;font:400 15.5px/1.6 var(--ui);color:#6C4E12}
.nokill{background:rgba(16,17,20,.045)}
.nokill .lab{color:var(--ink-3)}
.nokill p{color:var(--ink-2)}

.cites{margin:14px 0 0;padding:0;list-style:none;font:400 12.5px/1.85 var(--mono);color:var(--ink-3)}
.foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:28px 0 0;font:400 11.5px/1 var(--mono);color:var(--ink-3)}
.foot a{color:var(--ink-2)}
.keep{
  margin-left:auto;appearance:none;cursor:pointer;background:#fff;border:0;border-radius:999px;
  padding:11px 20px;font:600 13px/1 var(--ui);color:var(--ink-2);box-shadow:var(--lift);
}
.keep:hover{color:var(--ink)}
.keep[aria-pressed="true"]{background:var(--astro);color:#fff}

/* ------------------------------------------------------------ workbench --- */
.bench{max-width:74ch;margin:0 auto;padding:8px 0 0}
.form{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 0}
.form input,.form select{
  background:#fff;border:0;border-radius:999px;color:var(--ink);
  padding:13px 19px;font:500 14px/1 var(--ui);box-shadow:var(--lift);
}
.form input{flex:1;min-width:230px}
.form button{
  appearance:none;cursor:pointer;background:var(--ink);border:0;border-radius:999px;color:#fff;
  padding:13px 26px;font:600 13.5px/1 var(--ui);
}
.form button[disabled]{opacity:.45;cursor:progress}
.panel{background:#fff;border-radius:var(--r-lg);box-shadow:var(--lift);padding:22px 24px;margin:18px 0 0}
.panel h4{margin:0 0 14px;font:800 17px/1.2 var(--ui);letter-spacing:-.024em}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{
  position:relative;padding:0 0 16px 40px;font:400 14.5px/1.55 var(--ui);color:var(--ink-2);
  border-left:2px solid var(--line);margin-left:11px;
}
.steps li:last-child{border-left-color:transparent;padding-bottom:0}
.steps li::before{
  counter-increment:s;content:counter(s);position:absolute;left:-13px;top:-2px;
  width:24px;height:24px;border-radius:999px;background:var(--astro-soft);color:var(--astro);
  font:700 11.5px/24px var(--ui);text-align:center;
}
.steps b{color:var(--ink);font-weight:700}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.rules li{background:var(--kill-soft);border-radius:var(--r-sm);padding:12px 15px;font:400 14px/1.5 var(--ui);color:#6C4E12}
.rules b{color:var(--kill);font-weight:700;display:block;margin-bottom:2px}
.srcs{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.srcs li{display:flex;gap:14px;padding:10px 2px;font:400 14px/1.5 var(--ui);color:var(--ink-2);border-bottom:1px solid var(--line)}
.srcs li:last-child{border-bottom:0}
.srcs code{font:500 12.5px/1.5 var(--mono);color:var(--astro);min-width:150px}
.out{
  margin:18px 0 0;background:#fff;border-radius:var(--r-md);box-shadow:var(--lift);padding:18px;
  font:400 12px/1.6 var(--mono);color:var(--ink-2);white-space:pre-wrap;word-break:break-word;
  max-height:460px;overflow:auto;
}
.out b{color:var(--ink)}

/* -------------------------------------------------------------- generic --- */
.verdict{margin:14px auto 0;max-width:74ch;font:800 clamp(26px,3.4vw,38px)/1.12 var(--ui);letter-spacing:-.042em;text-wrap:balance}
.verdict em{font-style:normal;color:var(--live)}
.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:28px auto 0;max-width:74ch}
.ledger div{background:#fff;border-radius:var(--r-md);box-shadow:var(--lift);padding:20px}
.ledger dt{margin:0 0 8px;font:600 12.5px/1 var(--ui);color:var(--ink-3)}
.ledger dd{margin:0;font:800 32px/1 var(--ui);letter-spacing:-.04em}
.ledger dd small{font:600 13px/1 var(--ui);color:var(--ink-3);margin-left:4px}
.ledger p{margin:10px 0 0;font:400 13.5px/1.5 var(--ui);color:var(--ink-3)}
.prose{margin:28px auto 0;max-width:74ch;font:400 17px/1.62 var(--ui);color:var(--ink-2)}
.prose b{color:var(--ink);font-weight:700}
.hollow{padding:56px 30px;text-align:center;color:var(--ink-2);background:rgba(255,255,255,.6);border-radius:var(--r-lg);font:400 17px/1.55 var(--ui);max-width:54ch;margin:28px auto 0}
.moved{margin:0;padding:14px 18px;border-radius:var(--r-md);background:var(--live-soft);font:500 14.5px/1.5 var(--ui)}

/* ---------------------------------------------------------- entry layout ---
   Two columns, not a stack of identical cards: a reading column that behaves
   like a page, and a rail that stays with you carrying the numbers, your
   position on the question, and the way to ask about it. */
.entry-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:44px;align-items:start;padding:18px 0 0}
@media(max-width:1000px){.entry-wrap{grid-template-columns:1fr;gap:26px}}
.read{max-width:66ch;min-width:0}
.rail{position:sticky;top:92px;display:grid;gap:14px}
@media(max-width:1000px){.rail{position:static}}

.read h2{margin:16px 0 0;font:800 clamp(30px,4vw,44px)/1.05 var(--ui);letter-spacing:-.042em;text-wrap:balance}
.read .plain{margin:18px 0 0;font:400 19.5px/1.55 var(--ui);color:var(--ink-2)}
/* The stakes are the reason to read the entry, so they are set as a passage
   with a rule beside them rather than boxed like everything else. */
.stakes{margin:34px 0 0;padding:2px 0 2px 26px;border-left:3px solid var(--live);background:none;box-shadow:none;border-radius:0}
.stakes h4{margin:0 0 12px;font:800 13px/1 var(--ui);color:var(--live)}
.stakes p{margin:0;font:400 19px/1.6 var(--ui);color:var(--ink);letter-spacing:-.014em}
.section{margin:38px 0 0;padding-top:22px;border-top:1px solid rgba(16,17,20,.09)}
.section > h4{margin:0 0 16px;font:800 13px/1 var(--ui);color:var(--ink-3)}
.figwrap{margin:0}
.figwrap svg{display:block;width:100%;height:auto}
.figwrap .cap{margin:12px 0 0;font:400 13px/1.5 var(--ui);color:var(--ink-3)}
.killnote{margin:0;font:400 17px/1.62 var(--ui);color:var(--ink-2)}
.killnote b{display:block;font:800 13px/1 var(--ui);color:var(--kill);margin-bottom:10px}

/* rail cards */
.card{background:#fff;border-radius:var(--r-md);box-shadow:var(--lift);padding:17px 18px}
.card h5{margin:0 0 12px;font:800 12px/1 var(--ui);color:var(--ink-3)}
.readout{display:grid;gap:12px}
.readout .row{display:grid;gap:3px}
.readout .who{font:600 12px/1.3 var(--ui);color:var(--ink-3)}
.readout .val{font:800 21px/1.1 var(--ui);letter-spacing:-.032em}
.readout .val small{font:500 11.5px/1 var(--mono);color:var(--ink-3);margin-left:4px}
.readout .gap{
  display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:999px;
  background:var(--live-soft);color:var(--live);font:800 13px/1 var(--ui);justify-content:center;
}
.rail .keep{margin:0;width:100%;justify-content:center;text-align:center}
.myguess{background:var(--astro-soft);border-radius:var(--r-md);padding:15px 17px;font:400 13.5px/1.5 var(--ui);color:var(--ink-2)}
.myguess b{color:var(--astro);font-weight:700}

/* Ask Parallax */
.ask h5{color:var(--astro)}
.ask .qs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 11px}
.ask .qs button{
  appearance:none;cursor:pointer;border:0;background:rgba(16,17,20,.045);color:var(--ink-2);
  border-radius:999px;padding:7px 11px;font:600 11.5px/1.25 var(--ui);text-align:left;
}
.ask .qs button:hover{background:var(--astro-soft);color:var(--astro)}
.ask form{display:flex;gap:7px}
.ask input{
  flex:1;min-width:0;border:0;background:rgba(16,17,20,.045);border-radius:999px;
  padding:10px 14px;font:500 13px/1 var(--ui);color:var(--ink);
}
.ask input::placeholder{color:var(--ink-3)}
.ask .go{appearance:none;cursor:pointer;border:0;background:var(--astro);color:#fff;border-radius:999px;padding:10px 15px;font:700 12.5px/1 var(--ui)}
.ask .go[disabled]{opacity:.5;cursor:progress}
.ask .out{margin:13px 0 0;font:400 14px/1.6 var(--ui);color:var(--ink-2);white-space:pre-wrap}
.ask .said{margin:0 0 8px;font:700 13px/1.4 var(--ui);color:var(--ink)}
.ask .fine{margin:11px 0 0;font:400 11.5px/1.45 var(--ui);color:var(--ink-3)}

/* ------------------------------------------------------------ watch rows ---
   Watch is a list of positions, not a second copy of the feed. */
.pos{background:#fff;border-radius:var(--r-md);box-shadow:var(--lift);padding:18px 20px;display:grid;gap:10px}
.pos .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pos h3{margin:0;font:700 19px/1.25 var(--ui);letter-spacing:-.026em}
.pos .line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font:400 13.5px/1.5 var(--ui);color:var(--ink-2)}
.pos .line b{font-weight:700;color:var(--ink)}
.pos .await{font:400 13.5px/1.55 var(--ui);color:var(--ink-3)}
.pos .await b{color:var(--kill);font-weight:700}
.pos .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.pos .acts button{appearance:none;cursor:pointer;border:0;border-radius:999px;padding:8px 14px;font:600 12.5px/1 var(--ui);background:rgba(16,17,20,.05);color:var(--ink-2)}
.pos .acts button:hover{background:rgba(16,17,20,.09);color:var(--ink)}
.stack{display:grid;gap:14px;max-width:74ch;margin:0 auto}

/* ---------------------------------------------------------- bench subnav --- */
.subnav{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 20px}
.subnav button{appearance:none;cursor:pointer;border:0;border-radius:999px;padding:9px 15px;font:600 13px/1 var(--ui);background:rgba(255,255,255,.8);color:var(--ink-2);box-shadow:var(--lift)}
.subnav button[aria-selected="true"]{background:var(--ink);color:#fff}
[hidden]{display:none!important}
</style>

<div class="shell">
  <div class="bar">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-feed" aria-selected="true">Feed<span class="n" id="n-feed"></span></button>
      <button role="tab" id="tab-watch" aria-selected="false">Watch<span class="n" id="n-watch"></span></button>
      <button role="tab" id="tab-bench" aria-selected="false">Workbench</button>
      <button role="tab" id="tab-record" aria-selected="false">Record<span class="n" id="n-record"></span></button>
    </div>
  </div>
  <header class="mast" id="mast"></header>
  <main id="main"></main>
</div>

    digits. Fermilab measured it to extraordinary precision. The catch is that the prediction
    depends on a hadronic term computed two ways — from experimental electron-positron data,
    and from lattice QCD — and those two disagree with each other by more than either
    disagrees with the measurement.`,
  stakes:`This was the leading candidate for new physics beyond the Standard Model for two
    decades: a confirmed gap would point at particles nobody has produced. But the claim can
    only be as good as the prediction, and the prediction is now the contested part. Until the
    hadronic vacuum polarisation term is settled, the experiment cannot tell you anything about
    new physics — a precisely measured number held against a disputed prediction is not
    evidence. It is the cleanest live example of a measurement outrunning the theory it is
    meant to test.`,
  sides:[
    {label:"Data-driven prediction", value:116591810, err:43, unit:"×10⁻¹¹", source:"Theory Initiative 2020, R-ratio", note:"Hadronic term from e⁺e⁻ annihilation data."},
    {label:"Lattice prediction", value:116591954, err:55, unit:"×10⁻¹¹", source:"BMW lattice QCD 2021", note:"Hadronic term computed from first principles."}],
  sigma:null,
  guess:"Which prediction do you trust — the data-driven one or the lattice?",
  kill:`Independent lattice groups reproducing the BMW hadronic term at the same precision, or a
    resolution of the discrepancy in the e⁺e⁻ cross-section data between experiments. Whichever
    way it lands, the experimental number stays where it is; only its meaning changes.`,
  cites:["Aoyama et al., Phys Rep 887, 1 (2020)","Borsanyi et al., Nature 593, 51 (2021)","Muon g−2 Collaboration, PRL 131, 161802 (2023)"]
},
{
  id:"DAMA", field:"physics", kind:"disagreement", status:"open",
  title:"One detector has seen dark matter for twenty years. No other has.",
  hook:"A signal at very high statistical significance that every competing experiment excludes.",
  plain:`The DAMA/LIBRA detector under Gran Sasso reports an annual modulation in its count rate —
    exactly the signature expected as Earth's velocity through the galactic dark-matter halo
    changes over a year — at a significance above 9σ. Experiments using other target materials
    rule out the interpretation. Experiments using the same target material, sodium iodide, are
    now reporting no modulation.`,
  stakes:`If DAMA is right, dark matter has been detected and the entire field has been looking
    with the wrong materials. If it is wrong, a 9σ signal — a level of significance that would
    be called a discovery anywhere else — has been produced by an unmodelled environmental
    effect that survived twenty years of checking. Either conclusion is important, and the
    second is the more instructive: it puts a number on how far statistical significance alone
    can carry a claim.`,
  sides:[
    {label:"DAMA/LIBRA modulation", value:9.5, err:0, unit:"σ", source:"DAMA/LIBRA phase 2", note:"Annual modulation, period and phase as predicted."},
    {label:"Independent NaI searches", value:0, err:0, unit:"σ", source:"ANAIS-112, COSINE-100", note:"Same target material, no modulation found."}],
  sigma:null,
  guess:"Signal, or an environmental effect nobody has identified?",
  kill:`ANAIS-112 and COSINE-100 reaching DAMA's exposure with the same sodium-iodide target.
    Same material, same signature, independent apparatus — that is a direct test, and it is
    a few years from completion.`,
  cites:["Bernabei et al., Nucl Phys At Energy 19, 307 (2018)","Amaré et al., PRL 123, 031301 (2019)"]
},
{
  id:"PROTON", field:"physics", kind:"disagreement", status:"settled",
  title:"The proton was the wrong size for seven years",
  hook:"Swap the electron in a hydrogen atom for a muon and the proton appeared 4% smaller. The muon was right.",
  plain:`Measuring the proton's charge radius with ordinary hydrogen gave 0.877 femtometres.
    Measuring it with muonic hydrogen in 2010 gave 0.842 — a 7σ discrepancy that stood for
    years and drew serious proposals for new physics. Later electron-scattering and hydrogen
    spectroscopy measurements converged on the smaller value.`,
  stakes:`It is here as a worked example of the register's own logic. The tension was real, the
    error bars were honest, and the resolution came from redoing the harder measurement rather
    than from any new particle. The recommended value moved, several precision measurements
    that depended on it moved with it, and no new physics was required. Most tensions end
    this way, which is exactly why each one has to state in advance what would settle it.`,
  sides:[
    {label:"Electronic hydrogen", value:0.8775, err:0.0051, unit:"fm", source:"CODATA 2010", note:"The accepted value before 2010."},
    {label:"Muonic hydrogen", value:0.84087, err:0.00039, unit:"fm", source:"Pohl et al. 2010", note:"An order of magnitude more precise, and 7σ away."}],
  sigma:7.0,
  history:[
    {year:2010, value:0.8775, err:0.0051, method:"electron", source:"CODATA 2010"},
    {year:2010, value:0.84087, err:0.00039, method:"muon", source:"Pohl et al."},
    {year:2019, value:0.831, err:0.008, method:"electron", source:"PRad"},
    {year:2018, value:0.8414, err:0.0019, method:"recommended", source:"CODATA 2018"}],
  history_note:"The recommended value moved to meet the muonic measurement, not the other way round.",
  kill:`Settled. The kill condition was an independent electron-based measurement at comparable
    precision; PRad and the 2S–4P hydrogen spectroscopy provided it, and the discrepancy closed.`,
  cites:["Pohl et al., Nature 466, 213 (2010)","Xiong et al., Nature 575, 147 (2019)"]
},
{
  id:"LITHIUM", field:"astronomy", kind:"disagreement", status:"open",
  title:"There is three times less lithium than the Big Bang made",
  hook:"The calculation that gets hydrogen and helium right gets the third element wrong by a factor of three.",
  plain:`Big Bang nucleosynthesis predicts the abundance of the light elements from one number,
    the baryon density, which the CMB fixes independently. For hydrogen and helium the
    prediction matches observation beautifully. For lithium-7 it overshoots what is seen in the
    oldest stars by about a factor of three.`,
  stakes:`Primordial nucleosynthesis is one of the two pillars of Big Bang cosmology — it is
    how we know the universe was once hot and dense. A single element failing at a factor of
    three either means old stars destroy lithium in a way stellar models do not capture, which
    would revise the physics of stellar interiors, or that something decayed during the first
    minutes and altered the yield, which would be physics beyond the Standard Model operating
    at an epoch nothing else probes. The abundance of every other light element constrains how
    much room there is for the second option.`,
  sides:[
    {label:"Predicted", value:5.0, err:0.3, unit:"×10⁻¹⁰", source:"BBN with Planck baryon density", note:"From the calculation that gets helium right."},
    {label:"Observed", value:1.6, err:0.3, unit:"×10⁻¹⁰", source:"Spite plateau, metal-poor stars", note:"Remarkably flat across a wide range of old stars."}],
  sigma:null,
  guess:"Stars destroyed it, or the early-universe physics is incomplete?",
  kill:`Asteroseismology of metal-poor halo stars measuring the depth of convective mixing
    directly. If it is deep enough to have destroyed two-thirds of the surface lithium, the
    problem is stellar and the cosmology stands. If it is not, the problem is primordial.`,
  cites:["Fields, Annu Rev Nucl Part Sci 61, 47 (2011)","Spite & Spite, Nature 297, 483 (1982)"]
},
{
  id:"S8", field:"astronomy", kind:"disagreement", status:"open",
  title:"The universe looks smoother than the early universe says it should",
  hook:"Weigh the clumpiness of matter two ways and the answers pull apart — mildly, and always in the same direction.",
  plain:`Run the cosmic microwave background forward under standard cosmology and you can predict
    how clumpy matter should be today. Measure that clumpiness directly, by the way galaxies
    distort the light passing them, and the direct measurement keeps coming back smoother.`,
  stakes:`On its own this is a 2–3σ result, which is not enough to claim anything. It matters
    because it is the second discrepancy pointing the same way as the expansion-rate tension —
    both are the late universe disagreeing with what the early universe predicts. If both
    survive better data they are one problem, not two, and they jointly rule out most of the
    proposed fixes for either. If lensing systematics or baryonic feedback modelling explains
    this one, the Hubble tension loses its corroborating evidence.`,
  sides:[
    {label:"Predicted from the CMB", value:0.834, err:0.016, unit:"S₈", source:"Planck 2018", note:"Extrapolated forward 13.8 billion years."},
    {label:"Measured by lensing", value:0.759, err:0.024, unit:"S₈", source:"KiDS-1000", note:"From the distortion of distant galaxy shapes."}],
  sigma:2.6,
  kill:`Euclid or LSST weak lensing at percent-level precision with baryonic feedback calibrated
    against hydrodynamic simulations. At that precision the gap either becomes a detection or
    disappears.`,
  cites:["Heymans et al., A&A 646, A140 (2021)","Planck Collaboration, A&A 641, A6 (2020)"]
},
{
  id:"SOLAR", field:"astronomy", kind:"disagreement", status:"open",
  title:"We know the inside of the Sun better than its surface composition",
  hook:"Improving the measurement of what the Sun is made of broke the model that had described its interior perfectly.",
  plain:`Helioseismology — reading the Sun's interior from its surface oscillations — matched the
    standard solar model to a fraction of a percent. Then spectroscopic analyses using better
    3D atmosphere modelling revised the solar oxygen and carbon abundances downward, and the
    agreement broke: predicted sound speed, convection zone depth and helium abundance all
    stopped matching.`,
  stakes:`The Sun is the calibration standard for every other star. Its composition sets the
    reference scale used to infer the ages and metallicities of stellar populations across
    astronomy, and the solar model is the template for stellar interiors generally. A
    discrepancy here propagates outward into stellar ages, exoplanet host characterisation and
    galactic chemical evolution. Either the improved abundance analysis is wrong, or opacity
    calculations in the solar interior are — and the second would touch every stellar model.`,
  sides:[
    {label:"Convection zone depth, seismic", value:0.713, err:0.001, unit:"R☉", source:"Helioseismology", note:"Measured from oscillation frequencies."},
    {label:"Predicted, low-metallicity model", value:0.723, err:0.003, unit:"R☉", source:"Standard model with revised abundances", note:"The revision broke a previously exact match."}],
  sigma:null,
  kill:`Laboratory measurement of iron opacity at solar-interior conditions. The Sandia Z-machine
    experiments already report opacities higher than calculated; a confirmed measurement at the
    required conditions decides whether the fault lies in the abundances or in the opacities.`,
  cites:["Asplund et al., ARA&A 47, 481 (2009)","Bailey et al., Nature 517, 56 (2015)"]
},
{
  id:"METHUSELAH", field:"astronomy", kind:"disagreement", status:"settled",
  title:"A star that appeared to be older than the universe",
  hook:"HD 140283 was dated at 14.5 billion years. The universe is 13.8. Both had error bars.",
  plain:`The subgiant HD 140283 was aged at 14.46 ± 0.8 billion years in 2013, against a
    universe of 13.80 ± 0.02. The overlap was uncomfortable but within the star's uncertainty.
    Better parallax from Gaia and revised stellar models brought the estimate down to roughly
    13.5 billion years.`,
  stakes:`It is included because the resolution was mundane and instructive: the star's age
    depended on its distance, the distance was the weakest link, and a better distance fixed
    it. The register's rule that a claim must state its own kill condition exists for exactly
    this case — the kill condition here was "a parallax good to 1%", and when Gaia delivered
    one, the tension closed without anyone needing to revise cosmology.`,
  sides:[
    {label:"Age of the star, 2013", value:14.46, err:0.8, unit:"Gyr", source:"Bond et al. 2013", note:"Using the best distance then available."},
    {label:"Age of the universe", value:13.80, err:0.02, unit:"Gyr", source:"Planck 2018", note:"Forty times more precise than the stellar age."}],
  sigma:null,
  kill:`Settled by Gaia parallax. A 1% distance moved the stellar age below the age of the
    universe, where it belongs.`,
  cites:["Bond et al., ApJL 765, L12 (2013)","Gaia Collaboration, A&A 616, A1 (2018)"]
},
{
  id:"PLANET9", field:"astronomy", kind:"question", status:"open",
  title:"Six distant objects orbit as though something large is out there",
  hook:"A prediction precise enough to be wrong, and a decade of searching that has not found it.",
  plain:`The orbits of the most distant known trans-Neptunian objects cluster in orientation more
    than chance comfortably allows. In 2016 that clustering was used to predict an unseen planet
    of roughly five to ten Earth masses on a long, eccentric orbit. Surveys have covered much of
    the predicted sky since. Nothing has been found.`,
  stakes:`Two very different things are being tested at once. If the planet exists, the solar
    system has an unaccounted major member and the story of how the giant planets migrated has
    to be rewritten. If it does not, then the clustering is an artefact of where telescopes have
    pointed — which would be a measured example of observational selection producing a signal
    convincing enough to motivate a decade of searching. The second outcome is the more useful
    one for every other field that infers structure from incomplete surveys.`,
  sides:[
    {label:"Predicted mass", value:6.2, err:2, unit:"M⊕", source:"Batygin & Brown 2021", note:"From the orbital clustering of distant objects."},
    {label:"Detections", value:0, err:0, unit:"", source:"All surveys to date", note:"Much of the predicted region already covered."}],
  sigma:null,
  guess:"Real planet, or a selection effect in where we looked?",
  kill:`LSST's first years of full-sky depth. It will either find the object or cover the
    remaining parameter space, and — just as decisively — it will measure the survey selection
    function well enough to say whether the original clustering was ever real.`,
  cites:["Batygin & Brown, AJ 151, 22 (2016)","Napier et al., PSJ 2, 59 (2021)"]
},
{
  id:"JWSTGAL", field:"astronomy", kind:"disagreement", status:"open",
  title:"Galaxies too big to have formed that early",
  hook:"JWST found massive galaxies a few hundred million years after the Big Bang. Models say there was not enough time.",
  plain:`Candidate galaxies at redshifts above 10 appeared, in the first JWST images, to hold
    more stellar mass than standard structure formation allows so soon. Spectroscopic follow-up
    has revised several downward — some were reddened or hosted accreting black holes rather
    than being purely massive — but a residual population remains harder to explain than the
    models predict.`,
  stakes:`Structure formation is where cosmology and astrophysics meet: the dark-matter framework
    sets how fast halos assemble, and messy baryonic physics sets how efficiently gas inside
    them becomes stars. An excess of early massive galaxies means either star formation was far
    more efficient than any local calibration suggests, or the halos themselves grew faster
    than ΛCDM predicts. The first is a revision to astrophysics; the second is a revision to
    cosmology, and the two have to be disentangled by measurement rather than assumption.`,
  sides:[],
  sigma:null,
  kill:`Spectroscopic confirmation of stellar masses — not photometric estimates — for a complete
    sample at z > 10, with the AGN contribution to the continuum separated out. Photometric
    candidates cannot settle this; several of the first ones did not survive spectroscopy.`,
  cites:["Labbé et al., Nature 616, 266 (2023)","Harikane et al., ApJS 265, 5 (2023)"]
},
{
  id:"OLBERS", field:"astronomy", kind:"question", status:"settled",
  title:"Why is the night sky dark?",
  hook:"In an infinite, ageless universe every sightline ends on a star and the whole sky blazes. It doesn't.",
  plain:`Point anywhere in a universe that is infinite and has always existed and your line of
    sight must eventually land on the surface of a star. The night sky should be as bright as
    the Sun in every direction. It is not, because the universe has a finite age and light from
    far enough away has not arrived.`,
  stakes:`This is the cheapest decisive observation in the history of cosmology: it rules out an
    entire class of universe, requires no instrument, and was available to anyone who looked up
    for the whole of human history before anyone drew the conclusion. It is in the register as
    the standard against which every other entry's kill condition is measured — how simple is
    the observation that would settle this, really?`,
  sides:[
    {label:"Age of the universe", value:13.8, err:0.02, unit:"Gyr", source:"Planck 2018", note:"Which is what bounds the volume you can see."},
    {label:"Sky brightness", value:0, err:0, unit:"", source:"Direct observation", note:"Dark, which is the whole point."}],
  sigma:null,
  kill:`Settled. Finite cosmic age plus expansion accounts for the darkness quantitatively.`,
  cites:["Harrison, Darkness at Night (1987)"]
},
{
  id:"FERMI", field:"astronomy", kind:"question", status:"open", nokill:true,
  title:"Where is everybody?",
  hook:"Parallax cannot make this a claim, and showing why is the point of including it.",
  plain:`The galaxy is old and enormous and we now know planets are ordinary — most stars have
    them. So Fermi's lunchtime question stands: if life is at all common, why is there no sign
    of anyone?`,
  stakes:`It is here as the boundary marker. Every other entry in this register names an
    observation that would end it. This one cannot: a detection would answer it, but no
    non-detection can, because absence of evidence at any given sensitivity is consistent with
    almost every hypothesis on offer. That asymmetry is what separates an interesting question
    from a testable one, and the whole discipline of this register is refusing to blur it.`,
  sides:[],
  sigma:null,
  kill:`None. There is no measurement that would prove this wrong, so Parallax will not file it
    as a claim. It sits in the feed labelled as what it is.`,
  cites:["Hart, QJRAS 16, 128 (1975)"]
},

{
  id:"MUTRATE", field:"genomics", kind:"disagreement", status:"open",
  title:"Two ways of measuring human mutation rate differ by a factor of two",
  hook:"Every date in human prehistory is calculated from this number, and it is not settled.",
  plain:`Count the new mutations in a child that neither parent carries and you get about
    1.2×10⁻⁸ per base pair per generation. Calibrate instead against the fossil-dated split
    from chimpanzees and you get roughly twice that. Both methods are careful and they have not
    converged.`,
  stakes:`This number is the clock. Every genetic date in human prehistory is computed by
    dividing observed divergence by it: when modern humans left Africa, when populations
    separated, when Neanderthal admixture occurred. Halving the rate doubles every one of those
    dates. Whole archaeological debates — whether genetic and fossil evidence for the same
    migration agree — turn on which calibration is used, and papers on both sides are often
    comparing dates computed with different clocks without saying so.`,
  sides:[
    {label:"Pedigree-based", value:1.2, err:0.1, unit:"×10⁻⁸ /bp/gen", source:"Direct sequencing of parent-child trios", note:"Counts mutations that actually appeared."},
    {label:"Phylogenetic", value:2.5, err:0.3, unit:"×10⁻⁸ /bp/gen", source:"Human-chimp divergence, fossil calibrated", note:"Depends on the assumed divergence date."}],
  sigma:null,
  guess:"Which clock do you think is right?",
  kill:`Ancient DNA of known radiocarbon age used as a direct calibration point. Sequencing
    dated specimens across tens of thousands of years measures the rate over that interval
    without assuming a divergence date — this is now feasible and is the decisive test.`,
  cites:["Scally & Durbin, Nat Rev Genet 13, 745 (2012)","Kong et al., Nature 488, 471 (2012)"]
},
{
  id:"HERITABLE", field:"genomics", kind:"disagreement", status:"open",
  title:"Height is 80% inherited and nobody could find where",
  hook:"Twin studies and gene-hunting disagreed by a factor of ten. The gap has a name and it is not fully closed.",
  plain:`Twin studies put the heritability of adult height near 80%. The first wave of
    genome-wide association studies located variants explaining under 10%. Later work showed
    that all common variants together account for roughly 45%, spread across thousands of sites
    each too small to detect alone.`,
  stakes:`Missing heritability is the reason polygenic risk scores underperform their advertised
    heritability, and the reason they transfer badly between ancestry groups. Every clinical
    application of genetic prediction — embryo screening, risk stratification, drug response —
    is bounded by how much of the inherited signal can actually be located and how much of the
    twin estimate was inflated by shared environment in the first place. The gap is not an
    academic curiosity; it is the ceiling on what genomic medicine can currently deliver.`,
  sides:[
    {label:"Twin studies say", value:80, err:5, unit:"% heritable", source:"Classical twin designs", note:"Inferred from resemblance, not from any located gene."},
    {label:"Located variants explain", value:45, err:5, unit:"% of variance", source:"Yang et al. 2010, all common SNPs", note:"Up from ~5% in the first wave."}],
  sigma:null,
  kill:`Whole-genome sequencing, not genotyping arrays, of a cohort large enough to capture rare
    variants, with the residual gap accounted for. If it closes, the paradox was an instrument
    limitation; if it does not, the twin estimate is inflated by something shared and
    non-genetic.`,
  cites:["Yang et al., Nature Genetics 42, 565 (2010)","Manolio et al., Nature 461, 747 (2009)"]
},
{
  id:"ENCODE", field:"genomics", kind:"disagreement", status:"open",
  title:"Is 80% of your genome functional, or 10%?",
  hook:"Two respected estimates differ by a factor of eight because they define one word differently.",
  plain:`ENCODE reported in 2012 that around 80% of the human genome is biochemically active.
    Comparative genomics puts the fraction under purifying selection at 8–10%. The data are not
    really in dispute; the meaning of "functional" is.`,
  stakes:`The definition determines where a decade of sequencing effort goes. If most of the
    genome is functional, non-coding variants found in disease studies are plausible causal
    candidates and deserve follow-up. If only a tenth is, most of those associations are
    tagging something else and the follow-up is wasted. It also decides how to interpret the
    vast majority of GWAS hits, which fall outside genes — the single largest interpretive
    problem in human genetics.`,
  sides:[
    {label:"Biochemically active", value:80, err:0, unit:"%", source:"ENCODE Consortium 2012", note:"Transcribed or protein-bound in some cell type."},
    {label:"Under selection", value:9, err:1, unit:"%", source:"Comparative genomics", note:"Conserved across mammals, so plausibly load-bearing."}],
  sigma:null,
  guess:"Which definition of 'functional' should win?",
  kill:`Saturation mutagenesis giving the fitness cost of disrupting randomly chosen genomic
    regions. That converts a definitional argument into a measured quantity, which is the only
    thing that can end it.`,
  cites:["ENCODE Project Consortium, Nature 489, 57 (2012)","Graur et al., Genome Biol Evol 5, 578 (2013)"]
},
{
  id:"PETO", field:"genomics", kind:"disagreement", status:"open",
  title:"Whales have far more cells than you and less cancer",
  hook:"Every cell division risks a mutation, so large long-lived animals should be riddled with tumours. They are not.",
  plain:`Cancer risk should scale with the number of cell divisions in a lifetime. Across species
    it does not: elephants die of cancer less often than humans do, and whales, with orders of
    magnitude more cells, are not obviously worse off. Within a species the expected
    correlation with size does appear — which makes the cross-species absence stranger.`,
  stakes:`Large animals evolved cancer suppression that humans lack, and the mechanisms are
    partially identified — elephants carry around twenty copies of TP53 against our one.
    Understanding how those extra copies change the threshold for apoptosis is a direct route
    to prevention rather than treatment. It also constrains the multi-hit model of
    carcinogenesis: if the model were complete and universal, the cross-species pattern could
    not look like this.`,
  sides:[
    {label:"Elephant cancer mortality", value:4.8, err:0, unit:"%", source:"Abegglen et al. 2015", note:"Across 644 zoo and sanctuary necropsies."},
    {label:"Human cancer mortality", value:18, err:7, unit:"%", source:"Same study, human comparison", note:"Range across the populations compared."}],
  sigma:null,
  guess:"Genetic defence, or something about how large bodies work?",
  kill:`Somatic mutation rate per cell division measured across species spanning four orders of
    magnitude in body mass. If large animals mutate at the same per-cell rate as small ones,
    the defence is active suppression; if more slowly, the paradox reduces to arithmetic.`,
  cites:["Abegglen et al., JAMA 314, 1850 (2015)","Peto et al., J Epidemiol Community Health 29 (1975)"]
},
{
  id:"TWINS", field:"genomics", kind:"disagreement", status:"open",
  title:"Identical twins, identical DNA, different diseases",
  hook:"If the genome were the whole story, one twin's diagnosis would always be the other's.",
  plain:`Identical twins begin from the same genome, yet when one develops type 1 diabetes the
    other follows only about a third to half of the time; for multiple sclerosis it is closer
    to a quarter. The residual is attributed to epigenetic and environmental divergence, though
    that attribution is largely inferential.`,
  stakes:`Discordant twin pairs are the cleanest natural experiment in human biology — genetics
    held constant, everything else varying. What they measure is the ceiling on genetic
    prediction: for these diseases it is well under half, no matter how good the sequencing
    gets. They are also the only design that can establish whether a methylation difference at
    diagnosis is a cause or a consequence, and almost every epigenetic disease association
    published to date cannot distinguish the two.`,
  sides:[
    {label:"Shared DNA", value:100, err:0, unit:"%", source:"Monozygotic twins", note:"Barring a handful of post-zygotic mutations."},
    {label:"Shared diagnosis", value:35, err:10, unit:"%", source:"Type 1 diabetes concordance", note:"Across long-running twin registries."}],
  sigma:null,
  kill:`A longitudinal methylome from disease-discordant pairs sampled before onset. Marks that
    already differ beforehand are candidate causes; marks that appear afterwards are
    consequences, and the field has been reading the arrow backwards.`,
  cites:["Redondo et al., Diabetologia 44, 354 (2001)","Willer et al., PNAS 100, 12877 (2003)"]
},
{
  id:"CANDIDATE", field:"genomics", kind:"orthodoxy", status:"refuted",
  title:"Hundreds of papers on depression genes that were not there",
  hook:"Eighteen candidate genes, more than a thousand studies, and no association that survived a large sample.",
  plain:`For two decades the genetics of depression was studied by picking a plausible gene —
    the serotonin transporter, most famously — and testing it in a few hundred people. In 2019
    a study of over 600,000 individuals tested the eighteen most-studied candidates and their
    interactions with stress. None showed the claimed association.`,
  stakes:`This is the clearest measured case of a literature built on underpowered studies and
    publication bias, and it is not a historical curiosity: the same design is still used in
    fields without the sample sizes to expose it. The specific casualty was the
    gene-by-environment interaction claim for 5-HTTLPR, cited thousands of times and used to
    justify clinical framing. The general lesson is a number: with samples in the hundreds,
    plausible-sounding associations appear reliably, and they are false.`,
  sides:[
    {label:"Published candidate studies", value:1100, err:0, unit:"papers", source:"Literature on 18 candidate genes", note:"Most reporting positive associations."},
    {label:"Associations replicating", value:0, err:0, unit:"of 18", source:"Border et al. 2019, n > 600,000", note:"No candidate showed more evidence than random genes."}],
  sigma:null,
  kill:`Refuted. The kill condition was a well-powered test of the same hypotheses, and it was
    carried out. The entry stays visible because the retracted literature is still cited.`,
  cites:["Border et al., Am J Psychiatry 176, 376 (2019)","Caspi et al., Science 301, 386 (2003)"]
},
{
  id:"MICROBE", field:"genomics", kind:"orthodoxy", status:"refuted",
  title:"You are not ten parts bacteria to one part human",
  hook:"A number in every textbook for forty years traced back to one paragraph of arithmetic nobody rechecked.",
  plain:`The claim that the body holds ten bacterial cells for every human one was repeated for
    decades. Traced to its source in 2016, it came from a single order-of-magnitude estimate
    published in 1972, presented as such and cited thereafter as measurement. Recounted from
    organ-by-organ densities, the ratio is about 1.3 to 1.`,
  stakes:`The 10:1 figure was doing rhetorical work — it was the standard opening line for the
    argument that the microbiome dominates human physiology, and it appeared in grant
    applications, popular books and review introductions. Correcting it does not undermine
    microbiome research, but it removes a premise that a great deal of framing rested on. The

/* ------------------------------------------------------------------ utils */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safely = (fn, fb) => { try { return fn(); } catch (e) { console.error(e); return fb; } };
const num = v => {
  if (!Number.isFinite(v)) return "—";
  const a = Math.abs(v);
  if (a !== 0 && (a >= 1e5 || a < 1e-2)) {
    const e = Math.floor(Math.log10(a));
    return (v / 10 ** e).toFixed(2) + "×10^" + e;
  }
  if (a >= 1e4) return v.toLocaleString("en-US");
  return String(Number(v.toPrecision(4)));
};
const days = iso => {
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return "";
  const d = Math.max(0, Math.round((Date.now() - t) / 864e5));
  return d <= 1 ? "opened today" : `open ${d} days`;
};
const FIELD_WORD = { astronomy:"Astronomy", genomics:"Genomics", physics:"Physics" };
const KIND_WORD = { disagreement:"Disagreement", silence:"Silence", orthodoxy:"Repeated, unchecked", question:"Open question" };
const UNIT_WORDS = { msun:"times the mass of the Sun", mearth:"times the mass of Earth",
  rearth:"times the radius of Earth", rjup:"times the radius of Jupiter", d:"days", s:"seconds" };
const spell = u => UNIT_WORDS[String(u || "").toLowerCase()] || u || "";

/* ---------------------------------------------------- machine → post shape */
function fromRegister(rows){
  const out = [], groups = new Map();
  for (const c of rows) {
    if (c.kind === "tension") {
      const o = c.observed || {}, r = c.reported || {};
      out.push({
        id:c.claim_id, field:"astronomy", kind:"disagreement", status:c.status || "open",
        machine:true, opened:c.opened_at, title:c.title,
        hook:`${o.source} and a ${r.year || "published"} paper disagree by ${c.sigma}σ about the same quantity.`,
        plain:`Two measurements of the same object do not agree. The archive holds ${num(o.value)};
          a paper states ${num(r.value)}. The stated error bars are too small for both to be right.`,
        stakes:`Individually this is one object. Collectively it is a measure of how much of the
          published record disagrees with the archives that are supposed to summarise it — and
          nobody is auditing that at scale, because doing it by hand costs a literature search
          per object. This entry exists because a machine did the search.`,
        sides:[
          {label:o.source || "archive", value:o.value, err:o.err, unit:o.unit, source:o.reference || "", note:"Held in the archive as the current value."},
          {label:`published ${r.year || ""}`.trim(), value:r.value, err:r.err, unit:r.unit, source:"the paper", note:"Read out of the abstract, with the quote kept as receipt."}],
        sigma:c.sigma, kill:c.kill, resolution:c.resolution, url:o.url,
        guess:"Which do you think is wrong — the archive, or the paper?",
        cites:[o.reference, c.claim_id].filter(Boolean)
      });
      continue;
    }
    const o = c.observed || {}, k = `${o.source}|${o.quantity}`;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  }
  for (const [k, ms] of groups) {
    const o = ms[0].observed || {};
    const vals = ms.map(m => (m.observed || {}).value).filter(Number.isFinite);
    const what = o.source === "gwosc" ? "gravitational-wave events" : "planets";
    out.push({
      id:"SILENCE-" + k, field:"astronomy", kind:"silence", status:"open", machine:true,
      opened:ms[0].opened_at, members:ms,
      title:`${ms.length} ${what} nobody has written about`,
      hook:`Recorded once by ${o.source}, then named in no paper since. Not disputed — unexamined.`,
      plain:`${ms.length} real objects, each measured once by ${o.source} and then left alone —
        ${num(Math.min(...vals))} to ${num(Math.max(...vals))} ${spell(o.unit)}. A title and
        abstract search across OpenAlex returns nothing that names any of them.`,
      stakes:`Detection has outrun analysis. Surveys now record objects far faster than anyone
        can study them, so the limiting resource in observational astronomy is no longer
        telescope time but attention — and nothing tracks which objects have never received
        any. Each of these is a fully characterised object, publicly available, that a student
        could take tomorrow. The list is the point: it is a queue nobody was maintaining.`,
      sides:[], sigma:null, kill:ms[0].kill,
      cites:[o.reference].filter(Boolean)
    });
  }
  return out;
}

/* ---------------------------------------------------------------- figures */
// Two measurements and their error bars on one axis, at the scale where the
// disagreement is the visible thing.
function interval(p, W = 660, H = 190){
  const S = (p.sides || []).filter(s => Number.isFinite(s.value));
  if (S.length < 2) return "";
  const err = S.map(s => Number.isFinite(s.err) ? s.err : 0);
  const lo = Math.min(...S.map((s, i) => s.value - err[i]));
  const hi = Math.max(...S.map((s, i) => s.value + err[i]));
  const pad = (hi - lo) * .34 || Math.abs(hi) * .3 || 1;
  const a = lo - pad, b = hi + pad, y0 = H / 2;
  const x = v => 56 + (v - a) / (b - a) * (W - 112);
  const C = ["var(--astro)", "var(--live)"];
  let o = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(S[0].label)} against ${esc(S[1].label)}">`;
  o += `<line x1="34" y1="${y0}" x2="${W - 34}" y2="${y0}" stroke="var(--line)" stroke-width="2" stroke-linecap="round"></line>`;
  S.forEach((s, i) => {
    const c = C[i], y = i === 0 ? y0 - 30 : y0 + 30, e = err[i];
    const x1 = +x(s.value - e).toFixed(1), x2 = +x(s.value + e).toFixed(1);
    if (e > 0) {
      o += `<rect x="${x1}" y="30" width="${(x2 - x1).toFixed(1)}" height="${H - 60}" rx="10" fill="${c}" opacity=".09"></rect>`;
      o += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${c}" stroke-width="2.5" stroke-linecap="round"></line>`;
      for (const t of [x1, x2]) o += `<line x1="${t}" y1="${y - 6}" x2="${t}" y2="${y + 6}" stroke="${c}" stroke-width="2.5" stroke-linecap="round"></line>`;
    }
    o += `<circle cx="${x(s.value).toFixed(1)}" cy="${y}" r="5.5" fill="${c}"></circle>`;
    o += `<text x="${x(s.value).toFixed(1)}" y="${i === 0 ? y - 14 : y + 23}" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="700" font-size="13" fill="var(--ink)">${num(s.value)}${e ? " ± " + num(e) : ""}</text>`;
    o += `<text x="${x(s.value).toFixed(1)}" y="${i === 0 ? 20 : H - 6}" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="600" font-size="11.5" fill="var(--ink-3)">${esc(s.label)}</text>`;
  });
  o += `<line x1="${x(S[0].value).toFixed(1)}" y1="${y0}" x2="${x(S[1].value).toFixed(1)}" y2="${y0}" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"></line>`;
  if (Number.isFinite(p.sigma) && Math.abs(x(S[0].value) - x(S[1].value)) > 96)
    o += `<text x="${((x(S[0].value) + x(S[1].value)) / 2).toFixed(1)}" y="${y0 - 9}" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="800" font-size="17" fill="var(--ink)">${p.sigma}σ apart</text>`;
  o += `<text x="${W - 34}" y="${y0 + 19}" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="10.5" fill="var(--ink-3)">${esc(S[0].unit || "")}</text>`;
  return o + `</svg>`;
}

// The measurements over time, which is the figure a researcher actually wants:
// it shows whether the dispute is converging, and it is drawn from the same
// published values the entry cites.
function history(p){
  const H0 = p.history || [];
  if (H0.length < 2) return "";
  const W = 660, H = 260, L = 62, R = 26, T = 26, B = 46;
  const ys = H0.flatMap(d => [d.value - (d.err || 0), d.value + (d.err || 0)]);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const log = hi / Math.max(lo, 1e-30) > 50;             // gene counts need a log axis
  const f = v => log ? Math.log10(Math.max(v, 1e-30)) : v;
  let flo = f(lo), fhi = f(hi), fp = (fhi - flo) * .18 || Math.abs(fhi) * .2 || 1;
  flo -= fp; fhi += fp;
  const xs = H0.map(d => d.year), x0 = Math.min(...xs), x1 = Math.max(...xs);
  const px = yr => L + (yr - x0 + .5) / (x1 - x0 + 1) * (W - L - R);
  const py = v => T + (1 - (f(v) - flo) / (fhi - flo)) * (H - T - B);
  const methods = [...new Set(H0.map(d => d.method))];
  const C = ["var(--astro)", "var(--live)", "var(--phys)", "var(--gene)"];
  const col = m => C[methods.indexOf(m) % C.length];

  let o = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Published measurements by year">`;
  // A faint grid, labelled with values the chart actually reaches.
  for (let i = 0; i <= 3; i++) {
    const v = flo + (fhi - flo) * i / 3, y = T + (1 - i / 3) * (H - T - B);
    o += `<line x1="${L}" y1="${y.toFixed(1)}" x2="${W - R}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"></line>`;
    o += `<text x="${L - 10}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="10.5" fill="var(--ink-3)">${num(log ? 10 ** v : v)}</text>`;
  }
  // Each method as its own connected series, so convergence is visible.
  for (const m of methods) {
    const pts = H0.filter(d => d.method === m).sort((a2, b2) => a2.year - b2.year);
    if (pts.length > 1)
      o += `<polyline fill="none" stroke="${col(m)}" stroke-width="2" stroke-linejoin="round" opacity=".38" points="${pts.map(d => `${px(d.year).toFixed(1)},${py(d.value).toFixed(1)}`).join(" ")}"></polyline>`;
  }
  for (const d of H0) {
    const c = col(d.method), X = px(d.year);
    if (d.err) {
      o += `<line x1="${X.toFixed(1)}" y1="${py(d.value + d.err).toFixed(1)}" x2="${X.toFixed(1)}" y2="${py(d.value - d.err).toFixed(1)}" stroke="${c}" stroke-width="2.5" stroke-linecap="round"></line>`;
    }
    o += `<circle cx="${X.toFixed(1)}" cy="${py(d.value).toFixed(1)}" r="5" fill="${c}"></circle>`;
    o += `<text x="${X.toFixed(1)}" y="${H - 24}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="10.5" fill="var(--ink-3)">${d.year}</text>`;
  }
  // Legend, so a colour means a method rather than nothing.
  methods.forEach((m, i) => {
    o += `<circle cx="${L + i * 128 + 5}" cy="${H - 7}" r="4.5" fill="${col(m)}"></circle>`;
    o += `<text x="${L + i * 128 + 15}" y="${H - 3}" font-family="Manrope,sans-serif" font-weight="600" font-size="11.5" fill="var(--ink-2)">${esc(m)}</text>`;
  });
  return o + `</svg>`;
}

// The tile-sized version: the same two marks, read at a glance.
function spark(p){
  const S = (p.sides || []).filter(s => Number.isFinite(s.value));
  if (S.length < 2) return "";
  const err = S.map(s => Number.isFinite(s.err) ? s.err : 0);
  const lo = Math.min(...S.map((s, i) => s.value - err[i]));
  const hi = Math.max(...S.map((s, i) => s.value + err[i]));
  const pad = (hi - lo) * .3 || Math.abs(hi) * .25 || 1;
  const a = lo - pad, b = hi + pad, W = 620, H = 26, y = 13;
  const x = v => 6 + (v - a) / (b - a) * (W - 12);
  let o = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="two measurements, apart">`;
  o += `<line x1="6" y1="${y}" x2="${W - 6}" y2="${y}" stroke="var(--line)" stroke-width="3" stroke-linecap="round"></line>`;
  S.forEach((s, i) => {
    const c = i === 0 ? "var(--astro)" : "var(--live)", e = err[i];
    if (e > 0) o += `<rect x="${x(s.value - e).toFixed(1)}" y="${y - 5}" width="${Math.max(2, x(s.value + e) - x(s.value - e)).toFixed(1)}" height="10" rx="5" fill="${c}" opacity=".22"></rect>`;
    o += `<circle cx="${x(s.value).toFixed(1)}" cy="${y}" r="4.5" fill="${c}"></circle>`;
  });
  return o + `</svg>`;
}
