<title>The Parallax Register</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ---------------------------------------------------------------- tokens ---
   Light, and only light. There is no dark palette in this file and no system
   theme switch: the register is a page of lab paper, in every viewer's theme.
   Colour carries two facts and nothing else — the field an object belongs to,
   and whether the question is still open.                                     */
:root{
  --paper:#EFF1EC;          /* pale green-grey: graph paper, not cream        */
  --surface:#FFFFFF;
  --sunk:#E7EAE3;           /* settled things sit back into the page          */
  --ink:#141A18;
  --ink-2:#535C58;
  --ink-3:#8C948F;
  --hair:#DCE0D8;
  --rule:#C2C8BC;
  --astro:#3A3A8C;          /* astronomy                                      */
  --gene:#8A5320;           /* genomics                                       */
  --phys:#1F6257;           /* fundamental physics                            */
  --live:#B01E52;           /* open, contested                                */
  --live-soft:#FBE9EF;
  --shut:#3F6B4A;           /* settled                                        */
  --kill:#8A5A0B;
  --display:"Bricolage Grotesque","Helvetica Neue",Helvetica,sans-serif;
  --body:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:400 17px/1.6 var(--body);font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
.shell{max-width:1180px;margin:0 auto;padding:0 22px 120px}
:where(button,input,a,summary,select):focus-visible{outline:2px solid var(--live);outline-offset:2px}

/* ------------------------------------------------------------- masthead --- */
.mast{padding:26px 0 0}
.mark{display:flex;align-items:center;gap:13px}
.mark svg{width:29px;height:29px;flex:none}
.mark h1{margin:0;font:800 24px/1 var(--display);letter-spacing:-.02em}
.mark .stamp{margin-left:auto;font:500 11px/1.4 var(--mono);color:var(--ink-3);text-align:right}
.lede{margin:13px 0 0;max-width:78ch;font:300 18px/1.45 var(--body);color:var(--ink-2)}
.lede b{color:var(--ink);font-weight:500}

.readout{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin:18px 0 0;
  background:var(--rule);border:1px solid var(--rule);
}
.readout div{background:var(--surface);padding:10px 13px}
.readout dt{margin:0 0 5px;font:500 10px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.readout dd{margin:0;font:600 23px/1 var(--display);letter-spacing:-.02em}
.readout dd small{font:500 11px/1 var(--mono);color:var(--ink-3);margin-left:5px}
.readout .hot dd{color:var(--live)}
@media(max-width:700px){.readout{grid-template-columns:repeat(2,1fr)}}

/* ------------------------------------------------------------------ nav --- */
.bar{
  position:sticky;top:0;z-index:30;margin:22px -22px 0;padding:0 22px;
  background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--hair);
}
.tabs{display:flex;gap:24px;flex-wrap:wrap}
.tabs button{
  appearance:none;background:none;border:0;cursor:pointer;padding:14px 0 12px;
  color:var(--ink-3);font:600 12px/1 var(--display);letter-spacing:.13em;
  text-transform:uppercase;border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tabs button:hover{color:var(--ink-2)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--live)}
.tabs button .n{font-family:var(--mono);font-size:11px;letter-spacing:0;color:var(--ink-3);margin-left:6px}

/* ----------------------------------------------------------- filter row --- */
.sift{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:18px 0 2px}
.chip{
  appearance:none;cursor:pointer;background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;font:500 11px/1 var(--mono);letter-spacing:.04em;color:var(--ink-2);
}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sift input{
  flex:1;min-width:170px;background:var(--surface);color:var(--ink);
  border:1px solid var(--rule);padding:7px 11px;font:400 13px/1 var(--mono);
}
.sift input::placeholder{color:var(--ink-3)}

/* ---------------------------------------------------------------- tiles ---
   Three across, so ten things you are not interested in cost one glance and
   not ten screens. A tile is a whole question, never a fragment of one.       */
.grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:20px 0 0;
  align-items:stretch;
}
@media(max-width:940px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.grid{grid-template-columns:1fr}}

.tile{
  display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--hair);border-top:3px solid var(--astro);
  padding:14px 16px 15px;min-height:196px;font:inherit;color:inherit;
  transition:border-color .12s,transform .12s;
}
.tile:hover{border-color:var(--rule);border-top-color:inherit;transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
.tile.astronomy{border-top-color:var(--astro)}
.tile.genomics{border-top-color:var(--gene)}
.tile.physics{border-top-color:var(--phys)}
.tile.wide{grid-column:span 2}
@media(max-width:620px){.tile.wide{grid-column:span 1}}
.tile.closed{background:var(--sunk);border-color:var(--rule)}

.tile .head{display:flex;align-items:center;gap:8px;font:500 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.tile .head .fld{color:var(--astro)}
.tile.genomics .head .fld{color:var(--gene)}
.tile.physics .head .fld{color:var(--phys)}
.tile .head .state{margin-left:auto;color:var(--live)}
.tile.closed .head .state{color:var(--shut)}
.tile h3{
  margin:0;font:600 clamp(17px,1.55vw,21px)/1.2 var(--display);
  letter-spacing:-.018em;text-wrap:balance;
}
.tile.wide h3{font-size:clamp(20px,2.1vw,27px)}
.tile .hook{margin:0;font:400 14.5px/1.45 var(--body);color:var(--ink-2)}
.tile .spark{margin-top:auto;padding-top:10px}
.tile .spark svg{display:block;width:100%;height:auto}
.tile .metric{
  margin-top:auto;padding-top:10px;display:flex;align-items:baseline;gap:8px;
  font:500 11px/1 var(--mono);color:var(--ink-3);
}
.tile .metric b{font:600 21px/1 var(--display);color:var(--live);letter-spacing:-.02em}
.tile.closed .metric b{color:var(--shut)}
.tile .kept{color:var(--astro);font-weight:600}

/* -------------------------------------------------------------- detail ---- */
.back{
  appearance:none;background:none;border:0;cursor:pointer;padding:20px 0 0;
  font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
}
.back:hover{color:var(--ink)}
.detail{max-width:74ch;padding:8px 0 0}
.detail .eyebrow{display:flex;gap:12px;flex-wrap:wrap;font:500 10px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.detail .eyebrow .fld{color:var(--astro);font-weight:600}
.detail.genomics .eyebrow .fld{color:var(--gene)}
.detail.physics .eyebrow .fld{color:var(--phys)}
.detail h2{margin:12px 0 0;font:600 clamp(28px,4vw,42px)/1.1 var(--display);letter-spacing:-.03em;text-wrap:balance}
.detail .plain{margin:16px 0 0;font:400 20px/1.5 var(--body);color:var(--ink)}
.detail .said{margin:16px 0 0;font:400 16px/1.62 var(--body);color:var(--ink-2)}

.layer{
  margin:30px 0 0;padding-top:12px;border-top:1px solid var(--rule);
}
.layer > h4{
  margin:0 0 12px;font:500 10px/1 var(--mono);letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-3);
}
.plate{background:var(--surface);border:1px solid var(--hair);padding:14px 12px 8px}
.plate svg{display:block;width:100%;height:auto}
.plate .cap{padding:8px 6px 2px;font:400 11px/1.5 var(--mono);color:var(--ink-3)}

.sides{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:14px}
.sides div{background:var(--surface);padding:13px 14px}
.sides dt{margin:0 0 6px;font:500 10px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.sides dd{margin:0;font:600 19px/1.2 var(--display);letter-spacing:-.015em}
.sides p{margin:6px 0 0;font:400 12.5px/1.45 var(--body);color:var(--ink-3)}
@media(max-width:620px){.sides{grid-template-columns:1fr}}

/* The guess. It is asked before the evidence is shown, because committing
   first is the difference between reading a fact and testing yourself. */
.guess{border:1px solid var(--live);background:var(--live-soft);padding:16px 17px;margin:14px 0 0}
.guess p{margin:0 0 12px;font:500 16px/1.4 var(--display);letter-spacing:-.01em}
.guess .opts{display:flex;gap:9px;flex-wrap:wrap}
.guess button{
  appearance:none;cursor:pointer;background:var(--surface);border:1px solid var(--live);
  color:var(--ink);padding:9px 14px;font:500 13px/1.2 var(--mono);text-align:left;
}
.guess button:hover{background:var(--live);color:#fff}
.guess .said-you{margin:12px 0 0;font:400 14px/1.5 var(--body);color:var(--ink-2)}
.guess .said-you b{color:var(--live)}

.kill{margin:14px 0 0;padding:0 0 0 15px;border-left:2px solid var(--kill)}
.kill .lab{display:block;font:600 10px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--kill);margin-bottom:6px}
.kill p{margin:0;font:400 16px/1.6 var(--body);color:var(--ink-2)}
.nokill{border-left-color:var(--ink-3)}
.nokill .lab{color:var(--ink-3)}

.cites{margin:14px 0 0;padding:0;list-style:none;font:400 12.5px/1.7 var(--mono);color:var(--ink-3)}
.cites a{color:var(--ink-2)}
.foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:26px 0 0;padding-top:12px;border-top:1px solid var(--hair);font:400 11px/1 var(--mono);color:var(--ink-3)}
.keep{
  margin-left:auto;appearance:none;cursor:pointer;background:none;border:1px solid var(--rule);
  padding:8px 14px;font:500 11px/1 var(--mono);letter-spacing:.08em;color:var(--ink-2);
}
.keep:hover{border-color:var(--ink-3);color:var(--ink)}
.keep[aria-pressed="true"]{background:var(--astro);border-color:var(--astro);color:#fff}

/* ------------------------------------------------------------ workbench --- */
.bench{max-width:78ch;padding:22px 0 0}
.bench h2{margin:0;font:600 30px/1.15 var(--display);letter-spacing:-.025em}
.bench .prose{margin:14px 0 0;font:400 17px/1.6 var(--body);color:var(--ink-2);max-width:62ch}
.form{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0 0}
.form input,.form select{
  background:var(--surface);border:1px solid var(--rule);color:var(--ink);
  padding:10px 12px;font:400 14px/1 var(--mono);
}
.form input{flex:1;min-width:220px}
.form button{
  appearance:none;cursor:pointer;background:var(--ink);border:1px solid var(--ink);color:var(--paper);
  padding:10px 20px;font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
}
.form button[disabled]{opacity:.5;cursor:progress}
.modes{margin:14px 0 0;border:1px solid var(--hair);background:var(--surface)}
.modes div{display:flex;gap:14px;padding:9px 13px;border-bottom:1px solid var(--hair);font:400 13px/1.5 var(--body);color:var(--ink-2)}
.modes div:last-child{border-bottom:0}
.modes code{font:500 12px/1 var(--mono);color:var(--ink);min-width:78px}
.out{
  margin:18px 0 0;background:var(--surface);border:1px solid var(--hair);padding:14px;
  font:400 12px/1.55 var(--mono);color:var(--ink-2);white-space:pre-wrap;word-break:break-word;
  max-height:440px;overflow:auto;
}
.out b{color:var(--ink)}

/* -------------------------------------------------------------- generic --- */
.verdict{margin:24px 0 0;font:600 clamp(26px,3.6vw,38px)/1.15 var(--display);letter-spacing:-.028em;max-width:22ch;text-wrap:balance}
.verdict em{font-style:normal;color:var(--live)}
.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;margin:24px 0 0;background:var(--rule);border:1px solid var(--rule)}
.ledger div{background:var(--surface);padding:14px}
.ledger dt{margin:0 0 6px;font:500 10px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.ledger dd{margin:0;font:600 29px/1 var(--display);letter-spacing:-.02em}
.ledger p{margin:7px 0 0;font:400 13px/1.45 var(--body);color:var(--ink-3)}
.prose{margin:24px 0 0;max-width:62ch;font:400 17px/1.62 var(--body);color:var(--ink-2)}
.prose b{color:var(--ink);font-weight:500}
.hollow{padding:48px 24px;text-align:center;color:var(--ink-3);border:1px dashed var(--rule);font:400 17px/1.55 var(--body);max-width:52ch;margin:24px auto 0}
.moved{margin:0 0 12px;padding:9px 13px;border-left:2px solid var(--live);background:var(--live-soft);font:400 14px/1.5 var(--body)}
[hidden]{display:none!important}
</style>

        <path d="M4.5 25 H25.5" fill="none" stroke="var(--rule)" stroke-width="1.1"></path>
      </svg>
      <h1>Parallax</h1>
      <span class="stamp" id="stamp"></span>
    </div>
    <p class="lede">
      Every entry here is a place where careful people measured the same thing and
      <b>got different answers</b> — or measured something once and never looked again.

    </p>
    <dl class="readout" id="readout"></dl>
  </header>

  <div class="bar">
    <div class="tabs" role="tablist">

      <button role="tab" id="tab-record" aria-selected="false">Record<span class="n" id="n-record"></span></button>
    </div>
  </div>

  <main id="main"></main>
</div>

    {label:"Paris japonica", value:148.9, err:0, unit:"Gb", source:"Pellicer et al. 2010", note:"The largest genome measured in any plant."},
    {label:"Human", value:3.1, err:0, unit:"Gb", source:"Reference assembly", note:"About 2% of it codes for protein."}],
  sigma:null,
  kill:`Settled in 1971, when repetitive DNA was characterised. It stays in the register as a
    worked example: a paradox that dissolved once the right thing was measured, rather than
    one that was argued away.`,
  cites:["Pellicer, Fay & Leitch, Bot J Linn Soc 164, 10 (2010)","Thomas, Annu Rev Genet 5, 237 (1971)"]
},
{
  id:"OLBERS", field:"astronomy", kind:"question", status:"settled",
  title:"Why is the night sky dark?",
  hook:"In an infinite, ageless universe every sightline ends on a star, and the whole sky blazes. It doesn't.",
  plain:`Point in any direction in a universe that goes on forever and has always existed, and
    your line of sight must eventually land on the surface of a star. The night sky should be
    as bright as the Sun, everywhere. It is not — and the reason is that the universe has a
    finite age. Light from far enough away has not had time to arrive. The darkness overhead

  statement:`Olbers' paradox is resolved by finite cosmic age and expansion: the observable
    volume is bounded by the light travel time since recombination, and redshift removes what

  sides:[
    {label:"Age of the universe", value:13.8, err:0.02, unit:"Gyr", source:"Planck 2018", note:"Which is what bounds the volume you can see."},
    {label:"Sky brightness", value:0, err:0, unit:"—", source:"Observation", note:"Dark, which is the whole point."}],
  sigma:null,
  kill:`Settled. It is here because it is the cleanest example of the register's own logic:
    an observation anyone can make on any clear night, that rules out an entire class of

},
{
  id:"FERMI", field:"astronomy", kind:"question", status:"open", nokill:true,
  title:"Where is everybody?",
  hook:"Parallax cannot make this a claim, and that is worth showing.",
  plain:`The galaxy is old and enormous and we now know that planets are ordinary — most stars

    Parallax will not file it as a claim. It sits in the feed as the boundary marker: an

/* ------------------------------------------------------------------ utils */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safely = (fn, fb) => { try { return fn(); } catch (e) { console.error(e); return fb; } };
const num = v => {
  if (!Number.isFinite(v)) return "—";
  const a = Math.abs(v);
  if (a !== 0 && (a >= 1e4 || a < 1e-2)) {
    const e = Math.floor(Math.log10(a));
    return (v / 10 ** e).toFixed(2) + "×10^" + e;
  }
  return String(Number(v.toPrecision(4)));
};
const days = iso => {
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return "";
  const d = Math.max(0, Math.round((Date.now() - t) / 864e5));
  return d <= 1 ? "opened today" : `open ${d} days`;
};
const FIELD_WORD = { astronomy:"Astronomy", genomics:"Genomics", physics:"Physics" };
const KIND_WORD = { disagreement:"Disagreement", silence:"Silence", orthodoxy:"Repeated, unchecked", question:"Open question" };
const UNIT_WORDS = { msun:"times the mass of the Sun", mearth:"times the mass of Earth",
  rearth:"times the radius of Earth", rjup:"times the radius of Jupiter", d:"days", s:"seconds" };
const spell = u => UNIT_WORDS[String(u || "").toLowerCase()] || u || "";

/* ---------------------------------------------------- machine → post shape */
// Claims the sweep actually minted, reshaped into the same object as a seed so
// one feed can hold both. Origin is carried through and always shown.
function fromRegister(rows){
  const out = [], groups = new Map();
  for (const c of rows) {
    if (c.kind === "tension") {
      const o = c.observed || {}, r = c.reported || {};
      out.push({
        id:c.claim_id, field:"astronomy", kind:"disagreement", status:c.status || "open",
        machine:true, opened:c.opened_at, title:c.title,
        hook:`${o.source} and a ${r.year || "published"} paper disagree by ${c.sigma}σ about the same quantity.`,
        plain:`Two measurements of the same object do not agree. The archive says
          ${num(o.value)}; a paper says ${num(r.value)}. Their stated error bars are too
          small for both to be right, and nothing in the published record settles which.`,
        statement:c.statement,
        sides:[
          {label:o.source || "archive", value:o.value, err:o.err, unit:o.unit, source:o.reference || "", note:"Held in the archive as the current value."},
          {label:`published ${r.year || ""}`.trim(), value:r.value, err:r.err, unit:r.unit, source:"the paper", note:"Read out of the abstract by the extractor."}],
        sigma:c.sigma, kill:c.kill, resolution:c.resolution, url:o.url,
        guess:"Which do you think is wrong — the archive, or the paper?",
        cites:[o.reference, c.claim_id].filter(Boolean)
      });
      continue;
    }
    const o = c.observed || {}, k = `${o.source}|${o.quantity}`;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  }
  for (const [k, ms] of groups) {
    const o = ms[0].observed || {};
    const vals = ms.map(m => (m.observed || {}).value).filter(Number.isFinite);
    const what = o.source === "gwosc" ? "gravitational-wave events" : "planets";
    out.push({
      id:"SILENCE-" + k, field:"astronomy", kind:"silence", status:"open", machine:true,
      opened:ms[0].opened_at, members:ms,
      title:`${ms.length} ${what} nobody has written about`,
      hook:`Recorded once by ${o.source}, then named in no paper since. Not disputed — unexamined.`,
      plain:`${ms.length} real objects, each measured once by ${o.source} and then left alone —
        ${num(Math.min(...vals))} to ${num(Math.max(...vals))} ${spell(o.unit)}. Not one of them
        is named in a single published paper. Nobody has looked.`,
      statement:ms[0].statement,
      sides:[], sigma:null, kill:ms[0].kill,
      cites:[o.reference].filter(Boolean)
    });
  }
  return out;
}

/* ---------------------------------------------------------------- figures */
// Two measurements and their error bars on one axis, at the scale where the
// disagreement is the visible thing.
function interval(p, W = 660, H = 190){
  const S = (p.sides || []).filter(s => Number.isFinite(s.value));
  if (S.length < 2) return "";
  const err = S.map(s => Number.isFinite(s.err) ? s.err : 0);
  const lo = Math.min(...S.map((s, i) => s.value - err[i]));
  const hi = Math.max(...S.map((s, i) => s.value + err[i]));
  const pad = (hi - lo) * .34 || Math.abs(hi) * .3 || 1;
  const a = lo - pad, b = hi + pad, y0 = H / 2;
  const x = v => 56 + (v - a) / (b - a) * (W - 112);
  const C = ["var(--astro)", "var(--live)"];

  let o = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(S[0].label)} against ${esc(S[1].label)}">`;
  o += `<line x1="34" y1="${y0}" x2="${W - 34}" y2="${y0}" stroke="var(--rule)"></line>`;
  S.forEach((s, i) => {
    const c = C[i], y = i === 0 ? y0 - 30 : y0 + 30, e = err[i];
    const x1 = +x(s.value - e).toFixed(1), x2 = +x(s.value + e).toFixed(1);
    if (e > 0) {
      o += `<rect x="${x1}" y="30" width="${(x2 - x1).toFixed(1)}" height="${H - 60}" fill="${c}" opacity=".08"></rect>`;
      o += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${c}" stroke-width="2"></line>`;
      for (const t of [x1, x2]) o += `<line x1="${t}" y1="${y - 6}" x2="${t}" y2="${y + 6}" stroke="${c}" stroke-width="2"></line>`;
    }
    o += `<circle cx="${x(s.value).toFixed(1)}" cy="${y}" r="5" fill="${c}"></circle>`;
    o += `<text x="${x(s.value).toFixed(1)}" y="${i === 0 ? y - 14 : y + 22}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="12" fill="var(--ink)">${num(s.value)}${e ? " ± " + num(e) : ""}</text>`;
    o += `<text x="${x(s.value).toFixed(1)}" y="${i === 0 ? 20 : H - 6}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="1.3" fill="var(--ink-3)">${esc(String(s.label).toUpperCase())}</text>`;
  });
  o += `<line x1="${x(S[0].value).toFixed(1)}" y1="${y0}" x2="${x(S[1].value).toFixed(1)}" y2="${y0}" stroke="var(--ink)" stroke-width="1.5"></line>`;
  if (Number.isFinite(p.sigma) && Math.abs(x(S[0].value) - x(S[1].value)) > 96)
    o += `<text x="${((x(S[0].value) + x(S[1].value)) / 2).toFixed(1)}" y="${y0 - 8}" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="600" font-size="16" fill="var(--ink)">${p.sigma}σ apart</text>`;
  o += `<text x="${W - 34}" y="${y0 + 19}" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="10" fill="var(--ink-3)">${esc(S[0].unit || "")}</text>`;
  return o + `</svg>`;
}

// The tile-sized version: the same two marks, no labels, read at a glance.
function spark(p){
  const S = (p.sides || []).filter(s => Number.isFinite(s.value));
  if (S.length < 2) return "";
  const err = S.map(s => Number.isFinite(s.err) ? s.err : 0);
  const lo = Math.min(...S.map((s, i) => s.value - err[i]));
  const hi = Math.max(...S.map((s, i) => s.value + err[i]));
  const pad = (hi - lo) * .3 || Math.abs(hi) * .25 || 1;
  const a = lo - pad, b = hi + pad, W = 620, H = 26, y = 13;
  const x = v => 4 + (v - a) / (b - a) * (W - 8);
  let o = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="two measurements, apart">`;
  o += `<line x1="4" y1="${y}" x2="${W - 4}" y2="${y}" stroke="var(--hair)" stroke-width="2"></line>`;
  S.forEach((s, i) => {
    const c = i === 0 ? "var(--astro)" : "var(--live)", e = err[i];
    if (e > 0) o += `<rect x="${x(s.value - e).toFixed(1)}" y="${y - 5}" width="${(x(s.value + e) - x(s.value - e)).toFixed(1)}" height="10" fill="${c}" opacity=".22"></rect>`;
    o += `<circle cx="${x(s.value).toFixed(1)}" cy="${y}" r="4.5" fill="${c}"></circle>`;
  });
  return o + `</svg>`;
}

/* ------------------------------------------------------------------ state */
const WKEY = "parallax.watch.v2", GKEY = "parallax.guess.v1";
const rd = k => { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch { return {}; } };
const wr = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

let REGISTER = SNAPSHOT.slice();
let POSTS = SEEDS.concat(fromRegister(REGISTER));
let TAB = "feed", SIFT = "all", QUERY = "", OPEN_ID = null;
let BENCH = { running:false, out:"", target:"Kepler-10", mode:"tension" };

const post = id => POSTS.find(p => p.id === id);
const matches = p => {
  if (["astronomy", "genomics", "physics"].includes(SIFT) && p.field !== SIFT) return false;
  if (["disagreement", "silence", "orthodoxy"].includes(SIFT) && p.kind !== SIFT) return false;
  if (SIFT === "settled" && p.status === "open") return false;
  if (!QUERY) return true;
  return [p.title, p.hook, p.plain, p.id, p.field].join(" ").toLowerCase().includes(QUERY);
};

/* ------------------------------------------------------------------ tiles */
function tile(p, w){
  const closed = p.status !== "open";
  const state = closed ? (p.status === "refuted" ? "Refuted" : p.status === "withdrawn" ? "Withdrawn" : "Settled") : "Open";
  const two = (p.sides || []).filter(s => Number.isFinite(s.value)).length >= 2;
  const tail = two
    ? `<div class="spark">${safely(() => spark(p), "")}</div>`
    : `<div class="metric">${p.members ? `<b>${p.members.length}</b><span>claims, none of them examined</span>`
        : p.nokill ? `<b>0</b><span>observations would settle it</span>`
        : `<span>${esc(KIND_WORD[p.kind] || "")}</span>`}</div>`;
  return `<button class="tile ${esc(p.field)} ${closed ? "closed" : ""} ${p.featured ? "wide" : ""}" data-open="${esc(p.id)}">
    <div class="head">
      <span class="fld">${esc(FIELD_WORD[p.field] || p.field)}</span>
      <span>${esc(KIND_WORD[p.kind] || p.kind)}</span>
      ${w[p.id] ? `<span class="kept">kept</span>` : ""}
      <span class="state">${state}</span>
    </div>
    <h3>${esc(p.title)}</h3>
    <p class="hook">${esc(p.hook)}</p>
    ${tail}
  </button>`;
}

/* ----------------------------------------------------------------- detail */
function detail(p, w){
  const g = rd(GKEY), mine = g[p.id];
  const two = (p.sides || []).filter(s => Number.isFinite(s.value)).length >= 2;
  const askFirst = p.guess && !mine;

  const evidence = `
    <div class="layer">
      <h4>What was actually measured</h4>
      ${two ? `<div class="plate">${safely(() => interval(p), "")}
        <div class="cap">${esc((p.sides[0] || {}).source || "")} · ${esc((p.sides[1] || {}).source || "")}</div>
      </div>
      <dl class="sides">${p.sides.map(s => `<div>
        <dt>${esc(s.label)}</dt>
        <dd>${num(s.value)}${Number.isFinite(s.err) && s.err ? ` ± ${num(s.err)}` : ""} <span style="font:500 12px/1 var(--mono);color:var(--ink-3)">${esc(s.unit || "")}</span></dd>
        <p>${esc(s.source)}${s.note ? " — " + esc(s.note) : ""}</p>
      </div>`).join("")}</dl>` : ""}
      ${p.statement ? `<p class="said">${esc(p.statement)}</p>` : ""}
    </div>`;

  const guessBlock = p.guess ? `<div class="guess">
      <p>${esc(p.guess)}</p>
      ${mine ? `<p class="said-you">You said <b>${esc(mine.pick)}</b>. Nothing has settled it yet —
        if it does, this entry moves, and you will see the move in Watch.</p>`
      : `<div class="opts">${(p.sides.length ? p.sides.map(s => s.label) : ["Yes", "No"])
          .map(l => `<button data-guess="${esc(p.id)}" data-pick="${esc(l)}">${esc(l)}</button>`).join("")}
        </div>`}
    </div>` : "";

  return `<button class="back" data-back>← All entries</button>
  <article class="detail ${esc(p.field)}">
    <div class="eyebrow">
      <span class="fld">${esc(FIELD_WORD[p.field] || p.field)}</span>
      <span>${esc(KIND_WORD[p.kind] || p.kind)}</span>
      <span>${p.machine ? "found by Parallax" : "curated entry"}</span>
      <span>${esc(p.status)}</span>
    </div>
    <h2>${esc(p.title)}</h2>
    <p class="plain">${esc(p.plain)}</p>
    ${guessBlock}
    ${askFirst ? `<p class="said" style="color:var(--ink-3)">The numbers are below. Answer first if you want to test yourself against them.</p>` : ""}
    ${evidence}
    <div class="layer">
      <h4>${p.nokill ? "Why this is not a claim" : "What would end it"}</h4>
      <div class="kill ${p.nokill ? "nokill" : ""}">
        <span class="lab">${p.nokill ? "No kill condition" : "Kill condition"}</span>
        <p>${esc(p.kill)}</p>
      </div>
      ${p.resolution ? `<div class="kill"><span class="lab">How it ended</span><p>${esc(p.resolution)}</p></div>` : ""}
      ${p.members ? `<ul class="cites">${p.members.map(m => `<li>${esc(m.object)} — ${num((m.observed || {}).value)} ${esc((m.observed || {}).unit)} · ${esc(m.claim_id)}</li>`).join("")}</ul>` : ""}
      ${p.cites ? `<ul class="cites">${p.cites.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}
    </div>
    <div class="foot">
      <span>${esc(p.id)}</span>
      ${p.opened ? `<span>${esc(days(p.opened))}</span>` : ""}
      ${p.url ? `<a href="${esc(p.url)}">source</a>` : ""}
      <button class="keep" data-id="${esc(p.id)}" aria-pressed="${!!w[p.id]}">${w[p.id] ? "Watching" : "Watch"}</button>
    </div>
  </article>`;
}

/* ------------------------------------------------------------------ views */
function feed(w){
  if (OPEN_ID && post(OPEN_ID)) return detail(post(OPEN_ID), w);
  const chips = [["all", "Everything"], ["astronomy", "Astronomy"], ["genomics", "Genomics"],
    ["disagreement", "Disagreements"], ["silence", "Silences"], ["orthodoxy", "Repeated, unchecked"], ["settled", "Settled"]];
  const sift = `<div class="sift">
      ${chips.map(([k, l]) => `<button class="chip" data-sift="${k}" aria-pressed="${SIFT === k}">${l}</button>`).join("")}
      <input id="q" type="search" placeholder="Search a question, a field, an object" value="${esc(QUERY)}">
    </div>`;
  const shown = POSTS.filter(matches);
  if (!shown.length) return sift + `<p class="hollow">Nothing matches that yet. The register holds only what has been measured or found — it is short on purpose.</p>`;
  return sift + `<div class="grid">${shown.map(p => tile(p, w)).join("")}</div>`;
}

function watch(w){
  const kept = POSTS.filter(p => w[p.id]);
  if (!kept.length)
    return `<p class="hollow">Nothing kept yet. Open an entry and press Watch — it is held here with the state it was in when you took it, so if it later moves, the move is what you see first.</p>`;
  return `<div class="grid">${kept.map(p => {
    const was = w[p.id] || {};
    const moved = was.status && was.status !== p.status;
    return (moved ? `<p class="moved" style="grid-column:1/-1">${esc(p.title)} moved: <b>${esc(was.status)}</b> → <b>${esc(p.status)}</b></p>` : "") + tile(p, w);
  }).join("")}</div>`;
}

// The researcher's side. Same engine the feed's machine entries come from,
// pointed wherever you want, live.
function bench(){
  return `<section class="bench">
    <h2>Point it at something</h2>
    <p class="prose">This runs the same sweep that produced the machine-found entries in the feed:
      it queries live observatory archives for a subject, pulls what has been published about
      the same objects, normalises every value to SI, and reports each disagreement with the
      measurement that would end it. A full sweep asks six services and takes about half a
      minute.</p>
    <div class="form">
      <input id="bench-target" value="${esc(BENCH.target)}" placeholder="Kepler-10, TRAPPIST-1, GW250114">
      <select id="bench-mode">
        ${["tension", "sky", "papers", "probe", "scorecard"].map(m => `<option value="${m}"${BENCH.mode === m ? " selected" : ""}>${m}</option>`).join("")}
      </select>
      <button id="bench-run"${BENCH.running ? " disabled" : ""}>${BENCH.running ? "Sweeping…" : "Run sweep"}</button>
    </div>
    <div class="modes">
      <div><code>tension</code><span>Both eyes: archives, literature, the comparison, and any claims it mints.</span></div>
      <div><code>sky</code><span>Observatories only. Stores what they report, compares nothing.</span></div>
      <div><code>papers</code><span>What the two paper indices return for one name. Writes nothing.</span></div>
      <div><code>probe</code><span>Asks every observatory whether it answers. Start here when something is wrong.</span></div>
      <div><code>scorecard</code><span>What has been claimed so far and how it resolved.</span></div>
    </div>
    ${BENCH.out ? `<div class="out">${BENCH.out}</div>` : ""}
  </section>`;
}

// The instrument's own record. A claim-making machine that never shows its
// retractions is asking to be trusted rather than checked.
function record(){
  const rows = REGISTER;
  const by = s => rows.filter(c => String(c.status || "open") === s).length;
  const n = rows.length, open = by("open"), withdrawn = by("withdrawn");
  const ended = rows.filter(c => String(c.status || "open") !== "open");
  return `<p class="verdict">Parallax has minted ${n} claims of its own. <em>${withdrawn || "None"} it withdrew itself.</em></p>
    <dl class="ledger">
      <div><dt>Still standing</dt><dd>${open}</dd><p>Each carries the measurement that would end it.</p></div>
      <div><dt>Settled or retracted</dt><dd>${n - open}</dd><p>Closed with a written reason, left visible.</p></div>
      <div><dt>Withdrawal rate</dt><dd>${n ? (withdrawn / n * 100).toFixed(0) : 0}<small>%</small></dd><p>Retracted by the instrument, not by someone catching it.</p></div>
      <div><dt>Curated entries</dt><dd>${SEEDS.length}</dd><p>Known open questions, entered by hand and labelled as such.</p></div>
    </dl>
    <p class="prose">Every claim the machine mints carries the measurement that would kill it —
      <b>the code refuses to write one without it</b>. When a claim's receipt fails, when a number
      it rested on cannot be found in the text it was supposedly read from, it is withdrawn with
      a written reason and left in the register rather than quietly deleted. The curated entries
      in the feed are marked as curated everywhere they appear; they are known questions with
      published numbers, not machine output dressed up as discovery.</p>
    ${ended.map(c => `<div class="layer">
      <h4>${esc(c.status)} · ${esc(c.claim_id)}</h4>
      <p class="said" style="font-size:17px;color:var(--ink)">${esc(c.title)}</p>
      <div class="kill"><span class="lab">How it ended</span><p>${esc(c.resolution || "")}</p></div>
    </div>`).join("")}`;
}

/* ----------------------------------------------------------------- render */
function render(){
  const w = rd(WKEY);
  const openQ = POSTS.filter(p => p.status === "open").length;
  const disputes = POSTS.filter(p => p.kind === "disagreement" && p.status === "open").length;
  const fields = new Set(POSTS.map(p => p.field)).size;

  document.getElementById("readout").innerHTML = `
    <div><dt>Open questions</dt><dd>${openQ}</dd></div>
    <div class="hot"><dt>Live disagreements</dt><dd>${disputes}</dd></div>
    <div><dt>Fields</dt><dd>${fields}</dd></div>
    <div><dt>Machine claims</dt><dd>${REGISTER.length}<small>own</small></dd></div>`;

  document.getElementById("n-feed").textContent = POSTS.length;
  document.getElementById("n-watch").textContent = Object.keys(w).length;
  document.getElementById("n-record").textContent = REGISTER.length;
  for (const t of ["feed", "watch", "bench", "record"])
    document.getElementById("tab-" + t).setAttribute("aria-selected", String(TAB === t));

  document.getElementById("main").innerHTML =
    TAB === "feed" ? feed(w) : TAB === "watch" ? watch(w) : TAB === "bench" ? bench() : record();
}

/* --------------------------------------------------------------- the bench */
async function runSweep(){
  BENCH.running = true; BENCH.out = "Asking the observatories…"; render();
  const body = { mode: BENCH.mode, target: BENCH.target, limit: 40 };
  try {
    const r = await fetch(`${SUPA}/functions/v1/sky`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${SUPA_KEY}` },
      body: JSON.stringify(body)
    });
    const j = await r.json();
    BENCH.out = summarise(j);
  } catch (e) {
    // Say what failed and hand over the exact command, rather than a spinner
    // that never resolves. Sandboxed frames block every outbound host.
    BENCH.out = `<b>This page could not reach the worker.</b>\n${String(e && e.message || e)}\n\n`
      + `That is expected inside a sandboxed frame, which blocks outbound requests.\n`
      + `The same sweep from a terminal:\n\n`
      + `curl -X POST ${SUPA}/functions/v1/sky \\\n  -H "Authorization: Bearer $ANON_KEY" \\\n`
      + `  -H "Content-Type: application/json" \\\n  -d '${JSON.stringify(body)}'`;
  }
  BENCH.running = false; render();
}

// The denominator matters as much as the finding: a sweep that compared four
// things and found one disagreement is a different object from one that
// compared four thousand.
function summarise(r){
  const L = [];
  L.push(`<b>worker ${esc(r.worker ?? "?")}  mode ${esc(r.mode ?? "?")}  ${esc(r.ms ?? "?")}ms</b>`);
  for (const l of r.ledger || []) L.push(`  ${String(l.name).padEnd(20)} ${l.got ?? 0}${l.error ? "  ERROR " + esc(l.error) : ""}`);
  if (r.read) L.push(`  read ${esc(JSON.stringify(r.read))}`);
  if (r.extraction) L.push(`  kept ${r.extraction.kept} of ${r.extraction.items_returned} from ${r.extraction.papers_in} papers`);
  for (const s of r.stored || []) L.push(`  stored ${s.table}: ${s.error ? "FAILED " + esc(s.error) : s.rows + " rows"}`);
  L.push(`<b>${(r.tensions || []).length} disagreements · ${(r.orphans || []).length} silences · ${(r.claims || []).length} claims</b>`);
  for (const t of r.tensions || [])
    L.push(`  ${esc(t.object)} ${esc(t.quantity)}: ${t.sigma}σ — ${t.measured.value}${esc(t.measured.unit)} vs ${t.reported.value}${esc(t.reported.unit)}`);
  return L.join("\n");
}

/* ------------------------------------------------------------------ events */
document.addEventListener("click", e => {
  const t = e.target.closest('[role="tab"]');
  if (t) { TAB = t.id.replace("tab-", ""); OPEN_ID = null; render(); window.scrollTo(0, 0); return; }

  const open = e.target.closest("[data-open]");
  if (open) { OPEN_ID = open.dataset.open; TAB = "feed"; render(); window.scrollTo(0, 0); return; }

  if (e.target.closest("[data-back]")) { OPEN_ID = null; render(); return; }

  const g = e.target.closest("[data-guess]");
  if (g) { const all = rd(GKEY); all[g.dataset.guess] = { pick: g.dataset.pick, at: Date.now() }; wr(GKEY, all); render(); return; }

  const k = e.target.closest(".keep");
  if (k) {
    const id = k.dataset.id, w = rd(WKEY);
    if (w[id]) delete w[id]; else w[id] = { status: (post(id) || {}).status, at: new Date().toISOString() };
    wr(WKEY, w); render(); return;
  }

  const c = e.target.closest(".chip");
  if (c) { SIFT = c.dataset.sift; OPEN_ID = null; render(); return; }

  if (e.target.id === "bench-run") { runSweep(); }
});

document.addEventListener("input", e => {
  if (e.target.id === "q") {
    QUERY = e.target.value.trim().toLowerCase(); render();
    const q = document.getElementById("q");
    if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
  if (e.target.id === "bench-target") BENCH.target = e.target.value;
  if (e.target.id === "bench-mode") BENCH.mode = e.target.value;
});
document.addEventListener("change", e => { if (e.target.id === "bench-mode") BENCH.mode = e.target.value; });

document.getElementById("stamp").textContent =
  "register read " + new Date().toISOString().slice(0, 16).replace("T", " ") + " UTC";
safely(() => render());

// Live claims where the page can reach the database; the snapshot stands in
// where it cannot, which is the normal case inside a sandboxed frame.
fetch(`${SUPA}/rest/v1/claims?select=*&order=opened_at.desc&limit=200`, {
  headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` }
}).then(r => r.ok ? r.json() : null).then(rows => {
  if (Array.isArray(rows) && rows.length) {
    REGISTER = rows;
    POSTS = SEEDS.concat(fromRegister(REGISTER));
    safely(() => render());
  }
}).catch(() => {});
</script>
