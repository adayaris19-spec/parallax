      </div>
      <dl class="sides">${p.sides.map(s => `<div>
        <dt>${esc(s.label)}</dt>
        <dd>${num(s.value)}${Number.isFinite(s.err) && s.err ? ` ± ${num(s.err)}` : ""} <span>${esc(s.unit || "")}</span></dd>
        <p>${esc(s.source)}${s.note ? " — " + esc(s.note) : ""}</p>
      </div>`).join("")}</dl>
    </div>` : "";

  const record = p.history ? `<div class="section">
      <h4>How the measurements have moved</h4>
      <div class="figwrap">${safely(() => history(p), "")}
        ${p.history_note ? `<p class="cap">${esc(p.history_note)}</p>` : ""}
      </div>
    </div>` : "";

  return `<button class="back" data-back>← All entries</button>
  <div class="entry-wrap ${esc(p.field)}">
    <article class="read">
      <div class="eyebrow">
        <span class="pill fld">${esc(FIELD_WORD[p.field] || p.field)}</span>
        <span class="pill kind">${esc(KIND_WORD[p.kind] || p.kind)}</span>
        <span class="pill kind">${p.machine ? "Found by Parallax" : "Curated entry"}</span>
        <span class="state">${esc(p.status)}</span>
      </div>
      <h2>${esc(p.title)}</h2>
      <p class="plain">${esc(p.plain)}</p>
      ${guessBlock}
      <div class="stakes">
        <h4>What turns on the answer</h4>
        <p>${esc(p.stakes)}</p>
      </div>
      ${numbers}
      ${record}

      ${p.positions ? `<div class="section">
        <h4>Who says what</h4>
        <p class="lead-in">The explanations actually on the table, and what each one commits its
          holder to. A position that predicts nothing the others do not is not in this list.</p>
        <div class="positions">${p.positions.map(x => `<article class="pos-card ${esc(String(x.state).split(" ")[0])}">
          <div class="pos-head">
            <h5>${esc(x.name)}</h5>
            <span class="pos-state">${esc(x.state)}</span>
          </div>
          <p class="who">${esc(x.who)}</p>
          <p class="says">${esc(x.claim)}</p>
          <p class="pred"><b>Commits them to</b>${esc(x.predicts)}</p>
        </article>`).join("")}</div>
      </div>` : ""}

      ${p.ruled_out ? `<div class="section">
        <h4>Already eliminated</h4>
        <p class="lead-in">Explanations that were live and are not any more. Knowing what has been
          tried is most of what separates a researcher from a reader.</p>
        <ul class="gone">${p.ruled_out.map(x => `<li>
          <span class="x">${esc(x.what)}</span>
          <span class="by">${esc(x.by)}</span>
        </li>`).join("")}</ul>
      </div>` : ""}

      ${p.running ? `<div class="section">
        <h4>Running now</h4>
        <p class="lead-in">The instruments that will move this, and when they report.</p>
        <ul class="soon">${p.running.map(x => `<li>
          <p class="what">${esc(x.what)}</p>
          <p class="meta"><span>${esc(x.who)}</span><span class="when">${esc(x.when)}</span></p>
        </li>`).join("")}</ul>
      </div>` : ""}

      <div class="section">
        <h4>${p.nokill ? "Why this is not a claim" : "What would end it"}</h4>
        <p class="killnote"><b>${p.nokill ? "No kill condition" : "Kill condition"}</b>${esc(p.kill)}</p>
        ${p.resolution ? `<p class="killnote" style="margin-top:18px"><b style="color:var(--live)">How it ended</b>${esc(p.resolution)}</p>` : ""}
      </div>
      <div class="section">
        <h4>${p.read_next ? "Read next" : "Sources"}</h4>
        <ul class="cites">
          ${p.members ? p.members.map(m => `<li>${esc(m.object)} — ${num((m.observed || {}).value)} ${esc((m.observed || {}).unit)} · ${esc(m.claim_id)}</li>`).join("") : ""}
          ${(p.read_next || p.cites || []).map(c => `<li>${esc(c)}</li>`).join("")}
        </ul>
        <div class="foot"><span>${esc(p.id)}</span>${p.opened ? `<span>${esc(days(p.opened))}</span>` : ""}${p.url ? `<a href="${esc(p.url)}">source</a>` : ""}</div>
      </div>
    </article>
    ${railFor(p, w)}
  </div>`;
}

/* ------------------------------------------------------------------ heads */
// Each tab introduces itself. The register's argument belongs to the Feed.
function heading(w){
  const openQ = POSTS.filter(p => p.status === "open").length;
  const disputes = POSTS.filter(p => p.kind === "disagreement" && p.status === "open").length;
  const fields = new Set(POSTS.map(p => p.field)).size;
  const mark = `<div class="mark">
      <svg viewBox="0 0 30 30" aria-hidden="true">
        <circle cx="15" cy="6" r="3.4" fill="var(--live)"></circle>
        <circle cx="4.5" cy="25" r="2.2" fill="var(--astro)"></circle>
        <circle cx="25.5" cy="25" r="2.2" fill="var(--astro)"></circle>
        <path d="M4.5 25 L15 6 L25.5 25" fill="none" stroke="var(--astro)" stroke-width="1.3" stroke-linejoin="round"></path>
        <path d="M4.5 25 H25.5" fill="none" stroke="var(--ink-3)" stroke-width="1.3" stroke-linecap="round" opacity=".5"></path>
      </svg><h1>Parallax</h1></div>`;

  if (TAB === "feed" && !OPEN_ID) return `${mark}
    <p class="lede">Every entry is a place where careful people measured the same thing and
      <b>got different answers</b> — or measured something once and never looked again.
      Each one says what observation would settle it.</p>
    <ul class="tally">
      <li><b>${openQ}</b> open questions</li>
      <li class="hot"><b>${disputes}</b> live disagreements</li>
      <li><b>${fields}</b> fields</li>
      <li><b>${REGISTER.length}</b> claims the machine found itself</li>
    </ul>`;
  if (TAB === "feed") return "";
  if (TAB === "watch") return `<h1 style="margin:0;font:800 30px/1.1 var(--ui);letter-spacing:-.038em">Watch</h1>
    <p class="lede" style="font-size:17px">Entries you are keeping, each held with the state it was in
      when you took it — so if one moves, the move is what you see first.</p>`;
  if (TAB === "bench") return `<h1 style="margin:0;font:800 30px/1.1 var(--ui);letter-spacing:-.038em">Workbench</h1>
    <p class="lede" style="font-size:17px">Point the same engine that found this register's machine
      entries at a subject of your own.</p>`;
  return `<h1 style="margin:0;font:800 30px/1.1 var(--ui);letter-spacing:-.038em">Live</h1>
    <p class="lede" style="font-size:17px">What the machine has been doing: when it last swept, what it
      has filed since, and whether its own claims have held up.</p>`;
}

/* ------------------------------------------------------------------ views */
function feed(w){
  if (OPEN_ID && post(OPEN_ID)) return detail(post(OPEN_ID), w);
  const chips = [["all", "Everything"], ["astronomy", "Astronomy"], ["genomics", "Genomics"], ["physics", "Physics"],
    ["disagreement", "Disagreements"], ["silence", "Silences"], ["orthodoxy", "Repeated, unchecked"], ["settled", "Settled"]];
  const sift = `<div class="sift">
      ${chips.map(([k, l]) => `<button class="chip" data-sift="${k}" aria-pressed="${SIFT === k}">${l}</button>`).join("")}
      <input id="q" type="search" placeholder="Search a question, a field, an object" value="${esc(QUERY)}">
    </div>`;
  // The Silences filter lists every object individually; everything else sees
  // the grouped view, which is the same claims read as findings.
  const pool = SIFT === "silence" ? SEEDS.concat(byNewest(fromRegister(REGISTER, true))) : POSTS;
  const placed = REGISTER.filter(c => Number.isFinite((c.observed || {}).ra));
  const map = (SIFT === "all" && !QUERY && placed.length) ? `<section class="skywrap">
      <div class="skyhead">
        <h4>Where the machine has looked</h4>
        <p>Every claim it filed, at the coordinates the archive gave it. The empty
          parts are not empty sky — they are sky nothing has swept.</p>
      </div>
      ${safely(() => skyMap(REGISTER), "")}
    </section>` : "";

  const shown = pool.filter(matches);
  if (!shown.length) return sift + `<p class="hollow">Nothing matches that yet. The register holds only what has been measured or found — it is short on purpose.</p>`;
  return map + sift + `<div class="grid">${shown.map(p => tile(p, w)).join("")}</div>`;
}

function watch(w){
  const kept = POSTS.filter(p => w[p.id]);
  if (!kept.length)
    return `<p class="hollow">Watch is where you keep the questions you care about. Open any entry
      and press <b>Watch this question</b> — or answer its "which side is right" — and it is held
      here with the state it was in at that moment. Then, if the question ever resolves, or Parallax
      withdraws a claim, the change is the first thing you see rather than something you would have
      had to notice.</p>`;
  const guesses = rd(GKEY);
  return `<div class="stack">${kept.map(p => {
    const was = w[p.id] || {}, g = guesses[p.id];
    const moved = was.status && was.status !== p.status;
    const closed = p.status !== "open";
    return `<article class="pos">
      <div class="top">
        <span class="pill fld ${esc(p.field)}">${esc(FIELD_WORD[p.field] || p.field)}</span>
        <span class="pill kind">${closed ? esc(p.status) : "still open"}</span>
      </div>
      <h3>${esc(p.title)}</h3>
      ${moved ? `<p class="moved">This moved since you kept it: <b>${esc(was.status)}</b> → <b>${esc(p.status)}</b></p>` : ""}
      ${g ? `<p class="line">You backed <b>${esc(g.pick)}</b>${closed ? "" : " — nothing has settled it yet"}.</p>`
          : `<p class="line">Kept ${esc(String(was.at || "").slice(0, 10))}. You have not taken a side.</p>`}
      <p class="await"><b>Waiting on:</b> ${esc(String(p.kill).split(". ")[0])}.</p>
      <div class="acts">
        <button data-open="${esc(p.id)}">Open</button>
        <button class="keep" data-id="${esc(p.id)}" aria-pressed="true" style="margin:0">Stop watching</button>
      </div>
    </article>`;
  }).join("")}</div>`;
}

// The researcher's side: what the engine does, the rules that gate a claim,
// what it queries, and a live run against any subject.
function bench(){
  const tabs = [["run", "Run a sweep"], ["how", "How it works"], ["rules", "What gates a claim"], ["what", "What it queries"]];
  const sub = `<div class="subnav">${tabs.map(([k, l]) =>
    `<button data-sub="${k}" aria-selected="${BENCH.sub === k}">${l}</button>`).join("")}</div>`;

  const run = `<div class="form">
      <input id="bench-target" value="${esc(BENCH.target)}" placeholder="Kepler-10, TRAPPIST-1, GW250114">
      <select id="bench-mode">
        ${[["tension", "tension — both eyes, the comparison, any claims"],
           ["sky", "sky — observatories only"],
           ["papers", "papers — what the indices return for one name"],
           ["probe", "probe — does every observatory answer?"],
           ["scorecard", "scorecard — what has been claimed, how it resolved"]]
          .map(([m, l]) => `<option value="${m}"${BENCH.mode === m ? " selected" : ""}>${esc(l)}</option>`).join("")}
      </select>
      <button id="bench-run"${BENCH.running ? " disabled" : ""}>${BENCH.running ? "Sweeping…" : "Run sweep"}</button>
    </div>
    ${BENCH.out ? `<div class="out">${BENCH.out}</div>`
      : `<p class="prose" style="margin-top:20px">A full sweep asks six services and takes about half a
        minute. It returns what it found <b>and what it dropped</b> — the denominator, always: a sweep
        that compared four things and found one disagreement is a different object from one that
        compared four thousand.</p>`}`;

  const how = `<div class="panel"><ol class="steps">
      <li><b>Asks the archives.</b> Six services in parallel, for every object matching the subject,
        with the value, its stated uncertainty, and the reference that published it.</li>
      <li><b>Reads the literature.</b> OpenAlex and arXiv for the same subject, ranked by whether the
        title actually names an object rather than by citation count.</li>
      <li><b>Extracts with receipts.</b> Every number pulled from an abstract must appear as digits in
        the text it was read from. A value that cannot be found in its own source is dropped.</li>
      <li><b>Normalises to SI.</b> Thirty-six unit spellings map to SI before anything is compared,
        and a quantity must match its declared dimension and a plausible magnitude.</li>
      <li><b>Computes the disagreement.</b> σ = |measured − reported| ÷ √(err₁² + err₂²). No model
        past this line — from here it is arithmetic.</li>
      <li><b>Mints, or refuses to.</b> A claim is written only with the measurement that would end it,
        and the reply carries what was dropped and why.</li>
    </ol></div>`;

  const rules = `<div class="panel"><ul class="rules">
      <li><b>No error bar, no claim.</b> Two numbers without stated uncertainties are not a disagreement.</li>
      <li><b>No kill condition, no claim.</b> No code path writes a claim without the measurement that would end it.</li>
      <li><b>No value that is not in the source text.</b> Every stated value must appear as digits in the text it was read from.</li>
      <li><b>An absence must be searched for.</b> Before saying nothing explains an object, the worker queries an index and carries the hit count as its receipt. If the check errors, no claim.</li>
      <li><b>A value must agree with what it claims to be.</b> An age and an orbital period are both times; only magnitude separates them.</li>
      <li><b>Never compare in the unit it arrived in.</b> Jupiter radii against Earth radii is a factor of eleven.</li>
      <li><b>A targeted question gets targeted claims.</b> Correct claims about the wrong subject are still the wrong answer.</li>
    </ul></div>`;

  const what = `<div class="panel"><ul class="srcs">
      <li><code>exoplanet-archive</code><span>Confirmed planets: mass, radius, period, each with its published reference.</span></li>
      <li><code>gwosc</code><span>Every gravitational-wave event released by LIGO, Virgo and KAGRA.</span></li>
      <li><code>simbad</code><span>Identifiers, coordinates and object types for anything with a name.</span></li>
      <li><code>mpc / jpl-sbdb</code><span>Asteroids and comets: orbital elements, diameters, albedos.</span></li>
      <li><code>openalex</code><span>The literature perimeter — title and abstract, every field and year.</span></li>
      <li><code>arxiv</code><span>Preprints, for anything published faster than an index can catch it.</span></li>
    </ul></div>`;

  return `<section class="bench">${sub}${
    BENCH.sub === "how" ? how : BENCH.sub === "rules" ? rules : BENCH.sub === "what" ? what : run}</section>`;
}

// Live: is this thing actually running, and is it any good? Both answers are
// computed from the register's own timestamps rather than asserted.
function live(){
  const rows = REGISTER.slice().sort((x, y) => Date.parse(y.opened_at || 0) - Date.parse(x.opened_at || 0));
  const by = st => rows.filter(c => String(c.status || "open") === st).length;
  const n = rows.length, open = by("open"), withdrawn = by("withdrawn");
  const ended = rows.filter(c => String(c.status || "open") !== "open");
  const newest = rows[0] && Date.parse(rows[0].opened_at);
  const ago = ms => {
    if (!Number.isFinite(ms)) return "—";
    const h = (Date.now() - ms) / 36e5;
    return h < 1 ? `${Math.max(1, Math.round(h * 60))} min ago`
      : h < 48 ? `${Math.round(h)} h ago` : `${Math.round(h / 24)} days ago`;
  };

  // Claims filed per day, from opened_at. The register's actual pulse — a flat
  // stretch means nobody ran a sweep, and that is worth being able to see.
  const perDay = new Map();
  for (const c of rows) {
    const d = String(c.opened_at || "").slice(0, 10);
    if (d) perDay.set(d, (perDay.get(d) || 0) + 1);
  }
  const days30 = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10);
    days30.push({ d, n: perDay.get(d) || 0 });
  }
  const peak = Math.max(1, ...days30.map(x => x.n));
  const W = 660, H = 92, bw = (W - 8) / 30;
  let pulse = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="claims filed per day over the last thirty days">`;
  days30.forEach((x, i) => {
    const h = x.n ? Math.max(4, (x.n / peak) * (H - 26)) : 2;
    pulse += `<rect x="${(4 + i * bw).toFixed(1)}" y="${(H - 20 - h).toFixed(1)}" width="${(bw - 3).toFixed(1)}" height="${h.toFixed(1)}" rx="2.5" fill="${x.n ? "var(--astro)" : "rgba(16,17,20,.10)"}"></rect>`;
  });
  pulse += `<text x="4" y="${H - 4}" font-family="Manrope,sans-serif" font-weight="600" font-size="11" fill="var(--ink-3)">30 days ago</text>`;
  pulse += `<text x="${W - 4}" y="${H - 4}" text-anchor="end" font-family="Manrope,sans-serif" font-weight="600" font-size="11" fill="var(--ink-3)">today</text>`;
  pulse += `<text x="${W - 4}" y="12" text-anchor="end" font-family="Manrope,sans-serif" font-weight="700" font-size="11" fill="var(--ink-3)">peak ${peak} in a day</text></svg>`;

  return `<div class="stack">
    <div class="card">
      <h5>The machine's pulse</h5>
      <div class="figwrap">${pulse}</div>
      <p class="cap" style="margin-top:12px">${n} claims filed in total; the most recent
        <b>${ago(newest)}</b>. A flat stretch is not a quiet universe — it is nobody having run a sweep.</p>
    </div>

    <div class="card">
      <h5>Newest in the register</h5>
      <div class="stream">
        ${rows.slice(0, 12).map(c => `<div class="ev">
          <span class="when">${esc(String(c.opened_at || "").slice(0, 10))}</span>
          <span class="what">${esc(c.title)}</span>
          <span class="tagm">${esc(c.kind)}${String(c.status) !== "open" ? " · " + esc(c.status) : ""}</span>
        </div>`).join("")}
      </div>
    </div>

    <div class="card">
      <h5>Has it been right?</h5>
      <dl class="ledger" style="margin:0;max-width:none">
        <div><dt>Still standing</dt><dd>${open}</dd><p>Each carries the measurement that would end it.</p></div>
        <div><dt>Closed</dt><dd>${n - open}</dd><p>Settled or retracted, with a written reason.</p></div>
        <div><dt>Withdrawn by itself</dt><dd>${n ? (withdrawn / n * 100).toFixed(0) : 0}<small>%</small></dd><p>Retracted by the instrument, not by someone catching it.</p></div>
      </dl>
      <p class="cap" style="margin-top:16px">A claim-making machine that never shows its retractions is
        asking to be trusted rather than checked. Every closed claim stays in the register with the
        reason it closed.</p>
      ${ended.map(c => `<div class="closed-claim">
        <h6>${esc(c.title)}</h6>
        <p class="meta">${esc(c.status)} · ${esc(c.claim_id)}</p>
        <p>${esc(c.resolution || "")}</p>
      </div>`).join("")}
    </div>
  </div>`;
}

/* ----------------------------------------------------------------- render */
function render(){
  const w = rd(WKEY);
  document.getElementById("n-feed").textContent = SEEDS.length + REGISTER.length;
  document.getElementById("n-watch").textContent = Object.keys(w).length;
  document.getElementById("n-live").textContent = REGISTER.length;
  for (const t of ["feed", "watch", "bench", "live"])
    document.getElementById("tab-" + t).setAttribute("aria-selected", String(TAB === t));
  const mast = document.getElementById("mast");
  const head = heading(w);
  mast.innerHTML = head;
  mast.className = TAB === "feed" ? "mast" : "mast left";
  mast.style.padding = head ? "34px 0 6px" : "10px 0 0";
  document.getElementById("main").innerHTML =
    TAB === "feed" ? feed(w) : TAB === "watch" ? watch(w) : TAB === "bench" ? bench() : live();
}

/* --------------------------------------------------------------- the bench */
async function runSweep(){
  BENCH.running = true; BENCH.out = "Asking the observatories…"; render();
  const body = { mode: BENCH.mode, target: BENCH.target, limit: 40 };
  try {
    const r = await fetch(`${SUPA}/functions/v1/sky`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${SUPA_KEY}` },
      body: JSON.stringify(body)
    });
    BENCH.out = summarise(await r.json());
  } catch (e) {
    // Say what failed and hand over the exact command, rather than a spinner
    // that never resolves. Sandboxed frames block every outbound host.
    BENCH.out = `<b>This page could not reach the worker.</b>\n${esc(String(e && e.message || e))}\n\n`
      + `That is expected inside a sandboxed frame, which blocks outbound requests.\n`
      + `The same sweep from a terminal:\n\n`
      + `curl -X POST ${SUPA}/functions/v1/sky \\\n  -H "Authorization: Bearer $ANON_KEY" \\\n`
      + `  -H "Content-Type: application/json" \\\n  -d '${esc(JSON.stringify(body))}'`;
  }
  BENCH.running = false; render();
}

// The denominator matters as much as the finding: a sweep that compared four
// things and found one disagreement is a different object from one that
// compared four thousand.
function summarise(r){
  const L = [];
  L.push(`<b>worker ${esc(r.worker ?? "?")}  mode ${esc(r.mode ?? "?")}  ${esc(r.ms ?? "?")}ms</b>`);
  for (const l of r.ledger || []) L.push(`  ${String(l.name).padEnd(20)} ${l.got ?? 0}${l.error ? "  ERROR " + esc(l.error) : ""}`);
  if (r.read) L.push(`  read ${esc(JSON.stringify(r.read))}`);
  if (r.extraction) L.push(`  kept ${r.extraction.kept} of ${r.extraction.items_returned} from ${r.extraction.papers_in} papers`);
  if (r.extraction && r.extraction.dropped) L.push(`  dropped ${esc(JSON.stringify(r.extraction.dropped))}`);
  for (const s of r.stored || []) L.push(`  stored ${esc(s.table)}: ${s.error ? "FAILED " + esc(s.error) : s.rows + " rows"}`);
  L.push(`<b>${(r.tensions || []).length} disagreements · ${(r.orphans || []).length} silences · ${(r.claims || []).length} claims</b>`);
  for (const t of r.tensions || [])
    L.push(`  ${esc(t.object)} ${esc(t.quantity)}: ${t.sigma}σ — ${t.measured.value}${esc(t.measured.unit)} vs ${t.reported.value}${esc(t.reported.unit)}`);
  return L.join("\n");
}

/* ------------------------------------------------------------------ events */
document.addEventListener("click", e => {
  const t = e.target.closest('[role="tab"]');
  if (t) { TAB = t.id.replace("tab-", ""); OPEN_ID = null; render(); window.scrollTo(0, 0); return; }
  const open = e.target.closest("[data-open]");
  if (open) { OPEN_ID = open.dataset.open; TAB = "feed"; render(); window.scrollTo(0, 0); return; }
  if (e.target.closest("[data-back]")) { OPEN_ID = null; render(); window.scrollTo(0, 0); return; }
  const g = e.target.closest("[data-guess]");
  if (g) {
    // Taking a side is taking a position, so it is kept in Watch — which is
    // what makes Watch fill up with things you actually care about.
    const all = rd(GKEY); all[g.dataset.guess] = { pick: g.dataset.pick, at: Date.now() }; wr(GKEY, all);
    const w = rd(WKEY);
    if (!w[g.dataset.guess]) { w[g.dataset.guess] = { status: (post(g.dataset.guess) || {}).status, at: new Date().toISOString() }; wr(WKEY, w); }
    render(); return;
  }
  const sub = e.target.closest("[data-sub]");
  if (sub) { BENCH.sub = sub.dataset.sub; render(); return; }
  const sug = e.target.closest("[data-ask]");
  if (sug) { askAbout(sug.dataset.ask, sug.dataset.q); return; }
  const k = e.target.closest(".keep");
  if (k) {
    const id = k.dataset.id, w = rd(WKEY);
    if (w[id]) delete w[id]; else w[id] = { status: (post(id) || {}).status, at: new Date().toISOString() };
    wr(WKEY, w); render(); return;
  }
  const c = e.target.closest(".chip");
  if (c) { SIFT = c.dataset.sift; OPEN_ID = null; render(); return; }
  if (e.target.id === "bench-run") runSweep();
});

document.addEventListener("submit", e => {
  const f = e.target.closest("[data-askform]");
  if (!f) return;
  e.preventDefault();
  const q = String(new FormData(f).get("q") || "").trim();
  if (q) askAbout(f.dataset.askform, q);
});

document.addEventListener("input", e => {
  if (e.target.id === "q") {
    QUERY = e.target.value.trim().toLowerCase(); render();
    const q = document.getElementById("q");
    if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
  if (e.target.id === "bench-target") BENCH.target = e.target.value;
});
document.addEventListener("change", e => { if (e.target.id === "bench-mode") BENCH.mode = e.target.value; });

/* -------------------------------------------------------- ask about an entry
   The page hands Claude the entry's own facts and the reader's question. It
   cannot browse, so the answer is reasoning over what is here plus what the
   model already knows — the copy in the rail says so rather than implying a
   lookup. */
async function askAbout(id, q){
  const p = post(id);
  if (!p || !SAMPLE || (ASK[id] || {}).busy) return;
  ASK[id] = { q, text:"", err:"", busy:true };
  render();

  const facts = [
    `ENTRY: ${p.title}`,
    `FIELD: ${p.field}   KIND: ${p.kind}   STATUS: ${p.status}`,
    `WHAT IT IS: ${p.plain}`,
    `WHAT TURNS ON IT: ${p.stakes}`,
    ...(p.sides || []).filter(s => Number.isFinite(s.value))
      .map(s => `MEASUREMENT: ${s.label} = ${s.value}${s.err ? " ± " + s.err : ""} ${s.unit || ""} (${s.source})`),
    Number.isFinite(p.sigma) ? `SEPARATION: ${p.sigma} sigma` : "",
    `WHAT WOULD END IT: ${p.kill}`,
    `SOURCES: ${(p.cites || []).join("; ")}`
  ].filter(Boolean).join("\n");

  const prompt = `You are answering inside Parallax, a register of open scientific questions.
A reader is looking at the entry below and has asked a question about it.

${facts}

READER'S QUESTION: ${q}

Answer in two to four short paragraphs of plain prose — no headings, no bullet lists.
Be concrete and technical where it helps, but assume the reader is not a specialist in this field.
Do not invent numbers: use the values above, or say that a figure is not in front of you.
If the honest answer is that nobody knows, say that and say what is missing.
If the question cannot be answered from this entry, say so briefly and answer what you can.`;

  try {
    const { text } = await SAMPLE(prompt, {
      modelTier: "default",
      onText: ({ text }) => {
        if (!ASK[id]) return;
        ASK[id].text = text;
        const el = document.getElementById("ask-out");
        if (el) el.textContent = text;
      }
    });
    ASK[id].text = text;
  } catch (err) {
    const code = (err && err.code) || "upstream_error";
    ASK[id].text = (err && err.text) || "";
    ASK[id].err =
      code === "not_granted" || code === "sampling_disabled" ? "Asking Claude is not enabled for this view."
      : code === "rate_limited" ? "Too many questions at once. Try again in a minute."
      : code === "refused" ? "Claude declined to answer that one. Try asking it differently."
      : "That did not come back. Try again.";
    if (code === "not_granted" || code === "sampling_disabled") SAMPLE = null;
  }
  if (ASK[id]) ASK[id].busy = false;
  render();
}

safely(() => render());

// The Ask box only exists where the viewer's runtime can answer. Absence is
// the normal case: the rail is written to read correctly without it.
(async () => {
  try { SAMPLE = (window.claude && window.claude.use) ? await window.claude.use("sample") : null; }
  catch { SAMPLE = null; }
  if (SAMPLE) safely(() => render());
})();

// Live claims where the page can reach the database; the snapshot stands in
// where it cannot, which is the normal case inside a sandboxed frame.
fetch(`${SUPA}/rest/v1/claims?select=*&order=opened_at.desc&limit=200`, {
  headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` }
}).then(r => r.ok ? r.json() : null).then(rows => {
  if (Array.isArray(rows) && rows.length) {
    REGISTER = rows;
    POSTS = SEEDS.concat(byNewest(fromRegister(REGISTER)));
    safely(() => render());
  }
}).catch(() => {});
</script>
