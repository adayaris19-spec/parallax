<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Parallax</title>
<meta name="description" content="Follow humanity's goals. See what is really blocking them, and what moved today.">
<style>
:root{
  --bg:#f7f7f5; --card:#ffffff; --ink:#151515; --ink2:#3d3d3d; --muted:#6e6e6a; --line:#e6e5e1; --line2:#d6d4cf;
  --accent:#2f54d8; --accent-ink:#ffffff; --accent-soft:rgba(47,84,216,.10);
  --solved:#15803d; --progress:#b45309; --blocked:#b42318; --open:#8a8a85;
  --shadow:0 1px 2px rgba(0,0,0,.04);
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1012; --card:#17181b; --ink:#f1f1ef; --ink2:#cfcfcb; --muted:#9a9a95; --line:#2a2b2f; --line2:#3a3b40;
    --accent:#7d97ff; --accent-ink:#0f1012; --accent-soft:rgba(125,151,255,.14);
    --solved:#4ade80; --progress:#fbbf24; --blocked:#f87171; --open:#8f8f8a;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* top bar */
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center}
.brand{font-weight:750;letter-spacing:.02em;text-decoration:none;font-size:17px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand-mark{width:22px;height:22px;flex:none}
.search{flex:1;position:relative}
.search input{width:100%;height:38px;border-radius:19px;border:1px solid var(--line2);background:var(--card);color:var(--ink);padding:0 14px 0 36px;font:inherit;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:12px;top:11px;width:16px;height:16px;color:var(--muted)}
.suggest{position:absolute;top:44px;left:0;right:0;background:var(--card);border:1px solid var(--line2);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.suggest a,.suggest button{display:flex;width:100%;gap:10px;align-items:center;padding:10px 12px;text-decoration:none;border:0;background:none;text-align:left;cursor:pointer}
.suggest a:hover,.suggest button:hover,.suggest .on{background:var(--accent-soft)}
.navlink{text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
.navlink:hover{color:var(--ink)}

main{max-width:680px;margin:0 auto;padding:0 16px 80px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -16px;padding:0 16px}
.tab{appearance:none;border:0;background:none;padding:14px 12px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;text-decoration:none}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}

/* posts */
.post{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;box-shadow:var(--shadow)}
.post-h{display:flex;gap:10px;align-items:center;min-width:0}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;text-decoration:none}
.av.lg{width:64px;height:64px;font-size:22px}
.who{min-width:0;line-height:1.25}
.who a{text-decoration:none}
.who .h{font-weight:700}
.who .n{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.when{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap;align-self:flex-start}
.kind{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin:12px 0 2px}
.kind.bottleneck{color:var(--blocked)} .kind.advance,.kind.solved{color:var(--solved)} .kind.setback{color:var(--progress)}
.kind.forgotten{color:var(--accent)} .kind.mapped{color:var(--muted)}
.post h3{font-size:17px;line-height:1.35;margin:2px 0 6px}
.post p{margin:0 0 8px;color:var(--ink2)}
.srcs{margin:10px 0 0;padding:0;list-style:none;border-top:1px solid var(--line);padding-top:8px}
.srcs li{font-size:13px;color:var(--muted);margin:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcs a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line2)}
.srcs a:hover{color:var(--accent);border-color:var(--accent)}
.post-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.check{font-size:12.5px;color:var(--muted);display:inline-flex;gap:5px;align-items:center;margin-right:auto}
.check.two{color:var(--solved)}
.btn{appearance:none;border:1px solid var(--line2);background:var(--card);border-radius:18px;padding:6px 14px;font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.following{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}

/* goal page */
.goal-h{padding:22px 0 10px;display:flex;gap:16px;align-items:flex-start}
.goal-h h1{font-size:24px;line-height:1.2;margin:0}
.goal-h .handle{color:var(--muted);font-weight:600}
.goal-h .sum{margin:8px 0 0;color:var(--ink2)}
.goal-h .act{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .l{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.stat .v{font-size:22px;font-weight:750;margin-top:2px}
.stat .s{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--solved);border-radius:4px}
.bneck{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blocked);border-radius:14px;padding:12px 14px;margin:12px 0}
.bneck .l{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--blocked)}
.bneck h3{margin:4px 0;font-size:16px}
.bneck p{margin:0;color:var(--ink2);font-size:14px}
.branch{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.branch-h{padding:12px 14px;border-bottom:1px solid var(--line)}
.branch-h h3{margin:0;font-size:15.5px}
.branch-h p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.mini{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:8px;background:var(--line)}
.mini i{display:block;height:100%}
details.leaf{border-top:1px solid var(--line)}
details.leaf:first-of-type{border-top:0}
details.leaf summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
details.leaf summary::-webkit-details-marker{display:none}
details.leaf[open] summary{background:var(--accent-soft)}
details.leaf.target summary{background:var(--accent-soft)}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px}
.st-solved{background:var(--solved)} .st-in_progress{background:var(--progress)} .st-blocked{background:var(--blocked)} .st-open{background:var(--open)}
.leaf-t{flex:1;min-width:0}
.leaf-t b{font-weight:600}
.leaf-t span{display:block;font-size:12.5px;color:var(--muted)}
.leaf-body{padding:0 14px 12px 34px;font-size:14px;color:var(--ink2)}
.leaf-body p{margin:6px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:12px 0 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend .dot{margin:0;width:8px;height:8px}

/* misc */
.note{color:var(--muted);text-align:center;padding:36px 10px}
.note h2{color:var(--ink);font-size:18px;margin:0 0 6px}
.more{display:block;margin:16px auto}
.grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
@media (min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;display:flex;gap:12px;align-items:flex-start}
.gcard:hover{border-color:var(--line2)}
.gcard .t{min-width:0;flex:1}
.gcard b{display:block}
.gcard small{color:var(--muted);display:block}
.steps{list-style:none;padding:0;margin:18px auto;max-width:360px;text-align:left}
.steps li{display:flex;gap:10px;align-items:center;padding:6px 0;color:var(--muted)}
.steps li.done{color:var(--ink)}
.steps li.now{color:var(--ink);font-weight:600}
.spin{width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;flex:none}
.tick{width:14px;height:14px;flex:none;color:var(--solved)}
.idle{width:14px;height:14px;border:2px solid var(--line2);border-radius:50%;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.foot{max-width:680px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:12.5px;text-align:center}
.foot a{color:var(--muted)}
.hide{display:none!important}
@media (max-width:520px){
  .navlink.x{display:none}
  .brand-word{display:none}
  .check{flex-basis:100%}
  .goal-h h1{font-size:21px}
  .stats{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/" aria-label="Parallax home">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="15" cy="12" r="6.5" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>
      <span class="brand-word">Parallax</span>
    </a>
    <form class="search" id="searchForm" role="search" autocomplete="off">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search any goal: Mars, fusion, Alzheimer's…" aria-label="Search any goal" maxlength="160">
      <div class="suggest hide" id="suggest" role="listbox"></div>
    </form>
    <a class="navlink x" href="#/explore">Explore</a>
  </div>
</header>

<main id="view" aria-live="polite"></main>
<footer class="foot">
  Parallax maps goals from published research with AI. Every post links the papers it rests on, and a problem is only marked solved when two independent sources agree.
  <br><a href="instrument.html">The original Parallax instrument</a>
</footer>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
// ------------------------------------------------------------ config
const SUPA_URL = 'https://zfmjjazkmolvywvayjzj.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmbWpqYXprbW9sdnl3dmF5anpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMzQ2NjEsImV4cCI6MjEwMTYxMDY2MX0.NA72AfuZ7axlxGBfKJwR4aNKyufjUz--fm3CG1_dCY8';
const GOAL_COLS = 'id,slug,handle,name,summary,status,stage,progress,horizon_low,horizon_high,horizon_note,bottleneck_key,error,created_at,mapped_at,pulsed_at';
const POST_COLS = 'id,goal_id,node_key,kind,headline,body,sources,independent_sources,expert_reviewed,reviewer,created_at';
const PAGE = 30;

// ------------------------------------------------------------ helpers
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = (u) => /^https?:\/\//i.test(String(u || '')) ? String(u) : null;
const view = $('#view');

async function rest(path) {
  const r = await fetch(`${SUPA_URL}/rest/v1/${path}`, { headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` } });
  if (!r.ok) throw new Error(`Parallax's data answered ${r.status}`);
  return r.json();
}

function ago(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return 'now';
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  if (s < 86400) return `${Math.floor(s / 3600)}h`;
  if (s < 86400 * 7) return `${Math.floor(s / 86400)}d`;
  return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: s > 86400 * 300 ? 'numeric' : undefined });
}

function hue(str) {
  let h = 0;
  for (const c of String(str)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return h % 360;
}
function avatar(g, big = false) {
  const initials = String(g.handle || '?').replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || '?';
  return `<a class="av${big ? ' lg' : ''}" href="#/g/${encodeURIComponent(g.slug)}" style="background:hsl(${hue(g.slug)} 55% 42%)" aria-label="@${esc(g.handle)}">${esc(initials)}</a>`;
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2200);
}

// Follows live on this device until accounts arrive.
const follows = {
  get() { try { return JSON.parse(localStorage.getItem('px.follow') || '[]'); } catch { return []; } },
  has(slug) { return this.get().includes(slug); },
  toggle(slug) {
    const list = this.get();
    const next = list.includes(slug) ? list.filter((s) => s !== slug) : [...list, slug];
    try { localStorage.setItem('px.follow', JSON.stringify(next)); } catch {}
    return next.includes(slug);
  },
};
function followBtn(slug) {
  const on = follows.has(slug);
  return `<button class="btn ${on ? 'following' : 'primary'}" data-follow="${esc(slug)}">${on ? 'Following' : 'Follow'}</button>`;
}

async function share(path, title) {
  const url = `${location.origin}${location.pathname}#${path}`;
  try {
    if (navigator.share) { await navigator.share({ title, url }); return; }
    await navigator.clipboard.writeText(url);
    toast('Link copied');
  } catch { /* the person closed the share sheet */ }
}

// ------------------------------------------------------------ data
let goalsCache = null;
async function goals(force = false) {
  if (!goalsCache || force) goalsCache = await rest(`goals?select=${GOAL_COLS}&status=neq.failed&order=name.asc&limit=2000`);
  return goalsCache;
}
const goalById = (list, id) => list.find((g) => g.id === id);

// ------------------------------------------------------------ post card
const KIND = { mapped: 'New goal', bottleneck: 'Bottleneck', advance: 'Advance', setback: 'Setback', solved: 'Branch solved', forgotten: 'Forgotten idea' };

function postCard(p, g) {
  const srcs = (p.sources || []).slice(0, 4).map((s) => {
    const url = safeUrl(s.url);
    const meta = [s.year, s.venue].filter(Boolean).join(', ');
    const t = esc(s.title);
    return `<li>${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${t}</a>` : t}${meta ? ` <span>(${esc(meta)})</span>` : ''}</li>`;
  }).join('');
  let check = '';
  if (p.kind !== 'mapped') {
    check = p.independent_sources >= 2
      ? `<span class="check two" title="At least two papers by different first authors back this post">✓ ${p.independent_sources} independent sources</span>`
      : `<span class="check" title="One research group backs this post so far">One source so far</span>`;
    if (p.expert_reviewed) check = check.replace('</span>', ' · expert reviewed</span>');
  } else check = '<span class="check"></span>';
  const treeLink = p.node_key ? `<a class="btn" href="#/g/${encodeURIComponent(g.slug)}/tree/${encodeURIComponent(p.node_key)}">In the tree</a>` : '';
  return `<article class="post">
    <div class="post-h">${avatar(g)}<div class="who"><a class="h" href="#/g/${encodeURIComponent(g.slug)}">@${esc(g.handle)}</a><span class="n">${esc(g.name)}</span></div><time class="when" datetime="${esc(p.created_at)}">${esc(ago(p.created_at))}</time></div>
    <span class="kind ${esc(p.kind)}">${esc(KIND[p.kind] || p.kind)}</span>
    <h3>${esc(p.headline)}</h3>
    ${p.body ? `<p>${esc(p.body)}</p>` : ''}
    ${srcs ? `<ul class="srcs">${srcs}</ul>` : ''}
    <div class="post-f">${check}${treeLink}${followBtn(g.slug)}<button class="btn" data-share="/g/${esc(g.slug)}" data-title="${esc(p.headline)}" aria-label="Share">Share</button></div>
  </article>`;
}

// ------------------------------------------------------------ views
function note(title, text, extra = '') {
  return `<div class="note"><h2>${esc(title)}</h2><div>${text}</div>${extra}</div>`;
}
function failNote(e, retry) {
  return note("Parallax can't reach its data right now", esc(e.message || e), `<p><button class="btn" onclick="${retry}">Try again</button></p>`);
}

async function feedView(tab) {
  view.innerHTML = `<nav class="tabs" role="tablist">
      <a class="tab" role="tab" href="#/" aria-selected="${tab === 'all'}">Everything</a>
      <a class="tab" role="tab" href="#/following" aria-selected="${tab === 'following'}">Following</a>
      <a class="tab" role="tab" href="#/explore" aria-selected="false">Explore</a>
    </nav><div id="posts"><div class="note"><span class="spin" style="display:inline-block"></span></div></div>`;
  const box = $('#posts');
  let list;
  try { list = await goals(); } catch (e) { box.innerHTML = failNote(e, 'route()'); return; }
  if (!list.length) {
    box.innerHTML = note('No goals mapped yet', 'Type any goal in the search bar, for example <b>humans living on Mars</b>. Parallax will map what stands between us and it, and its posts will start here.');
    return;
  }
  let filter = '';
  if (tab === 'following') {
    const mine = list.filter((g) => follows.has(g.slug)).map((g) => g.id);
    if (!mine.length) {
      box.innerHTML = note('Follow a goal to fill this tab', 'Pick goals you care about from Explore, or tap Follow on any post.', `<p><a class="btn primary" href="#/explore">Explore goals</a></p>`);
      return;
    }
    filter = `&goal_id=in.(${mine.join(',')})`;
  }
  let before = null;
  const load = async () => {
    const page = await rest(`posts?select=${POST_COLS}${filter}${before ? `&created_at=lt.${encodeURIComponent(before)}` : ''}&order=created_at.desc&limit=${PAGE}`);
    const html = page.map((p) => { const g = goalById(list, p.goal_id); return g ? postCard(p, g) : ''; }).join('');
    before = page.length ? page[page.length - 1].created_at : before;
    return { html, more: page.length === PAGE };
  };
  try {
    const first = await load();
    if (!first.html) {
      box.innerHTML = note('Nothing posted yet', 'The goals are still being mapped. Their first posts appear here as soon as they are ready.');
      return;
    }
    box.innerHTML = first.html + (first.more ? '<button class="btn more" id="more">Load more</button>' : '');
    const wire = () => {
      const m = $('#more');
      if (!m) return;
      m.onclick = async () => {
        m.disabled = true;
        try {
          const next = await load();
          m.insertAdjacentHTML('beforebegin', next.html);
          if (!next.more) m.remove(); else m.disabled = false;
        } catch (e) { m.disabled = false; toast(e.message); }
      };
    };
    wire();
  } catch (e) { box.innerHTML = failNote(e, 'route()'); }
}

async function exploreView() {
  view.innerHTML = `<h1 style="font-size:22px;margin:22px 0 4px">Explore goals</h1><p style="color:var(--muted);margin:0">Every goal Parallax has mapped. Search for one that is missing and it will be mapped.</p><div id="grid" class="grid"></div>`;
  let list;
  try { list = await goals(true); } catch (e) { $('#grid').outerHTML = failNote(e, 'route()'); return; }
  if (!list.length) { $('#grid').outerHTML = note('No goals yet', 'Search for any goal to map the first one.'); return; }
  $('#grid').innerHTML = list.map((g) => {
    const pct = Math.round((g.progress || 0) * 100);
    const sub = g.status === 'mapping' ? 'Being mapped now' : `${pct}% of its problems solved`;
    return `<a class="gcard" href="#/g/${encodeURIComponent(g.slug)}">${avatar(g).replace('<a ', '<span ').replace('</a>', '</span>').replace(/ href="[^"]*"/, '')}
      <span class="t"><b>@${esc(g.handle)}</b><small>${esc(g.name)}</small>
      ${g.status === 'ready' ? `<span class="bar"><i style="width:${pct}%"></i></span>` : ''}<small style="margin-top:4px">${esc(sub)}</small></span></a>`;
  }).join('');
}

const STAGES = [['tree', 'Understanding the goal'], ['evidence', 'Searching the research'], ['assess', 'Judging every problem against the evidence'], ['synthesize', 'Finding the bottleneck and writing the first posts']];
let pollTimer;

function horizonText(g) {
  if (g.horizon_low == null || g.horizon_high == null) return '—';
  if (g.horizon_low === g.horizon_high) return `~${g.horizon_low} yrs`;
  return `${g.horizon_low}–${g.horizon_high} yrs`;
}

function leafStatusLabel(s) {
  return { solved: 'Solved', in_progress: 'In progress', blocked: 'Blocked', open: 'Barely started' }[s] || 'Unknown';
}
const BLOCK = { knowledge: 'we do not know how yet', materials: 'missing materials', instruments: 'missing instruments or tools', funding: 'missing funding', attention: 'few people are working on it', none: '' };

async function goalView(slug, tab, focusKey) {
  clearTimeout(pollTimer);
  view.innerHTML = `<div class="note"><span class="spin" style="display:inline-block"></span></div>`;
  let g;
  try { g = (await rest(`goals?slug=eq.${encodeURIComponent(slug)}&select=${GOAL_COLS}`))[0]; } catch (e) { view.innerHTML = failNote(e, 'route()'); return; }
  if (!g) { view.innerHTML = note('No goal here', 'This goal does not exist yet. Search for it to map it.'); return; }

  const head = `<div class="goal-h">${avatar(g, true)}<div style="min-width:0;flex:1">
      <h1>${esc(g.name)}</h1><div class="handle">@${esc(g.handle)}</div>
      ${g.summary ? `<p class="sum">${esc(g.summary)}</p>` : ''}
      <div class="act">${followBtn(g.slug)}<button class="btn" data-share="/g/${esc(g.slug)}" data-title="${esc(g.name)} on Parallax">Share</button></div>
    </div></div>`;

  if (g.status !== 'ready') {
    if (g.status === 'failed') {
      view.innerHTML = head + note('Mapping hit a problem', `Parallax could not finish mapping this goal. The error was: ${esc(g.error || 'unknown')}`);
      return;
    }
    const at = STAGES.findIndex((s) => s[0] === g.stage);
    view.innerHTML = head + `<div class="note"><h2>Parallax is mapping this goal</h2><div>This takes a few minutes. You can leave and come back.</div>
      <ol class="steps">${STAGES.map((s, i) => `<li class="${i < at ? 'done' : i === at ? 'now' : ''}">${i < at ? '<svg class="tick" viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2"/></svg>' : i === at ? '<span class="spin"></span>' : '<span class="idle"></span>'}${esc(s[1])}</li>`).join('')}</ol></div>`;
    pollTimer = setTimeout(() => { if (location.hash.startsWith(`#/g/${slug}`)) goalView(slug, tab, focusKey); }, 4000);
    return;
  }

  let nodes, posts;
  try {
    [nodes, posts] = await Promise.all([
      rest(`nodes?goal_id=eq.${g.id}&select=key,parent_key,position,title,why,status,blocker_kind,blocker,evidence,independent_sources&order=position.asc`),
      rest(`posts?goal_id=eq.${g.id}&select=${POST_COLS}&order=created_at.desc&limit=50`),
    ]);
  } catch (e) { view.innerHTML = head + failNote(e, 'route()'); return; }

  const leaves = nodes.filter((n) => n.parent_key);
  const branches = nodes.filter((n) => !n.parent_key);
  const solved = leaves.filter((l) => l.status === 'solved').length;
  const going = leaves.filter((l) => l.status === 'in_progress').length;
  const lower = (t) => t ? t.charAt(0).toLowerCase() + t.slice(1).replace(/\.$/, '') : '';
  const pct = Math.round((g.progress || 0) * 100);
  const bn = leaves.find((l) => l.key === g.bottleneck_key);

  const stats = `<div class="stats">
    <div class="stat"><div class="l">Progress</div><div class="v">${pct}%</div><div class="bar"><i style="width:${pct}%"></i></div><div class="s" style="margin-top:6px">${solved} of ${leaves.length} problems solved, ${going} in progress (counted as half)</div></div>
    <div class="stat"><div class="l">Countdown</div><div class="v">${esc(horizonText(g))}</div><div class="s">at the current pace. An estimate${g.horizon_note ? `: ${esc(lower(g.horizon_note))}` : ''}.</div></div>
  </div>
  ${bn ? `<div class="bneck"><div class="l">Biggest bottleneck</div><h3>${esc(bn.title)}</h3><p>${esc(bn.blocker)}</p><p style="margin-top:6px"><a href="#/g/${encodeURIComponent(g.slug)}/tree/${encodeURIComponent(bn.key)}">See it in the tree</a></p></div>` : ''}`;

  const tabs = `<nav class="tabs" role="tablist" style="margin-top:8px">
      <a class="tab" role="tab" href="#/g/${encodeURIComponent(g.slug)}" aria-selected="${tab !== 'tree'}">Posts</a>
      <a class="tab" role="tab" href="#/g/${encodeURIComponent(g.slug)}/tree" aria-selected="${tab === 'tree'}">The tree</a></nav>`;

  let body;
  if (tab === 'tree') {
    body = `<div class="legend"><span><i class="dot st-solved"></i>Solved</span><span><i class="dot st-in_progress"></i>In progress</span><span><i class="dot st-blocked"></i>Blocked</span><span><i class="dot st-open"></i>Barely started</span></div>` +
      branches.map((b) => {
        const kids = leaves.filter((l) => l.parent_key === b.key);
        const count = (s) => kids.filter((k) => k.status === s).length;
        const seg = ['solved', 'in_progress', 'blocked', 'open'].map((s) => count(s) ? `<i class="st-${s}" style="width:${(100 * count(s)) / kids.length}%"></i>` : '').join('');
        return `<section class="branch"><div class="branch-h"><h3>${esc(b.title)}</h3>${b.why ? `<p>${esc(b.why)}</p>` : ''}<div class="mini" aria-hidden="true">${seg}</div></div>
          ${kids.map((l) => {
            const ev = (l.evidence || []).slice(0, 6).map((e) => { const u = safeUrl(e.url); return `<li>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(e.title)}</a>` : esc(e.title)}${e.year ? ` <span>(${esc(e.year)})</span>` : ''}</li>`; }).join('');
            const why = BLOCK[l.blocker_kind] ? ` · ${BLOCK[l.blocker_kind]}` : '';
            return `<details class="leaf${l.key === focusKey ? ' target' : ''}" id="leaf-${esc(l.key)}"${l.key === focusKey ? ' open' : ''}>
              <summary><i class="dot st-${esc(l.status || 'open')}" title="${esc(leafStatusLabel(l.status))}"></i><span class="leaf-t"><b>${esc(l.title)}</b><span>${esc(leafStatusLabel(l.status))}${esc(why)}${l.key === g.bottleneck_key ? ' · biggest bottleneck' : ''}</span></span></summary>
              <div class="leaf-body">${l.why ? `<p><b>Why it matters:</b> ${esc(l.why)}</p>` : ''}${l.blocker ? `<p><b>${l.status === 'solved' ? 'What was done' : 'What stands in the way'}:</b> ${esc(l.blocker)}</p>` : ''}
                ${ev ? `<ul class="srcs">${ev}</ul>` : '<p style="color:var(--muted)">No papers found for this yet.</p>'}
                <p style="color:var(--muted);font-size:12.5px">${l.independent_sources >= 2 ? `✓ ${l.independent_sources} independent sources` : 'Fewer than two independent sources so far'}</p></div></details>`;
          }).join('')}</section>`;
      }).join('');
  } else {
    body = posts.length ? posts.map((p) => postCard(p, g)).join('') : note('No posts yet', 'New research on this goal will appear here.');
  }

  view.innerHTML = head + stats + tabs + body;
  if (focusKey) $(`#leaf-${CSS.escape(focusKey)}`)?.scrollIntoView({ block: 'center' });
}

function searchView(q) {
  view.innerHTML = `<div id="sres"></div>`;
  const box = $('#sres');
  goals().then((list) => {
    const hits = match(list, q);
    box.innerHTML = `<h1 style="font-size:20px;margin:22px 0 10px">Goals matching “${esc(q)}”</h1>` +
      (hits.length ? `<div class="grid" style="margin-top:0">${hits.map((g) => `<a class="gcard" href="#/g/${encodeURIComponent(g.slug)}"><span class="t"><b>@${esc(g.handle)}</b><small>${esc(g.name)}</small></span></a>`).join('')}</div>` : '<p style="color:var(--muted)">No goal on Parallax matches that yet.</p>') +
      `<div class="post" style="text-align:center;margin-top:20px"><h3 style="margin-top:4px">Not what you meant?</h3><p>Parallax can map “${esc(q)}” as a new goal: what stands between us and it, what is blocking it, and what moves it forward.</p><button class="btn primary" id="mapIt">Map this goal</button><p id="mapMsg" style="margin-top:10px"></p></div>`;
    $('#mapIt').onclick = () => mapGoal(q);
  }).catch((e) => { box.innerHTML = failNote(e, 'route()'); });
}

async function mapGoal(q) {
  const btn = $('#mapIt'), msg = $('#mapMsg');
  btn.disabled = true;
  msg.innerHTML = '<span class="spin" style="display:inline-block;vertical-align:-2px"></span> Understanding the goal. This can take up to a minute…';
  try {
    const r = await fetch(`${SUPA_URL}/functions/v1/map-goal`, {
      method: 'POST',
      headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q }),
    });
    let data = {};
    try { data = await r.json(); } catch {}
    if (data.slug) {
      goalsCache = null;
      location.hash = `#/g/${encodeURIComponent(data.slug)}`;
      if (data.duplicate) toast('Parallax already follows this goal');
      return;
    }
    btn.disabled = false;
    msg.textContent = data.rejected ? `Parallax can't map this one: ${data.rejected}` : (data.error || `Mapping could not start (error ${r.status}).`);
  } catch (e) {
    btn.disabled = false;
    msg.textContent = `Mapping could not start: ${e.message}`;
  }
}

// ------------------------------------------------------------ search box
const STOP = new Set(['a', 'an', 'the', 'of', 'for', 'to', 'in', 'on', 'and', 'or', 'with', 'how', 'cure', 'end', 'humans', 'human', 'people', 'make', 'making', 'better', 'new']);
function match(list, q) {
  const words = q.toLowerCase().split(/[^a-z0-9']+/).filter((w) => w.length > 1 && !STOP.has(w));
  if (!words.length) return [];
  return list.map((g) => {
    const hay = `${g.handle} ${g.name} ${g.summary || ''}`.toLowerCase();
    const score = words.reduce((a, w) => a + (hay.includes(w) ? (g.handle.toLowerCase().includes(w) || g.name.toLowerCase().includes(w) ? 2 : 1) : 0), 0);
    return { g, score };
  }).filter((x) => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 8).map((x) => x.g);
}

const qInput = $('#q'), sug = $('#suggest');
let sugIndex = -1;
qInput.addEventListener('input', async () => {
  const q = qInput.value.trim();
  sugIndex = -1;
  if (q.length < 2) { sug.classList.add('hide'); return; }
  let list = [];
  try { list = await goals(); } catch {}
  const hits = match(list, q).slice(0, 5);
  sug.innerHTML = hits.map((g) => `<a role="option" href="#/g/${encodeURIComponent(g.slug)}">${avatar(g).replace('<a ', '<span ').replace('</a>', '</span>').replace(/ href="[^"]*"/, '')}<span class="t"><b>@${esc(g.handle)}</b> <small style="color:var(--muted)">${esc(g.name)}</small></span></a>`).join('') +
    `<button type="submit" role="option"><span>Search or map “<b>${esc(q)}</b>”</span></button>`;
  sug.classList.remove('hide');
});
qInput.addEventListener('keydown', (e) => {
  const items = [...sug.querySelectorAll('[role=option]')];
  if (sug.classList.contains('hide') || !items.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    sugIndex = (sugIndex + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items.forEach((el, i) => el.classList.toggle('on', i === sugIndex));
  } else if (e.key === 'Enter' && sugIndex >= 0 && items[sugIndex].tagName === 'A') {
    e.preventDefault();
    items[sugIndex].click();
  } else if (e.key === 'Escape') sug.classList.add('hide');
});
$('#searchForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const q = qInput.value.trim();
  if (q.length < 3) return;
  sug.classList.add('hide');
  location.hash = `#/search/${encodeURIComponent(q)}`;
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search')) sug.classList.add('hide');
  if (e.target.closest('.suggest a')) { sug.classList.add('hide'); qInput.value = ''; }
  const f = e.target.closest('[data-follow]');
  if (f) {
    const slug = f.dataset.follow;
    const on = follows.toggle(slug);
    document.querySelectorAll(`[data-follow="${CSS.escape(slug)}"]`).forEach((b) => {
      b.textContent = on ? 'Following' : 'Follow';
      b.className = `btn ${on ? 'following' : 'primary'}`;
    });
    toast(on ? 'Following. Its posts now fill your Following tab.' : 'Unfollowed');
  }
  const s = e.target.closest('[data-share]');
  if (s) share(s.dataset.share, s.dataset.title);
});

// ------------------------------------------------------------ router
function route() {
  clearTimeout(pollTimer);
  const parts = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  window.scrollTo(0, 0);
  if (parts[0] === 'following') return feedView('following');
  if (parts[0] === 'explore') return exploreView();
  if (parts[0] === 'search' && parts[1]) return searchView(parts.slice(1).join('/'));
  if (parts[0] === 'g' && parts[1]) return goalView(parts[1], parts[2] === 'tree' ? 'tree' : 'posts', parts[2] === 'tree' ? parts[3] : undefined);
  return feedView('all');
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
