<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Parallax</title>
<meta name="description" content="Follow humanity's goals. See what is really blocking them, and what moved today.">
<meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parallax">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   Parallax — clean and premium. One accent, precise hairlines,
   Geist for words, Geist Mono for numbers.
   ============================================================ */
:root{
  --bg:#FAFAF9; --card:#FFFFFF; --sunk:#F2F2F0; --ink:#111214; --ink2:#3C3F45; --muted:#73767E; --faint:#A3A6AD;
  --line:#ECECE9; --line2:#DCDCD7;
  --accent:#3D4BF2; --accent-ink:#FFFFFF; --accent-soft:rgba(61,75,242,.08); --accent-line:rgba(61,75,242,.30);
  --solved:#14955F; --progress:#D08A12; --blocked:#E0484E; --open:#C2C5CB;
  --shadow:0 1px 1px rgba(16,17,20,.03),0 8px 24px -14px rgba(16,17,20,.12);
  --shadow-lg:0 24px 60px -20px rgba(16,17,20,.28);
  --f:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --m:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:18px; --navh:0px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B0B0D; --card:#141417; --sunk:#1C1C20; --ink:#F3F3F4; --ink2:#C8CAD0; --muted:#8C8F98; --faint:#5E616A;
    --line:#222226; --line2:#303137;
    --accent:#8B95FF; --accent-ink:#0B0B0D; --accent-soft:rgba(139,149,255,.12); --accent-line:rgba(139,149,255,.36);
    --solved:#3DD68C; --progress:#F5B83D; --blocked:#FF6369; --open:#4A4D55;
    --shadow:0 0 0 1px rgba(255,255,255,.015);
    --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.55 var(--f);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3{font-weight:600;letter-spacing:-.018em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
::selection{background:var(--accent-soft)}
.mono{font-family:var(--m);font-feature-settings:"tnum"}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;padding:11px 20px;display:flex;gap:14px;align-items:center}
.brand{font-weight:600;letter-spacing:-.025em;text-decoration:none;font-size:17.5px;white-space:nowrap;display:flex;align-items:center;gap:9px}
.brand-mark{width:26px;height:26px;flex:none}
.search{flex:1;position:relative}
.search input{width:100%;height:38px;border-radius:12px;border:1px solid transparent;background:var(--sunk);color:var(--ink);padding:0 14px 0 38px;font:inherit;font-size:14.5px;outline:none;transition:background .15s,border-color .15s,box-shadow .15s}
.search input::placeholder{color:var(--muted)}
.search input:focus{background:var(--card);border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{position:absolute;left:13px;top:11px;width:16px;height:16px;color:var(--muted)}
.suggest{position:absolute;top:46px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-lg)}
.suggest a,.suggest button{display:flex;width:100%;gap:10px;align-items:center;padding:10px 14px;text-decoration:none;border:0;background:none;text-align:left;cursor:pointer;font-size:14.5px}
.suggest a:hover,.suggest button:hover,.suggest .on{background:var(--sunk)}
.navlink{text-decoration:none;color:var(--muted);font-weight:500;font-size:14.5px;white-space:nowrap;transition:color .15s}
.navlink:hover{color:var(--ink)}

main{max-width:680px;margin:0 auto;padding:0 20px 96px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 -20px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;flex:none;appearance:none;border:0;background:none;padding:15px 12px 13px;font-weight:500;font-size:14.5px;color:var(--muted);cursor:pointer;border-bottom:1.5px solid transparent;margin-bottom:-1px;text-decoration:none;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
.page-h{margin:30px 0 4px;font-size:28px;line-height:1.15;letter-spacing:-.03em}
.page-sub{color:var(--muted);margin:0}

/* ---------- avatars: an orb per goal ---------- */
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12.5px;letter-spacing:.01em;text-decoration:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),inset 0 -10px 18px rgba(0,0,0,.14);text-shadow:0 1px 1px rgba(0,0,0,.18)}
.av.lg{width:56px;height:56px;font-size:18px}

/* ---------- posts ---------- */
.post{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:14px 0;box-shadow:var(--shadow)}
.post-h{display:flex;gap:11px;align-items:center;min-width:0}
.who{min-width:0;line-height:1.3}
.who a{text-decoration:none}
.who .h{font-weight:600;font-size:15px}
.who .n{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.when{margin-left:auto;color:var(--faint);font-size:12.5px;white-space:nowrap;align-self:flex-start;font-family:var(--m)}
.kind{--k:var(--faint);display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--muted);margin:15px 0 5px;letter-spacing:.005em}
.kind::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--k);flex:none}
.kind.bottleneck{--k:var(--blocked)} .kind.advance,.kind.solved{--k:var(--solved)} .kind.setback{--k:var(--progress)}
.kind.forgotten{--k:var(--accent)} .kind.mapped{--k:var(--ink)} .kind.promise{--k:var(--ink2)}
.post h3{font-size:18.5px;line-height:1.32;margin:0 0 8px;letter-spacing:-.016em}
.post p{margin:0 0 10px;color:var(--ink2);font-size:15px}
.quote{margin:10px 0 12px;padding:12px 14px;border-left:2px solid var(--ink);background:var(--sunk);border-radius:0 12px 12px 0;font-size:14.5px;color:var(--ink2);line-height:1.5}
.quote cite{display:block;margin-top:8px;font-style:normal;font-size:12.5px;color:var(--muted)}
.quote cite a{color:inherit}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;margin-left:8px;letter-spacing:.01em}
.pill.kept{background:color-mix(in srgb,var(--solved) 13%,transparent);color:var(--solved)}
.pill.partly{background:color-mix(in srgb,var(--progress) 15%,transparent);color:var(--progress)}
.pill.broken{background:color-mix(in srgb,var(--blocked) 12%,transparent);color:var(--blocked)}
.pill.pending,.pill.unclear{background:var(--sunk);color:var(--muted)}
.prom-h{font-size:12.5px;font-weight:500;color:var(--muted);margin:30px 0 6px;letter-spacing:.01em}
.srcs{margin:12px 0 0;padding:12px 0 0;list-style:none;border-top:1px solid var(--line)}
.srcs li{font-size:12.5px;color:var(--faint);margin:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcs a{color:var(--muted);text-decoration:none;transition:color .15s}
.srcs a:hover{color:var(--accent)}
.post-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.check{font-size:12.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;margin-right:auto}
.check.two{color:var(--solved)}
.btn{appearance:none;border:1px solid var(--line2);background:var(--card);border-radius:999px;height:34px;padding:0 15px;font-weight:500;font-size:13.5px;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center;justify-content:center;transition:background .15s,border-color .15s,opacity .15s;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn.following{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.icon{width:34px;padding:0}
.btn.icon svg{width:16px;height:16px}
.btn:disabled{opacity:.5;cursor:default}

/* ---------- goal page ---------- */
.goal-h{padding:30px 0 6px}
.gh-top{display:flex;align-items:center;gap:14px}
.gh-top .handle{font-weight:600;font-size:15px}
.gh-top .followers{margin:0}
.goal-h h1{font-size:38px;line-height:1.06;letter-spacing:-.034em;margin:20px 0 12px;max-width:16ch}
.goal-h .sum{margin:0;color:var(--ink2);font-size:16.5px;line-height:1.55;max-width:58ch}
.goal-h .act{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap}
.followers{color:var(--muted);font-size:13.5px;margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin:26px 0 14px;overflow:hidden}
.metric{padding:18px 20px 16px;min-width:0}
.metric + .metric{border-left:1px solid var(--line)}
.metric .l{font-size:12.5px;color:var(--muted);font-weight:500}
.metric .v{font-family:var(--m);font-size:30px;font-weight:500;letter-spacing:-.03em;line-height:1.15;margin-top:6px;white-space:nowrap}
.metric .v small{font-size:15px;color:var(--muted);margin-left:3px;letter-spacing:0}
.metric .s{font-size:12.5px;color:var(--muted);margin-top:6px}
.segbar{display:flex;gap:2px;height:4px;margin-top:12px}
.segbar i{display:block;height:100%;border-radius:2px;min-width:2px}
.metrics .note2{grid-column:1/-1;border-top:1px solid var(--line);padding:11px 20px;font-size:12.5px;color:var(--muted);line-height:1.5}
.note2 summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;font-weight:500}
.note2 summary::-webkit-details-marker{display:none}
.note2 summary::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.note2[open] summary::after{transform:rotate(-135deg) translateY(-1px)}
.note2 summary:hover{color:var(--ink)}
.note2 p{margin:8px 0 2px}
.cmap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px 8px;margin:14px 0}
.cmap-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cmap-h h2{font-size:15.5px;margin:0}
.crow{display:grid;grid-template-columns:minmax(0,190px) 1fr;gap:18px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.cmap-h + .crow{margin-top:12px}
.crow .bn{font-size:13.5px;color:var(--ink2);line-height:1.35}
.crow .bn small{display:block;color:var(--faint);font-family:var(--m);font-size:11.5px;margin-top:2px}
.dots{display:flex;flex-wrap:wrap;gap:9px}
.cdot{--sc:var(--open);width:18px;height:18px;border-radius:50%;background:var(--sc);display:block;position:relative;transition:transform .15s,box-shadow .15s;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.cdot:hover,.cdot:focus-visible{transform:scale(1.22)}
.cdot.st-solved{--sc:var(--solved)} .cdot.st-in_progress{--sc:var(--progress)} .cdot.st-blocked{--sc:var(--blocked)} .cdot.st-open{--sc:var(--open)}
.cdot.bneck-dot{box-shadow:0 0 0 3px var(--card),0 0 0 4.5px var(--blocked)}
.cdot.bneck-dot::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1.5px solid var(--blocked);opacity:0;animation:ping 2.4s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes ping{0%{transform:scale(.7);opacity:.55}100%{transform:scale(1.5);opacity:0}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:7px;align-items:center}
.legend .dot{margin:0;width:8px;height:8px}
.bneck{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;margin:14px 0;position:relative;overflow:hidden}
.bneck::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blocked)}
.bneck .l{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--blocked)}
.bneck .l::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blocked)}
.bneck h3{margin:8px 0 6px;font-size:18px;line-height:1.3}
.bneck p{margin:0;color:var(--ink2);font-size:14.5px}
.arrow-link{display:inline-flex;gap:6px;align-items:center;margin-top:12px;color:var(--accent);text-decoration:none;font-weight:500;font-size:14px}
.arrow-link:hover{text-decoration:underline}
.branch{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:14px 0;overflow:hidden;box-shadow:var(--shadow)}
.branch-h{padding:16px 18px;border-bottom:1px solid var(--line)}
.branch-h h3{margin:0;font-size:16px}
.branch-h p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.mini{display:flex;gap:2px;height:4px;margin-top:12px}
.mini i{display:block;height:100%;border-radius:2px}
details.leaf{border-top:1px solid var(--line)}
details.leaf:first-of-type{border-top:0}
details.leaf summary{list-style:none;cursor:pointer;padding:13px 18px;display:flex;gap:12px;align-items:flex-start;transition:background .15s}
details.leaf summary:hover{background:var(--sunk)}
details.leaf summary::-webkit-details-marker{display:none}
details.leaf[open] summary,details.leaf.target summary{background:var(--accent-soft)}
.dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:7px}
.st-solved{background:var(--solved)} .st-in_progress{background:var(--progress)} .st-blocked{background:var(--blocked)} .st-open{background:var(--open)}
.leaf-t{flex:1;min-width:0}
.leaf-t b{font-weight:500}
.leaf-t span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.leaf-body{padding:2px 18px 16px 39px;font-size:14.5px;color:var(--ink2)}
.leaf-body p{margin:8px 0}

/* ---------- lists, notes, misc ---------- */
.note{color:var(--muted);text-align:center;padding:48px 12px}
.note h2{color:var(--ink);font-size:19px;margin:0 0 8px}
.more{display:flex;margin:18px auto}
.grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:20px}
@media (min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;text-decoration:none;display:flex;gap:13px;align-items:flex-start;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.gcard:hover{border-color:var(--line2);transform:translateY(-1px)}
.gcard .t{min-width:0;flex:1}
.gcard b{display:block;font-weight:600}
.gcard small{color:var(--muted);display:block;font-size:13px}
.gcard .gp{display:flex;align-items:center;gap:10px;margin-top:10px}
.gcard .gp .segbar{flex:1;margin:0}
.gcard .gp span{font-family:var(--m);font-size:12px;color:var(--muted)}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--solved);border-radius:2px}
.steps{list-style:none;padding:0;margin:22px auto;max-width:360px;text-align:left}
.steps li{display:flex;gap:11px;align-items:center;padding:7px 0;color:var(--muted)}
.steps li.done{color:var(--ink)}
.steps li.now{color:var(--ink);font-weight:500}
.spin{width:15px;height:15px;border:1.5px solid var(--line2);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;flex:none}
.tick{width:15px;height:15px;flex:none;color:var(--solved)}
.idle{width:15px;height:15px;border:1.5px solid var(--line2);border-radius:50%;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin,.cdot.bneck-dot::after{animation:none}*{transition:none!important}}
.acct{width:34px;height:34px;border-radius:50%;padding:0;font-weight:600;font-size:12.5px;flex:none}
.acct.out{width:auto;padding:0 15px}
.menu{position:absolute;right:20px;top:58px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);min-width:210px;overflow:hidden;z-index:20;padding:4px}
.menu a,.menu button{display:block;width:100%;text-align:left;padding:9px 12px;text-decoration:none;border:0;background:none;cursor:pointer;font-size:14.5px;border-radius:10px}
.menu a:hover,.menu button:hover{background:var(--sunk)}
.menu .who2{padding:9px 12px 10px;margin-bottom:4px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.modal-back{position:fixed;inset:0;background:rgba(10,10,12,.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:30;animation:fade .15s ease-out}
.modal{background:var(--card);border:1px solid var(--line);border-radius:22px;max-width:400px;width:100%;padding:26px 24px 20px;box-shadow:var(--shadow-lg);animation:rise .2s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}} @keyframes rise{from{opacity:0;transform:translateY(8px) scale(.98)}}
.modal h2{margin:0 0 8px;font-size:21px;letter-spacing:-.025em}
.modal p{margin:0 0 16px;color:var(--ink2)}
.modal .wide{width:100%;height:42px;font-size:15px;margin-top:8px}
.modal .fine{font-size:12.5px;color:var(--muted);margin:14px 0 0}
.field{display:block;margin:16px 0}
.field > span{display:block;font-weight:500;font-size:14px;margin-bottom:6px}
.field small{display:block;color:var(--muted);font-size:12.5px;margin-top:5px}
.field input,.field textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:10px 13px;outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field textarea:focus{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}
.field textarea{min-height:88px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{background:var(--sunk);color:var(--ink2);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:500;text-decoration:none}
.err{color:var(--blocked);font-size:13.5px;margin-top:8px}
.danger{color:var(--blocked)!important;border-color:color-mix(in srgb,var(--blocked) 40%,transparent)!important}
.toast{position:fixed;left:50%;bottom:calc(28px + var(--navh));transform:translate(-50%,6px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px);text-align:center;z-index:40}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{max-width:680px;margin:0 auto;padding:8px 20px calc(44px + var(--navh));color:var(--faint);font-size:12.5px;text-align:center;line-height:1.6}
.foot a{color:var(--muted)}
.hide{display:none!important}

/* ---------- phone: app-like bottom bar ---------- */
.bnav{display:none}
@media (max-width:760px){
  :root{--navh:calc(62px + env(safe-area-inset-bottom))}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:15;height:var(--navh);padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line)}
  .bnav a,.bnav button{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--faint);font-size:10.5px;font-weight:500;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
  .bnav svg{width:23px;height:23px}
  .bnav .on{color:var(--ink)}
  .feedtabs{display:none}
  .acct.out{display:none}
  main{padding-bottom:calc(40px + var(--navh))}
  .navlink.x{display:none}
}
@media (max-width:520px){
  .top-in{padding:10px 16px;gap:10px}
  main{padding-left:16px;padding-right:16px}
  .tabs{margin:0 -16px;padding:0 16px}
  .brand-word{display:none}
  .post{padding:16px 16px;border-radius:16px}
  .check{flex-basis:100%}
  .tab{padding:14px 10px 12px}
  .goal-h h1{font-size:30px}
  .metric{padding:14px 14px 12px}
  .metric .v{font-size:21px}
  .metric .v small{font-size:12px}
  .metrics .note2{padding:11px 14px}
  .crow{grid-template-columns:1fr;gap:9px}
  .cmap,.bneck{padding:16px}
  .page-h{font-size:24px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/" aria-label="Parallax home">
      <svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true"><line x1="5" y1="20.5" x2="21" y2="20.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="0.1 3.2" opacity=".55"/><line x1="5" y1="20.5" x2="13" y2="5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".5"/><line x1="21" y1="20.5" x2="13" y2="5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".5"/><circle cx="5" cy="20.5" r="2.6" fill="currentColor"/><circle cx="21" cy="20.5" r="2.6" fill="currentColor"/><circle cx="13" cy="5.5" r="3.4" fill="var(--accent)"/></svg>
      <span class="brand-word">Parallax</span>
    </a>
    <form class="search" id="searchForm" role="search" autocomplete="off">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search any goal: Mars, fusion, Alzheimer's…" aria-label="Search any goal" maxlength="160">
      <div class="suggest hide" id="suggest" role="listbox"></div>
    </form>
    <a class="navlink x" href="#/explore">Explore</a>
    <button class="btn acct out" id="acct" type="button">Sign in</button>
  </div>
  <div class="menu hide" id="menu" role="menu"></div>
</header>

<main id="view" aria-live="polite"></main>
<footer class="foot">
  Parallax maps goals from published research with AI. Every post links the papers it rests on, and a problem is only marked solved when two independent sources agree.
  <br><a href="instruments.html">The original Parallax instruments</a>
</footer>
<div class="toast" id="toast" role="status"></div>
<nav class="bnav" id="bnav" aria-label="Main">
  <a href="#/" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>Feed</a>
  <a href="#/following" data-nav="following"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L4.8 9.8l5-.7z"/></svg>Following</a>
  <a href="#/branch" data-nav="branch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2"/><circle cx="6" cy="6" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 8v8M18 10c0 4-6 3-11.4 6.6"/></svg>Branch</a>
  <a href="#/explore" data-nav="explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Explore</a>
  <button type="button" data-nav="me" id="navMe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c1.3-3.3 4-5 7-5s5.7 1.7 7 5"/></svg><span id="navMeLabel">Sign in</span></button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
'use strict';
// ------------------------------------------------------------ config
const SUPA_URL = 'https://zfmjjazkmolvywvayjzj.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmbWpqYXprbW9sdnl3dmF5anpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMzQ2NjEsImV4cCI6MjEwMTYxMDY2MX0.NA72AfuZ7axlxGBfKJwR4aNKyufjUz--fm3CG1_dCY8';
const GOAL_COLS = 'id,slug,handle,name,summary,status,stage,progress,horizon_low,horizon_high,horizon_note,bottleneck_key,error,created_at,mapped_at,pulsed_at';
const POST_COLS = 'id,goal_id,node_key,kind,headline,body,sources,independent_sources,expert_reviewed,reviewer,created_at,meta';
const PROMISE_COLS = 'id,node_key,claim,quote,made_year,due_year,source,status,verdict,verdict_sources,independent_sources,checked_at';
const PAGE = 30;

// ------------------------------------------------------------ helpers
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = (u) => /^https?:\/\//i.test(String(u || '')) ? String(u) : null;
const view = $('#view');

async function rest(path) {
  const r = await fetch(`${SUPA_URL}/rest/v1/${path}`, { headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` } });
  if (!r.ok) throw new Error(`Parallax's data answered ${r.status}`);
  return r.json();
}

function ago(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return 'now';
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  if (s < 86400) return `${Math.floor(s / 3600)}h`;
  if (s < 86400 * 7) return `${Math.floor(s / 86400)}d`;
  return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: s > 86400 * 300 ? 'numeric' : undefined });
}

function hue(str) {
  let h = 0;
  for (const c of String(str)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return h % 360;
}
// Each goal gets an orb: a soft gradient sphere in its own hue.
function orb(seed, sat = 78) {
  const h = hue(seed), h2 = (h + 34) % 360;
  return `background:radial-gradient(120% 120% at 28% 18%,hsl(${h} ${sat}% 74%) 0%,hsl(${h} ${sat - 6}% 54%) 42%,hsl(${h2} ${sat - 12}% 34%) 100%)`;
}
function avatar(g, big = false) {
  const initials = String(g.handle || '?').replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || '?';
  return `<a class="av${big ? ' lg' : ''}" href="#/g/${encodeURIComponent(g.slug)}" style="${orb(g.slug)}" aria-label="@${esc(g.handle)}">${esc(initials)}</a>`;
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2200);
}

// ------------------------------------------------------------ accounts
// Sign-in is Supabase Auth. Google is live; the email code turns on once an email
// service is connected in Supabase (Authentication -> Emails -> SMTP).
const EMAIL_CODE_SIGNIN = false;
const sb = window.supabase
  ? window.supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { flowType: 'pkce', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } })
  : null;
let me = null; // { id, profile } while signed in
let resolveAuth;
const authReady = new Promise((r) => { resolveAuth = r; });
if (!sb) resolveAuth();

// Follows are kept on the device for speed, and in the account when signed in.
const localFollows = {
  get() { try { return JSON.parse(localStorage.getItem('px.follow') || '[]'); } catch { return []; } },
  set(list) { try { localStorage.setItem('px.follow', JSON.stringify(list)); } catch {} },
};
const follows = {
  has(slug) { return localFollows.get().includes(slug); },
  async toggle(slug) {
    const before = localFollows.get();
    const on = !before.includes(slug);
    localFollows.set(on ? [...before, slug] : before.filter((x) => x !== slug));
    if (me && sb) {
      const g = (await goals()).find((x) => x.slug === slug);
      if (g) {
        const { error } = on
          ? await sb.from('follows').upsert({ user_id: me.id, goal_id: g.id }, { onConflict: 'user_id,goal_id', ignoreDuplicates: true })
          : await sb.from('follows').delete().eq('user_id', me.id).eq('goal_id', g.id);
        if (error) { localFollows.set(before); throw new Error('Could not save that follow. Try again.'); }
      }
    }
    return on;
  },
};

async function syncFollows() {
  const list = await goals();
  const { data: rows, error } = await sb.from('follows').select('goal_id').eq('user_id', me.id);
  if (error) return;
  const mine = new Set(rows.map((r) => r.goal_id));
  const local = localFollows.get();
  const missing = list.filter((g) => local.includes(g.slug) && !mine.has(g.id));
  if (missing.length) {
    await sb.from('follows').upsert(missing.map((g) => ({ user_id: me.id, goal_id: g.id })), { onConflict: 'user_id,goal_id', ignoreDuplicates: true });
  }
  localFollows.set([...new Set([...local, ...list.filter((g) => mine.has(g.id)).map((g) => g.slug)])]);
}

const PROFILE_COLS = 'id,handle,display_name,bio,skills,created_at';
async function setSession(session) {
  if (!session) { me = null; renderAcct(); return; }
  const { data: profile } = await sb.from('profiles').select(PROFILE_COLS).eq('id', session.user.id).maybeSingle();
  me = { id: session.user.id, profile };
  renderAcct();
  await syncFollows().catch(() => {});
}

function personAvatar(p, big = false) {
  const name = (p && (p.display_name || p.handle)) || '?';
  const initials = name.trim().split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
  return `<span class="av${big ? ' lg' : ''}" style="${orb(p ? p.handle : '', 40)}" aria-hidden="true">${esc(initials)}</span>`;
}

function renderAcct() {
  const b = $('#acct');
  if (!sb) { b.classList.add('hide'); return; }
  if (me) {
    const name = me.profile ? (me.profile.display_name || me.profile.handle) : 'You';
    b.className = 'btn acct';
    b.setAttribute('style', orb(me.profile ? me.profile.handle : '', 40));
    b.style.color = '#fff';
    b.style.borderColor = 'transparent';
    $('#navMeLabel').textContent = 'You';
    b.textContent = name.trim().split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase() || '?';
    b.setAttribute('aria-label', 'Your account');
  } else {
    b.className = 'btn acct out';
    b.removeAttribute('style');
    b.textContent = 'Sign in';
    $('#navMeLabel').textContent = 'Sign in';
    b.removeAttribute('aria-label');
  }
}

function toggleMenu(force) {
  const m = $('#menu');
  const open = force ?? m.classList.contains('hide');
  if (!open || !me) { m.classList.add('hide'); return; }
  const h = me.profile ? me.profile.handle : '';
  m.innerHTML = `<div class="who2">Signed in as <b>@${esc(h)}</b></div>
    ${h ? `<a href="#/u/${encodeURIComponent(h)}" role="menuitem">Your profile</a>` : ''}
    <a href="#/branch" role="menuitem">Your branch</a>
    <a href="#/following" role="menuitem">Goals you follow</a>
    <a href="#/settings" role="menuitem">Settings</a>
    <button type="button" id="signOut" role="menuitem">Sign out</button>`;
  m.classList.remove('hide');
  $('#signOut').onclick = async () => { toggleMenu(false); await sb.auth.signOut(); };
}

let providerCache = null;
async function providers() {
  if (!providerCache) {
    try {
      const r = await fetch(`${SUPA_URL}/auth/v1/settings`, { headers: { apikey: SUPA_KEY } });
      providerCache = r.ok ? ((await r.json()).external || {}) : {};
    } catch { providerCache = {}; }
  }
  return providerCache;
}

function closeModal() { $('.modal-back')?.remove(); }
async function openSignIn(reason) {
  if (!sb) { toast('Sign-in could not load. Check your connection and reload.'); return; }
  closeModal();
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="siT">
    <h2 id="siT">Sign in to Parallax</h2>
    <p>${esc(reason || 'Keep the goals you follow on every device, and build your profile.')}</p>
    <div id="siBody"><div class="note" style="padding:12px"><span class="spin" style="display:inline-block"></span></div></div>
    <p class="fine">Parallax only uses your name and email to run your account. You can delete it any time in Settings.</p>
    <button class="btn wide" type="button" id="siClose" style="margin-top:12px">Not now</button></div>`;
  document.body.appendChild(back);
  back.addEventListener('click', (e) => { if (e.target === back) closeModal(); });
  $('#siClose').onclick = closeModal;
  const ext = await providers();
  const body = $('#siBody');
  if (!body) return;
  let html = ext.google
    ? `<button class="btn primary wide" type="button" id="siGoogle">Continue with Google</button>`
    : `<p class="fine" style="margin-top:0">Google sign-in is being switched on. Check back soon.</p>`;
  if (EMAIL_CODE_SIGNIN && ext.email) {
    html += `<label class="field"><span>Or get a code by email</span><input id="siEmail" type="email" autocomplete="email" placeholder="you@example.com"></label>
      <button class="btn wide" type="button" id="siSend">Email me a code</button>
      <div id="siCode" class="hide"><label class="field"><span>Enter the code from your email</span><input id="siTok" inputmode="numeric" autocomplete="one-time-code"></label>
      <button class="btn primary wide" type="button" id="siVerify">Sign in</button></div><div class="err" id="siErr"></div>`;
  }
  body.innerHTML = html;
  const g = $('#siGoogle');
  if (g) g.onclick = async () => {
    g.disabled = true;
    try { sessionStorage.setItem('px.return', location.hash || '#/'); } catch {}
    const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
    if (error) { g.disabled = false; toast(error.message); }
  };
  const send = $('#siSend');
  if (send) {
    send.onclick = async () => {
      const email = $('#siEmail').value.trim();
      send.disabled = true;
      const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
      send.disabled = false;
      if (error) { $('#siErr').textContent = error.message; return; }
      $('#siCode').classList.remove('hide');
      $('#siErr').textContent = '';
    };
    $('#siVerify').onclick = async () => {
      const { error } = await sb.auth.verifyOtp({ email: $('#siEmail').value.trim(), token: $('#siTok').value.trim(), type: 'email' });
      if (error) { $('#siErr').textContent = error.message; return; }
      closeModal();
    };
  }
}

async function afterSignIn() {
  closeModal();
  let back = '#/';
  try { back = sessionStorage.getItem('px.return') || location.hash || '#/'; sessionStorage.removeItem('px.return'); } catch {}
  if (location.search) history.replaceState(null, '', location.pathname + back);
  const p = me && me.profile;
  const isNew = p && Date.now() - new Date(p.created_at).getTime() < 10 * 60_000 && !p.bio && !(p.skills || []).length;
  if (isNew) { location.hash = '#/settings/welcome'; return; }
  if (location.hash !== back) location.hash = back; else route();
  if (p) toast(`Signed in as @${p.handle}`);
}

if (sb) {
  // A sign-in that failed comes back with an error in the address.
  const qs = new URLSearchParams(location.search);
  if (qs.get('error_description')) {
    setTimeout(() => toast(`Sign-in failed: ${qs.get('error_description')}`), 300);
    history.replaceState(null, '', location.pathname + location.hash);
  }
  let first = true;
  sb.auth.onAuthStateChange((event, session) => {
    // Run outside the callback: Supabase calls inside it can deadlock.
    setTimeout(async () => {
      const prev = me ? me.id : null;
      await setSession(session);
      if (first) { first = false; resolveAuth(); }
      if (event === 'SIGNED_IN' && session && prev !== session.user.id) afterSignIn();
      if (event === 'SIGNED_OUT') { localFollows.set([]); toast('Signed out'); route(); }
    }, 0);
  });
}
function followBtn(slug) {
  const on = follows.has(slug);
  return `<button class="btn ${on ? 'following' : 'primary'}" data-follow="${esc(slug)}">${on ? 'Following' : 'Follow'}</button>`;
}

async function share(path, title) {
  const url = `${location.origin}${location.pathname}#${path}`;
  try {
    if (navigator.share) { await navigator.share({ title, url }); return; }
    await navigator.clipboard.writeText(url);
    toast('Link copied');
  } catch { /* the person closed the share sheet */ }
}

// ------------------------------------------------------------ data
let goalsCache = null;
async function goals(force = false) {
  if (!goalsCache || force) goalsCache = await rest(`goals?select=${GOAL_COLS}&status=neq.failed&order=name.asc&limit=2000`);
  return goalsCache;
}
const goalById = (list, id) => list.find((g) => g.id === id);

// ------------------------------------------------------------ post card
const KIND = { mapped: 'New goal', bottleneck: 'Bottleneck', advance: 'Advance', setback: 'Setback', solved: 'Branch solved', forgotten: 'Forgotten idea', promise: 'Promise check' };
const PSTATUS = { kept: 'Kept', partly: 'Partly kept', broken: 'Broken', pending: 'Not due yet', unclear: 'Unclear' };
function quoteBlock(q, paper, made) {
  const u = safeUrl(paper && paper.url);
  const t = paper ? esc(paper.title) : '';
  return `<blockquote class="quote">“${esc(q)}”<cite>${esc(made)} · ${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>` : t}</cite></blockquote>`;
}

function postCard(p, g) {
  const srcs = (p.sources || []).slice(0, 4).map((s) => {
    const url = safeUrl(s.url);
    const meta = [s.year, s.venue].filter(Boolean).join(', ');
    const t = esc(s.title);
    return `<li>${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${t}</a>` : t}${meta ? ` <span>(${esc(meta)})</span>` : ''}</li>`;
  }).join('');
  let check = '';
  if (p.kind !== 'mapped') {
    check = p.independent_sources >= 2
      ? `<span class="check two" title="At least two papers by different first authors back this post">✓ ${p.independent_sources} independent sources</span>`
      : `<span class="check" title="One research group backs this post so far">One source so far</span>`;
    if (p.expert_reviewed) check = check.replace('</span>', ' · expert reviewed</span>');
  } else check = '<span class="check"></span>';
  const treeLink = p.node_key ? `<a class="btn" href="#/g/${encodeURIComponent(g.slug)}/tree/${encodeURIComponent(p.node_key)}">In the tree</a>` : '';
  return `<article class="post">
    <div class="post-h">${avatar(g)}<div class="who"><a class="h" href="#/g/${encodeURIComponent(g.slug)}">@${esc(g.handle)}</a><span class="n">${esc(g.name)}</span></div><time class="when" datetime="${esc(p.created_at)}">${esc(ago(p.created_at))}</time></div>
    <span class="kind ${esc(p.kind)}">${esc(KIND[p.kind] || p.kind)}${p.kind === 'promise' && p.meta?.status ? `<span class="pill ${esc(p.meta.status)}">${esc(PSTATUS[p.meta.status] || p.meta.status)}</span>` : ''}</span>
    <h3>${esc(p.headline)}</h3>
    ${p.kind === 'promise' && p.meta?.quote ? quoteBlock(p.meta.quote, p.meta.paper, `Written in ${p.meta.made_year}, due ${p.meta.due_year}`) : ''}
    ${p.body ? `<p>${esc(p.body)}</p>` : ''}
    ${srcs ? `<ul class="srcs">${srcs}</ul>` : ''}
    <div class="post-f">${check}${treeLink}${followBtn(g.slug)}<button class="btn icon" data-share="/g/${esc(g.slug)}" data-title="${esc(p.headline)}" aria-label="Share" title="Share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4 4 4M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></button></div>
  </article>`;
}

// ------------------------------------------------------------ views
function note(title, text, extra = '') {
  return `<div class="note"><h2>${esc(title)}</h2><div>${text}</div>${extra}</div>`;
}
function failNote(e, retry) {
  return note("Parallax can't reach its data right now", esc(e.message || e), `<p><button class="btn" onclick="${retry}">Try again</button></p>`);
}

async function feedView(tab) {
  view.innerHTML = `<nav class="tabs feedtabs" role="tablist">
      <a class="tab" role="tab" href="#/" aria-selected="${tab === 'all'}">Everything</a>
      <a class="tab" role="tab" href="#/following" aria-selected="${tab === 'following'}">Following</a>
      <a class="tab" role="tab" href="#/branch" aria-selected="false">Your branch</a>
      <a class="tab" role="tab" href="#/explore" aria-selected="false">Explore</a>
    </nav><div id="posts"><div class="note"><span class="spin" style="display:inline-block"></span></div></div>`;
  const box = $('#posts');
  let list;
  try { list = await goals(); } catch (e) { box.innerHTML = failNote(e, 'route()'); return; }
  if (!list.length) {
    box.innerHTML = note('No goals mapped yet', 'Type any goal in the search bar, for example <b>humans living on Mars</b>. Parallax will map what stands between us and it, and its posts will start here.');
    return;
  }
  let filter = '';
  if (tab === 'following') {
    const mine = list.filter((g) => follows.has(g.slug)).map((g) => g.id);
    if (!mine.length) {
      box.innerHTML = note('Follow a goal to fill this tab', 'Pick goals you care about from Explore, or tap Follow on any post.', `<p><a class="btn primary" href="#/explore">Explore goals</a></p>`);
      return;
    }
    filter = `&goal_id=in.(${mine.join(',')})`;
  }
  let before = null;
  const load = async () => {
    const page = await rest(`posts?select=${POST_COLS}${filter}${before ? `&created_at=lt.${encodeURIComponent(before)}` : ''}&order=created_at.desc&limit=${PAGE}`);
    const html = page.map((p) => { const g = goalById(list, p.goal_id); return g ? postCard(p, g) : ''; }).join('');
    before = page.length ? page[page.length - 1].created_at : before;
    return { html, more: page.length === PAGE };
  };
  try {
    const first = await load();
    if (!first.html) {
      box.innerHTML = note('Nothing posted yet', 'The goals are still being mapped. Their first posts appear here as soon as they are ready.');
      return;
    }
    box.innerHTML = first.html + (first.more ? '<button class="btn more" id="more">Load more</button>' : '');
    const wire = () => {
      const m = $('#more');
      if (!m) return;
      m.onclick = async () => {
        m.disabled = true;
        try {
          const next = await load();
          m.insertAdjacentHTML('beforebegin', next.html);
          if (!next.more) m.remove(); else m.disabled = false;
        } catch (e) { m.disabled = false; toast(e.message); }
      };
    };
    wire();
  } catch (e) { box.innerHTML = failNote(e, 'route()'); }
}

const STAGES = [['tree', 'Understanding the goal'], ['evidence', 'Searching the research'], ['assess', 'Judging every problem against the evidence'], ['synthesize', 'Finding the bottleneck and writing the first posts']];
let pollTimer;

function horizonText(g) {
  if (g.horizon_low == null || g.horizon_high == null) return '—';
  if (g.horizon_low === g.horizon_high) return `~${g.horizon_low} yrs`;
  return `${g.horizon_low}–${g.horizon_high} yrs`;
}

function leafStatusLabel(s) {
  return { solved: 'Solved', in_progress: 'In progress', blocked: 'Blocked', open: 'Barely started' }[s] || 'Unknown';
}
const BLOCK = { knowledge: 'we do not know how yet', materials: 'missing materials', instruments: 'missing instruments or tools', funding: 'missing funding', attention: 'few people are working on it', none: '' };

async function goalView(slug, tab, focusKey) {
  clearTimeout(pollTimer);
  view.innerHTML = `<div class="note"><span class="spin" style="display:inline-block"></span></div>`;
  let g;
  try { g = (await rest(`goals?slug=eq.${encodeURIComponent(slug)}&select=${GOAL_COLS}`))[0]; } catch (e) { view.innerHTML = failNote(e, 'route()'); return; }
  if (!g) { view.innerHTML = note('No goal here', 'This goal does not exist yet. Search for it to map it.'); return; }

  const head = `<div class="goal-h">
      <div class="gh-top">${avatar(g, true)}<div style="min-width:0"><div class="handle">@${esc(g.handle)}</div><div class="followers" id="followers" data-goal="${g.id}"></div></div></div>
      <h1>${esc(g.name)}</h1>
      ${g.summary ? `<p class="sum">${esc(g.summary)}</p>` : ''}
      <div class="act">${followBtn(g.slug)}<button class="btn" data-share="/g/${esc(g.slug)}" data-title="${esc(g.name)} on Parallax"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4 4 4M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>Share</button></div>
    </div>`;

  if (g.status !== 'ready') {
    if (g.status === 'failed') {
      view.innerHTML = head + note('Mapping paused', 'Parallax could not finish mapping this goal yet. It will try again automatically.');
      return;
    }
    const at = STAGES.findIndex((s) => s[0] === g.stage);
    view.innerHTML = head + `<div class="note"><h2>Parallax is mapping this goal</h2><div>This takes a few minutes. You can leave and come back.</div>
      <ol class="steps">${STAGES.map((s, i) => `<li class="${i < at ? 'done' : i === at ? 'now' : ''}">${i < at ? '<svg class="tick" viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2"/></svg>' : i === at ? '<span class="spin"></span>' : '<span class="idle"></span>'}${esc(s[1])}</li>`).join('')}</ol></div>`;
    pollTimer = setTimeout(() => { if (location.hash.startsWith(`#/g/${slug}`)) goalView(slug, tab, focusKey); }, 4000);
    return;
  }

  let nodes, posts, promises = [], helpers = [];
  try {
    [nodes, posts, promises, helpers] = await Promise.all([
      rest(`nodes?goal_id=eq.${g.id}&select=key,parent_key,position,title,why,status,blocker_kind,blocker,evidence,independent_sources&order=position.asc`),
      rest(`posts?goal_id=eq.${g.id}&select=${POST_COLS}&order=created_at.desc&limit=50`),
      rest(`promises?goal_id=eq.${g.id}&select=${PROMISE_COLS}&order=due_year.asc&limit=100`).catch(() => []),
      rest(`node_contributors?goal_id=eq.${g.id}&select=node_key,people`).catch(() => []),
    ]);
  } catch (e) { view.innerHTML = head + failNote(e, 'route()'); return; }

  const leaves = nodes.filter((n) => n.parent_key);
  const branches = nodes.filter((n) => !n.parent_key);
  const solved = leaves.filter((l) => l.status === 'solved').length;
  const going = leaves.filter((l) => l.status === 'in_progress').length;
  const lower = (t) => t ? t.charAt(0).toLowerCase() + t.slice(1).replace(/\.$/, '') : '';
  const pct = Math.round((g.progress || 0) * 100);
  const bn = leaves.find((l) => l.key === g.bottleneck_key);

  const blocked = leaves.filter((l) => l.status === 'blocked').length;
  const openN = leaves.length - solved - going - blocked;
  const seg = [['solved', solved], ['in_progress', going], ['blocked', blocked], ['open', openN]]
    .filter(([, n]) => n).map(([k, n]) => `<i class="st-${k}" style="flex:${n}"></i>`).join('');
  const lo = g.horizon_low, hi = g.horizon_high;
  const horizon = lo == null ? '—' : lo === hi ? `~${lo}` : `${lo}–${hi}`;
  const treeUrl = (k) => `#/g/${encodeURIComponent(g.slug)}/tree/${encodeURIComponent(k)}`;
  const stats = `<div class="metrics">
    <div class="metric"><div class="l">Progress</div><div class="v">${pct}<small>%</small></div><div class="segbar" aria-hidden="true">${seg}</div></div>
    <div class="metric"><div class="l">Countdown</div><div class="v">${esc(horizon)}${lo == null ? '' : '<small>yrs</small>'}</div><div class="s">at the current pace</div></div>
    <div class="metric"><div class="l">Problems</div><div class="v">${leaves.length}</div><div class="s">${solved} solved · ${going} moving</div></div>
    <details class="note2"><summary>How these are measured</summary><p>Progress counts solved problems, and half of those in progress. The countdown is an estimate${g.horizon_note ? `: ${esc(lower(g.horizon_note))}` : ''}.</p></details>
  </div>
  <section class="cmap" aria-label="Map of every problem">
    <div class="cmap-h"><h2>The map</h2><div class="legend"><span><i class="dot st-solved"></i>Solved</span><span><i class="dot st-in_progress"></i>Moving</span><span><i class="dot st-blocked"></i>Blocked</span><span><i class="dot st-open"></i>Barely started</span></div></div>
    ${branches.map((b) => {
      const kids = leaves.filter((l) => l.parent_key === b.key);
      const done = kids.filter((k) => k.status === 'solved').length;
      return `<div class="crow"><div class="bn">${esc(b.title)}<small>${done}/${kids.length} solved</small></div><div class="dots">${kids.map((l) =>
        `<a class="cdot st-${esc(l.status || 'open')}${l.key === g.bottleneck_key ? ' bneck-dot' : ''}" href="${treeUrl(l.key)}" title="${esc(l.title)} · ${esc(leafStatusLabel(l.status))}${l.key === g.bottleneck_key ? ' · biggest bottleneck' : ''}" aria-label="${esc(l.title)}, ${esc(leafStatusLabel(l.status))}"></a>`).join('')}</div></div>`;
    }).join('')}
  </section>
  ${bn ? `<div class="bneck"><div class="l">Biggest bottleneck</div><h3>${esc(bn.title)}</h3><p>${esc(bn.blocker)}</p><a class="arrow-link" href="${treeUrl(bn.key)}">See it in the tree <span aria-hidden="true">→</span></a></div>` : ''}`;

  const tabs = `<nav class="tabs" role="tablist" style="margin-top:18px">
      <a class="tab" role="tab" href="#/g/${encodeURIComponent(g.slug)}" aria-selected="${tab === 'posts'}">Posts</a>
      <a class="tab" role="tab" href="#/g/${encodeURIComponent(g.slug)}/tree" aria-selected="${tab === 'tree'}">The tree</a>
      <a class="tab" role="tab" href="#/g/${encodeURIComponent(g.slug)}/promises" aria-selected="${tab === 'promises'}">Promises${promises.length ? ` (${promises.length})` : ''}</a></nav>`;

  let body;
  if (tab === 'tree') {
    body = `<div class="legend"><span><i class="dot st-solved"></i>Solved</span><span><i class="dot st-in_progress"></i>In progress</span><span><i class="dot st-blocked"></i>Blocked</span><span><i class="dot st-open"></i>Barely started</span></div>` +
      branches.map((b) => {
        const kids = leaves.filter((l) => l.parent_key === b.key);
        const count = (s) => kids.filter((k) => k.status === s).length;
        const seg = ['solved', 'in_progress', 'blocked', 'open'].map((s) => count(s) ? `<i class="st-${s}" style="flex:${count(s)}"></i>` : '').join('');
        return `<section class="branch"><div class="branch-h"><h3>${esc(b.title)}</h3>${b.why ? `<p>${esc(b.why)}</p>` : ''}<div class="mini" aria-hidden="true">${seg}</div></div>
          ${kids.map((l) => {
            const ev = (l.evidence || []).slice(0, 6).map((e) => { const u = safeUrl(e.url); return `<li>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(e.title)}</a>` : esc(e.title)}${e.year ? ` <span>(${esc(e.year)})</span>` : ''}</li>`; }).join('');
            const why = BLOCK[l.blocker_kind] ? ` · ${BLOCK[l.blocker_kind]}` : '';
            return `<details class="leaf${l.key === focusKey ? ' target' : ''}" id="leaf-${esc(l.key)}"${l.key === focusKey ? ' open' : ''}>
              <summary><i class="dot st-${esc(l.status || 'open')}" title="${esc(leafStatusLabel(l.status))}"></i><span class="leaf-t"><b>${esc(l.title)}</b><span>${esc(leafStatusLabel(l.status))}${esc(why)}${l.key === g.bottleneck_key ? ' · biggest bottleneck' : ''}${(() => { const h = helpers.find((x) => x.node_key === l.key); return h ? ` · ${h.people} ${h.people === 1 ? 'person' : 'people'} took a step here` : ''; })()}</span></span></summary>
              <div class="leaf-body">${l.why ? `<p><b>Why it matters:</b> ${esc(l.why)}</p>` : ''}${l.blocker ? `<p><b>${l.status === 'solved' ? 'What was done' : 'What stands in the way'}:</b> ${esc(l.blocker)}</p>` : ''}
                ${ev ? `<ul class="srcs">${ev}</ul>` : '<p style="color:var(--muted)">No papers found for this yet.</p>'}
                <p style="color:var(--muted);font-size:12.5px">${l.independent_sources >= 2 ? `✓ ${l.independent_sources} independent sources` : 'Fewer than two independent sources so far'}</p></div></details>`;
          }).join('')}</section>`;
      }).join('');
  } else if (tab === 'promises') {
    const card = (p) => {
      const leaf = leaves.find((l) => l.key === p.node_key);
      const vs = (p.verdict_sources || []).slice(0, 3).map((s) => { const u = safeUrl(s.url); return `<li>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)}${s.year ? ` <span>(${esc(s.year)})</span>` : ''}</li>`; }).join('');
      return `<article class="post"><span class="kind promise">Due ${esc(p.due_year)}<span class="pill ${esc(p.status)}">${esc(PSTATUS[p.status] || p.status)}</span></span>
        <h3>${esc(p.claim)}</h3>${quoteBlock(p.quote, p.source, `Written in ${p.made_year}`)}
        ${p.verdict ? `<p><b>What happened:</b> ${esc(p.verdict)}</p>` : ''}${vs ? `<ul class="srcs">${vs}</ul>` : ''}
        ${leaf ? `<div class="post-f"><span class="check"></span><a class="btn" href="#/g/${encodeURIComponent(g.slug)}/tree/${encodeURIComponent(leaf.key)}">In the tree</a></div>` : ''}</article>`;
    };
    const checked = promises.filter((p) => p.status !== 'pending').sort((a, b) => b.due_year - a.due_year);
    const coming = promises.filter((p) => p.status === 'pending');
    body = promises.length
      ? `<p style="color:var(--muted);margin:14px 0 0">Dated promises from older research about this goal, quoted word for word, and checked once their deadline passes.</p>` +
        (checked.length ? `<div class="prom-h">Checked</div>${checked.map(card).join('')}` : '') +
        (coming.length ? `<div class="prom-h">Not due yet</div>${coming.map(card).join('')}` : '')
      : note('No promises found yet', 'Parallax searches older research on this goal for dated promises once a month.');
  } else {
    body = posts.length ? posts.map((p) => postCard(p, g)).join('') : note('No posts yet', 'New research on this goal will appear here.');
  }

  view.innerHTML = head + stats + tabs + body;
  refreshFollowers();
  if (focusKey) $(`#leaf-${CSS.escape(focusKey)}`)?.scrollIntoView({ block: 'center' });
}

async function mapGoal(q) {
  const btn = $('#mapIt'), msg = $('#mapMsg');
  btn.disabled = true;
  msg.innerHTML = '<span class="spin" style="display:inline-block;vertical-align:-2px"></span> Understanding the goal. This can take up to a minute…';
  try {
    const r = await fetch(`${SUPA_URL}/functions/v1/map-goal`, {
      method: 'POST',
      headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q }),
    });
    let data = {};
    try { data = await r.json(); } catch {}
    if (data.slug) {
      goalsCache = null;
      location.hash = `#/g/${encodeURIComponent(data.slug)}`;
      if (data.duplicate) toast('Parallax already follows this goal');
      return;
    }
    btn.disabled = false;
    msg.textContent = data.rejected ? `Parallax can't map this one: ${data.rejected}` : (data.error || `Mapping could not start (error ${r.status}).`);
  } catch (e) {
    btn.disabled = false;
    msg.textContent = `Mapping could not start: ${e.message}`;
  }
}

// ------------------------------------------------------------ search box
const STOP = new Set(['a', 'an', 'the', 'of', 'for', 'to', 'in', 'on', 'and', 'or', 'with', 'how', 'cure', 'end', 'humans', 'human', 'people', 'make', 'making', 'better', 'new']);
function match(list, q) {
  const words = q.toLowerCase().split(/[^a-z0-9']+/).filter((w) => w.length > 1 && !STOP.has(w));
  if (!words.length) return [];
  return list.map((g) => {
    const hay = `${g.handle} ${g.name} ${g.summary || ''}`.toLowerCase();
    const score = words.reduce((a, w) => a + (hay.includes(w) ? (g.handle.toLowerCase().includes(w) || g.name.toLowerCase().includes(w) ? 2 : 1) : 0), 0);
    return { g, score };
  }).filter((x) => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 8).map((x) => x.g);
}

const qInput = $('#q'), sug = $('#suggest');
let sugIndex = -1;
qInput.addEventListener('input', async () => {
  const q = qInput.value.trim();
  sugIndex = -1;
  if (q.length < 2) { sug.classList.add('hide'); return; }
  let list = [];
  try { list = await goals(); } catch {}
  const hits = match(list, q).slice(0, 5);
  sug.innerHTML = hits.map((g) => `<a role="option" href="#/g/${encodeURIComponent(g.slug)}">${avatar(g).replace('<a ', '<span ').replace('</a>', '</span>').replace(/ href="[^"]*"/, '')}<span class="t"><b>@${esc(g.handle)}</b> <small style="color:var(--muted)">${esc(g.name)}</small></span></a>`).join('') +
    `<button type="submit" role="option"><span>Search or map “<b>${esc(q)}</b>”</span></button>`;
  sug.classList.remove('hide');
});
qInput.addEventListener('keydown', (e) => {
  const items = [...sug.querySelectorAll('[role=option]')];
  if (sug.classList.contains('hide') || !items.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    sugIndex = (sugIndex + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items.forEach((el, i) => el.classList.toggle('on', i === sugIndex));
  } else if (e.key === 'Enter' && sugIndex >= 0 && items[sugIndex].tagName === 'A') {
    e.preventDefault();
    items[sugIndex].click();
  } else if (e.key === 'Escape') sug.classList.add('hide');
});
$('#searchForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const q = qInput.value.trim();
  if (q.length < 3) return;

      ${(p.skills || []).length ? `<div class="chips">${p.skills.map((k) => `<span class="chip">${esc(k)}</span>`).join('')}</div>` : ''}
      <div class="followers">Joined ${esc(joined)}</div>
      <div class="act">${own ? '<a class="btn primary" href="#/branch">Your branch</a><a class="btn" href="#/settings">Edit profile</a>' : ''}<button class="btn" data-share="/u/${esc(p.handle)}" data-title="${esc(p.display_name || p.handle)} on Parallax">Share</button></div>
    </div></div>
    <div class="prom-h">Following ${mine.length} ${mine.length === 1 ? 'goal' : 'goals'}</div>
    ${mine.length ? `<div class="grid" style="margin-top:6px">${mine.map((g) => `<a class="gcard" href="#/g/${encodeURIComponent(g.slug)}"><span class="t"><b>@${esc(g.handle)}</b><small>${esc(g.name)}</small></span></a>`).join('')}</div>`
      : `<p style="color:var(--muted)">${own ? 'Follow goals and they will show here.' : 'Not following any goals yet.'}</p>`}
    <div class="prom-h">Impact</div>${impactHtml(steps, list, own)}`;
  view.querySelectorAll('[data-undo]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('Remove this step from your impact?')) return;
      const { error } = await sb.from('contributions').delete().eq('id', Number(b.dataset.undo)).eq('user_id', me.id);
      if (error) { toast(`Could not remove: ${error.message}`); return; }
      route();
    };
  });
}

function impactHtml(steps, list, own) {
  if (!steps.length) {
    return own
      ? `<p style="color:var(--muted);margin-top:4px">When you take a first step from Your branch, press "I did this" and it shows here.</p><p><a class="btn" href="#/branch">Open your branch</a></p>`
      : '<p style="color:var(--muted);margin-top:4px">No steps yet.</p>';
  }
  const goalsTouched = new Set(steps.map((x) => x.goal_id)).size;
  return `<p style="margin:4px 0 0"><b>${steps.length} ${steps.length === 1 ? 'step' : 'steps'}</b> taken across <b>${goalsTouched} ${goalsTouched === 1 ? 'goal' : 'goals'}</b> <span style="color:var(--muted)">· self-reported</span></p>` +
    steps.map((x) => {
      const g = list.find((y) => y.id === x.goal_id);
      const head = g ? `<div class="post-h">${avatar(g)}<div class="who"><a class="h" href="#/g/${encodeURIComponent(g.slug)}">@${esc(g.handle)}</a><span class="n">${esc(g.name)}</span></div><time class="when" datetime="${esc(x.created_at)}">${esc(ago(x.created_at))}</time></div>` : '';
      return `<article class="post">${head}
        <h3 style="margin-top:10px">${g ? `<a href="#/g/${encodeURIComponent(g.slug)}/tree/${encodeURIComponent(x.node_key)}" style="text-decoration:none">${esc(x.node_title)}</a>` : esc(x.node_title)}</h3>
        <p>${x.note ? esc(x.note) : 'Took the suggested first step.'}</p>
        ${x.step ? `<p style="color:var(--muted);font-size:13px;margin:0">Suggested step: ${esc(x.step)}</p>` : ''}
        ${own ? `<div class="post-f"><span class="check"></span><button class="btn" type="button" data-undo="${x.id}">Remove</button></div>` : ''}</article>`;
    }).join('');
}

async function settingsView(welcome) {
  view.innerHTML = `<div class="note"><span class="spin" style="display:inline-block"></span></div>`;
  await authReady;
  if (!sb) { view.innerHTML = note('Accounts could not load', 'Check your connection and reload the page.'); return; }
  if (!me) {
    view.innerHTML = note('Sign in to edit your profile', 'Your profile shows the goals you follow and what you can help with.', '<p><button class="btn primary" type="button" id="needSignIn">Sign in</button></p>');
    $('#needSignIn').onclick = () => openSignIn();
    return;
  }
  const p = me.profile || { handle: '', display_name: '', bio: '', skills: [] };
  view.innerHTML = `<h1 class="page-h">${welcome ? 'Welcome to Parallax' : 'Settings'}</h1>
    <p style="color:var(--muted);margin:0">${welcome ? 'Pick your name on Parallax and tell people what you can help with. You can change this any time.' : 'This is what people see on your profile.'}</p>
    <form id="pf" class="post" style="margin-top:16px">
      <label class="field"><span>Name</span><input id="pfName" maxlength="60" value="${esc(p.display_name)}"></label>
      <label class="field"><span>Handle</span><input id="pfHandle" maxlength="20" value="${esc(p.handle)}" autocapitalize="off" spellcheck="false"><small>3 to 20 letters, numbers or _. Your profile lives at @handle.</small></label>
      <label class="field"><span>Bio</span><textarea id="pfBio" maxlength="280">${esc(p.bio)}</textarea><small><span id="pfCount">${(p.bio || '').length}</span>/280</small></label>
      <label class="field"><span>What you can help with</span><input id="pfSkills" value="${esc((p.skills || []).join(', '))}" placeholder="coding, nursing, Portuguese, chemistry"><small>Separate with commas. Parallax will use these to show you the problems that need someone like you.</small></label>
      <button class="btn primary" type="submit" id="pfSave">${welcome ? 'Save and continue' : 'Save'}</button>
      <div class="err" id="pfErr"></div>
    </form>
    ${welcome ? '' : `<div class="post"><h3 style="margin-top:2px">Account</h3>
      <div class="post-f" style="margin-top:4px"><button class="btn" type="button" id="pfOut">Sign out</button><button class="btn danger" type="button" id="pfDel">Delete my account</button></div>
      <p class="fine" style="color:var(--muted);font-size:13px">Deleting removes your profile and follows for good.</p></div>`}`;
  $('#pfBio').oninput = () => { $('#pfCount').textContent = $('#pfBio').value.length; };
  $('#pf').onsubmit = async (e) => {
    e.preventDefault();
    const handle = $('#pfHandle').value.trim();
    const err = $('#pfErr');
    err.textContent = '';
    if (!/^[A-Za-z0-9_]{3,20}$/.test(handle)) { err.textContent = 'Handles use 3 to 20 letters, numbers or _.'; return; }
    const skills = [...new Set($('#pfSkills').value.split(',').map((x) => x.trim().slice(0, 40)).filter(Boolean))].slice(0, 12);
    $('#pfSave').disabled = true;
    const { data, error } = await sb.from('profiles')
      .update({ handle, display_name: $('#pfName').value.trim().slice(0, 60), bio: $('#pfBio').value.trim().slice(0, 280), skills })
      .eq('id', me.id).select(PROFILE_COLS).single();
    $('#pfSave').disabled = false;
    if (error) { err.textContent = error.code === '23505' ? 'That handle is taken. Try another.' : `Could not save: ${error.message}`; return; }
    me.profile = data;
    renderAcct();
    toast('Saved');
    location.hash = `#/u/${encodeURIComponent(data.handle)}`;
  };
  const out = $('#pfOut');
  if (out) out.onclick = () => sb.auth.signOut();
  const del = $('#pfDel');
  if (del) del.onclick = async () => {
    if (!confirm('Delete your Parallax account? Your profile and follows will be removed. This cannot be undone.')) return;
    del.disabled = true;
    const { error } = await sb.rpc('delete_my_account');
    if (error) { del.disabled = false; toast(`Could not delete: ${error.message}`); return; }
    await sb.auth.signOut();
    location.hash = '#/';
  };
}

let branchItems = [];
function branchCard(it, i, done) {
  const g = it.goal;
  const papers = (it.papers || []).map((e) => { const u = safeUrl(e.url); return `<li>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(e.title)}</a>` : esc(e.title)}${e.year ? ` <span>(${esc(e.year)}${e.first_author ? `, ${esc(e.first_author)}` : ''})</span>` : ''}</li>`; }).join('');
  return `<article class="post">
    <div class="post-h">${avatar(g)}<div class="who"><a class="h" href="#/g/${encodeURIComponent(g.slug)}">@${esc(g.handle)}</a><span class="n">${esc(g.name)}</span></div></div>
    <span class="kind advance">Fits your skill: ${esc(it.skill_used)}</span>
    <h3><i class="dot st-${esc(it.node.status || 'open')}" style="display:inline-block;margin:0 8px 1px 0;vertical-align:middle"></i>${esc(it.node.title)}</h3>
    <p><b>Why you:</b> ${esc(it.why_you)}</p>
    <p><b>A first step:</b> ${esc(it.first_step)}</p>
    ${papers ? `<ul class="srcs">${papers}</ul>` : ''}
    <div class="post-f"><span class="check"></span><a class="btn" href="#/g/${encodeURIComponent(g.slug)}/tree/${encodeURIComponent(it.node.key)}">See the problem</a>${followBtn(g.slug)}${done ? '<span class="btn following">Done ✓</span>' : `<button class="btn primary" type="button" data-did="${i}">I did this</button>`}</div>
  </article>`;
}

async function branchView(refresh = false) {
  const tabs = `<nav class="tabs feedtabs" role="tablist">
      <a class="tab" role="tab" href="#/" aria-selected="false">Everything</a>
      <a class="tab" role="tab" href="#/following" aria-selected="false">Following</a>
      <a class="tab" role="tab" href="#/branch" aria-selected="true">Your branch</a>
      <a class="tab" role="tab" href="#/explore" aria-selected="false">Explore</a></nav>`;
  view.innerHTML = tabs + `<div id="br"><div class="note"><span class="spin" style="display:inline-block"></span></div></div>`;
  const box = $('#br');
  await authReady;
  if (!box.isConnected) return;
  if (!sb || !me) {
    box.innerHTML = note('Find where you can help', 'Sign in and tell Parallax what you are good at. It will find the problems, across every goal, where someone like you can make a difference.', '<p><button class="btn primary" type="button" id="brIn">Sign in</button></p>');
    box.querySelector('#brIn').onclick = () => openSignIn('Sign in to find the problems where your skills can help.');
    return;
  }
  const skills = (me.profile && me.profile.skills) || [];
  if (!skills.length) {
    box.innerHTML = note('Add what you can help with', 'Parallax matches your skills to the problems that need them. Add a few, like nursing, coding, statistics or Spanish.', '<p><a class="btn primary" href="#/settings">Add your skills</a></p>');
    return;
  }
  box.innerHTML = `<div class="note"><span class="spin" style="display:inline-block"></span><h2 style="margin-top:12px">Finding where your skills fit</h2><div>Parallax is reading every open problem across every goal. This takes about 20 seconds.</div></div>`;
  let data = {};
  try {
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch(`${SUPA_URL}/functions/v1/branch`, {
      method: 'POST',
      headers: { apikey: SUPA_KEY, Authorization: `Bearer ${session ? session.access_token : SUPA_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(refresh ? { refresh: true } : {}),
    });
    data = await r.json().catch(() => ({ error: `Parallax answered ${r.status}` }));
  } catch (e) { data = { error: e.message }; }
  if (!box.isConnected) return; // the person moved on, or a newer load replaced this one
  if (data.needs === 'skills') { location.hash = '#/settings'; return; }
  if (data.error && !data.items) { box.innerHTML = note('Could not find your matches', esc(data.error), '<p><button class="btn" type="button" onclick="branchView()">Try again</button></p>'); return; }
  const items = data.items || [];
  branchItems = items;
  const done = new Set();
  try {
    const { data: rows } = await sb.from('contributions').select('goal_id,node_key').eq('user_id', me.id);
    for (const r of rows || []) done.add(`${r.goal_id}/${r.node_key}`);
  } catch {}
  if (!box.isConnected) return;
  const when = data.generated_at ? ago(data.generated_at) : '';
  box.innerHTML = `<h1 class="page-h">Your branch</h1>
    <p class="page-sub">Problems where someone with your skills can help. Based on:</p>
    <div class="chips">${skills.map((k) => `<span class="chip">${esc(k)}</span>`).join('')}<a class="chip" href="#/settings" style="background:none;text-decoration:underline">Edit</a></div>
    ${data.note ? `<p style="color:var(--muted)">${esc(data.note)}</p>` : ''}
    ${items.length ? items.map((it, i) => branchCard(it, i, done.has(`${it.goal.id}/${it.node.key}`))).join('') : note('No close matches yet', 'Try adding more skills, or check back as more goals are mapped.')}
    <p style="text-align:center;color:var(--muted);font-size:13px;margin-top:16px">${when ? `Matched ${esc(when === 'now' ? 'just now' : /^\d/.test(when) ? `${when} ago` : `on ${when}`)} · ` : ''}<button class="btn" type="button" id="brNew">Find new matches</button></p>`;
  box.querySelector('#brNew').onclick = () => branchView(true);
  box.addEventListener('click', (e) => {
    const b = e.target.closest('[data-did]');
    if (b) openDidIt(branchItems[Number(b.dataset.did)], b);
  });
}

function openDidIt(it, btn) {
  if (!it || !me) return;
  closeModal();
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="didT">
    <h2 id="didT">Nice work</h2>
    <p>Add this to your impact on <b>${esc(it.node.title)}</b>.</p>
    <label class="field"><span>What did you do? <small style="display:inline;font-weight:400">(optional)</small></span>
      <textarea id="didNote" maxlength="500" placeholder="For example: read the paper and sent my notes to the author."></textarea></label>
    <button class="btn primary wide" type="button" id="didSave">Add to my impact</button>
    <button class="btn wide" type="button" id="didCancel">Cancel</button>
    <p class="fine">Shown on your public profile, marked as self-reported.</p>
    <div class="err" id="didErr"></div></div>`;
  document.body.appendChild(back);
  back.addEventListener('click', (e) => { if (e.target === back) closeModal(); });
  $('#didCancel').onclick = closeModal;
  $('#didNote').focus();
  $('#didSave').onclick = async () => {
    $('#didSave').disabled = true;
    const { error } = await sb.from('contributions').insert({
      user_id: me.id, goal_id: it.goal.id, node_key: it.node.key, node_title: it.node.title.slice(0, 300),
      step: String(it.first_step || '').slice(0, 600), note: $('#didNote').value.trim().slice(0, 500),
    });
    if (error && error.code !== '23505') { $('#didSave').disabled = false; $('#didErr').textContent = `Could not save: ${error.message}`; return; }
    closeModal();
    if (btn) btn.outerHTML = '<span class="btn following">Done ✓</span>';
    toast('Added to your impact');
  };
}

// ------------------------------------------------------------ router
function setNav(parts) {
  const key = { '': 'home', following: 'following', branch: 'branch', explore: 'explore', u: 'me', settings: 'me' }[parts[0]] ?? '';
  document.querySelectorAll('#bnav [data-nav]').forEach((el) => {
    const on = el.dataset.nav === key;
    el.classList.toggle('on', on);
    if (on) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
  });
}
$('#navMe').addEventListener('click', () => {
  if (me && me.profile) location.hash = `#/u/${encodeURIComponent(me.profile.handle)}`;
  else openSignIn();
});

function route() {
  clearTimeout(pollTimer);
  toggleMenu(false);
  const parts = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  setNav(parts);
  window.scrollTo(0, 0);
  if (parts[0] === 'following') return feedView('following');
  if (parts[0] === 'explore') return exploreView();
  if (parts[0] === 'u' && parts[1]) return profileView(parts[1]);
  if (parts[0] === 'branch') return branchView();
  if (parts[0] === 'settings') return settingsView(parts[1] === 'welcome');
  if (parts[0] === 'search' && parts[1]) return searchView(parts.slice(1).join('/'));
  if (parts[0] === 'g' && parts[1]) return goalView(parts[1], ['tree', 'promises'].includes(parts[2]) ? parts[2] : 'posts', parts[2] === 'tree' ? parts[3] : undefined);
  return feedView('all');
}
window.addEventListener('hashchange', route);
renderAcct();
route();
</script>
</body>
</html>
