<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PARALLAX — Scientific Operating System</title>
<style>
/* ============================================================
   PARALLAX V4 — scientific operating system
   One live workspace. Six instruments. No pages.
   Provenance: cyan measured · navy calculated · amber assumed ·
   violet proposed · graphite claim.
   ============================================================ */
:root{
  --ev:#2ec8f5; --calc:#8fb4dc; --asm:#e8a13a; --hyp:#b08af5; --clm:#dce9f5;
  --ink:#e6f2fe; --ink2:#c2d9ec; --dim:#7d9cb8;
  --line:rgba(150,200,240,.16); --line2:rgba(150,200,240,.3);
  --surf:rgba(12,26,44,.88);
  --ok:#3ecf95; --bad:#f57a7a;
  --f:'Inter','SF Pro Display','Helvetica Neue',system-ui,sans-serif;
  --m:ui-monospace,'SF Mono','JetBrains Mono',Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:var(--f);color:var(--ink);
  background:
    radial-gradient(120% 90% at 66% 28%, rgba(24,84,140,.35) 0%, rgba(14,48,86,.16) 34%, rgba(14,48,86,0) 68%),
    radial-gradient(90% 80% at 12% 92%, rgba(64,24,130,.20) 0%, rgba(64,24,130,0) 60%),
    radial-gradient(80% 70% at 90% 6%, rgba(0,120,190,.16) 0%, rgba(0,120,190,0) 55%),
    linear-gradient(180deg,#030b16 0%,#061527 46%,#0a1f36 100%);
  -webkit-font-smoothing:antialiased;user-select:none;
}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.6;mix-blend-mode:screen;
  background-image:
   radial-gradient(rgba(215,238,255,.6) .6px,transparent 1px),
   radial-gradient(rgba(150,205,250,.4) .5px,transparent .9px),
   radial-gradient(rgba(255,255,255,.16) .4px,transparent .8px);
  background-size:230px 205px,127px 149px,59px 71px;
  background-position:17px 31px,73px 11px,0 0;z-index:2}

button{font-family:var(--f)}
canvas{display:block}
#gl{position:fixed;left:0;top:0;opacity:0;transition:opacity .6s;background:transparent;pointer-events:none}
#gl.on{opacity:1}
#stage{position:fixed;inset:0;width:100%;height:100%;z-index:7;touch-action:none;pointer-events:none}
#figInput{position:fixed;z-index:8;touch-action:none;cursor:default}
#gl{z-index:6}
.vig{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(120% 100% at 50% 45%, rgba(0,4,10,0) 52%, rgba(0,4,10,.5) 100%)}

/* ------- chrome (kept minimal — the stage is the interface) ------- */
#chrome{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity 1s}
#chrome.on{opacity:1}
#brand{position:absolute;top:16px;left:22px;pointer-events:auto}
#brand .p{font-size:13px;letter-spacing:.46em;font-weight:600;color:#eef7ff}
#brand .sim{display:inline-block;margin-left:10px;font-family:var(--m);font-size:7px;letter-spacing:.16em;
  color:var(--asm);border:1px dashed rgba(232,161,58,.55);padding:2px 6px;border-radius:3px;vertical-align:2px}
#brand.dark .p{color:#e8f3fb;text-shadow:0 1px 10px rgba(0,0,0,.5)}
#dock{position:absolute;top:12px;left:calc(50% - 80px);transform:translateX(-50%);display:flex;gap:14px;pointer-events:auto}
.dk{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 3px;cursor:pointer;text-align:center}
.dk .n{font-size:9.5px;letter-spacing:.22em;font-weight:800;color:var(--ink2);text-transform:uppercase}
.dk .d{margin-top:2px;font-size:7.5px;letter-spacing:.06em;color:var(--dim);white-space:nowrap}
.dk:hover .n{color:var(--ink)}
.dk.on{border-bottom-color:#2f88c0}
.dk.on .n{color:#eef7ff}.dk.on .d{color:var(--ink2)}
.dk .badge{display:inline-block;font-family:var(--m);font-size:7px;color:#fff;background:var(--ev);
  border-radius:6px;padding:0 4px;margin-left:4px;vertical-align:2px}
#strip{position:absolute;top:52px;left:0;right:0;height:26px;display:flex;gap:26px;align-items:center;justify-content:center;
  font-family:var(--m);font-size:8.4px;letter-spacing:.1em;color:var(--dim);
  border-top:1px solid rgba(150,200,240,.12);border-bottom:1px solid rgba(150,200,240,.12);
  pointer-events:none;white-space:nowrap;overflow:hidden}
#strip b{color:var(--ink);font-weight:650;margin-left:4px}
#strip:empty{display:none}
#cmdHint{position:absolute;top:14px;right:14px;pointer-events:auto;background:none;
  border:0;border-bottom:1px solid rgba(150,200,240,.4);padding:4px 2px;cursor:pointer;
  font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;color:var(--ink)}
#cmdHint b{font-family:var(--m);font-weight:400;color:var(--ev);margin-left:6px}

/* live model vitals — always present: the model never sleeps */
#vitals{position:absolute;left:22px;bottom:18px;pointer-events:auto;display:flex;flex-direction:column;gap:7px;
  background:rgba(10,24,40,.78);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;
  backdrop-filter:blur(10px);min-width:250px;box-shadow:0 8px 30px -16px rgba(10,30,60,.4)}
#vitals .vh{display:flex;justify-content:space-between;align-items:center}
#vitals .vh .t{font-size:8px;letter-spacing:.26em;font-weight:800;color:var(--ink2);text-transform:uppercase}
#vitals .vh .live{display:flex;align-items:center;gap:5px;font-family:var(--m);font-size:7.5px;color:var(--ev)}
#vitals .vh .live i{width:5px;height:5px;border-radius:50%;background:var(--ev);box-shadow:0 0 7px rgba(46,200,245,.9);animation:bl 2.8s infinite}
@keyframes bl{0%,100%{opacity:.35}50%{opacity:1}}
.vrow{display:flex;align-items:center;gap:8px}
.vrow .k{width:86px;font-size:8px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--dim)}
.vrow .b{flex:1;height:4px;border-radius:2px;background:rgba(150,200,240,.12);overflow:hidden}
.vrow .b i{display:block;height:100%;border-radius:2px;transition:width .7s cubic-bezier(.2,.7,.2,1)}
.vrow .v{font-family:var(--m);font-size:8.5px;color:var(--ink2);min-width:72px;text-align:right}
#vitals .note{font-family:var(--m);font-size:7.5px;color:var(--dim);letter-spacing:.06em}

/* per-mode instrument controls (bottom center) */
#ctl{position:absolute;left:calc(50% - 80px);bottom:18px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;
  pointer-events:auto;flex-wrap:wrap;justify-content:center;max-width:74vw}
.cchip{background:none;border:0;border-bottom:1px solid rgba(150,200,240,.4);border-radius:0;padding:4px 2px;cursor:pointer;
  font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--ink2)}
.cchip:hover{color:var(--ink);border-color:var(--ev)}
.cchip.on{color:#eef7ff;border-bottom:2px solid #2f88c0}
.cchip.acc{color:var(--ev);border-color:rgba(46,200,245,.6)}
.cslider{display:flex;align-items:center;gap:9px;background:none;border:0;border-bottom:1px solid rgba(150,200,240,.25);padding:4px 2px}
.cslider label{font-size:8px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--asm)}
.cslider input{width:130px;accent-color:#e8a13a}
.cslider .rv{font-family:var(--m);font-size:8.5px;color:var(--ink2);min-width:60px}
#ctl .dark,#figCtl .dark{background:none;color:#c2d9ec;border-color:rgba(150,200,240,.4)}
#ctl .dark.on,#figCtl .dark.on{color:#eef7ff;border-bottom:2px solid #2f88c0}

/* inspector — progressive disclosure card, never a wall of text */
#insp{position:absolute;top:70px;right:22px;width:330px;max-height:calc(100% - 160px);overflow-y:auto;
  pointer-events:auto;background:rgba(12,26,44,.92);border:1px solid var(--line2);border-radius:12px;
  padding:14px 16px;backdrop-filter:blur(14px);box-shadow:0 18px 50px -20px rgba(10,30,60,.5);
  transform:translateX(16px);opacity:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s;scrollbar-width:thin}
#insp.on{transform:none;opacity:1}
#insp .ih{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#insp .ih .t{font-size:13px;font-weight:700;color:#eef7ff;line-height:1.4}
#insp .ih .x{background:none;border:0;cursor:pointer;color:var(--dim);font-size:14px;padding:2px 4px}
#insp .chips,#intel .chips,.pcard .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{display:inline-flex;align-items:center;font-family:var(--m);font-size:7.5px;letter-spacing:.14em;
  text-transform:uppercase;padding:2px 7px;border:1px solid;border-radius:3px;white-space:nowrap}
.chip.ev{color:var(--ev);border-color:rgba(46,200,245,.5);background:rgba(46,200,245,.06)}
.chip.calc{color:var(--calc);border-color:rgba(130,170,215,.5);background:rgba(130,170,215,.06)}
.chip.asm{color:var(--asm);border-color:rgba(232,161,58,.5);background:rgba(232,161,58,.07)}
.chip.hyp{color:var(--hyp);border-color:rgba(176,138,245,.5);background:rgba(176,138,245,.06)}
.chip.clm{color:var(--clm);border-color:rgba(220,233,245,.55);background:rgba(150,200,240,.08)}
.chip.ok{color:var(--ok);border-color:rgba(62,207,149,.5);background:rgba(62,207,149,.06)}
.chip.bad{color:var(--bad);border-color:rgba(245,122,122,.5);background:rgba(245,122,122,.06)}
#insp .rows,#intel .rows,.pcard .rows{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.irow{display:flex;gap:8px;font-size:10.8px;line-height:1.5;color:var(--ink2)}
.irow .ik{flex:none;width:88px;font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--dim);padding-top:2px}
.irow b{color:var(--ink);font-weight:650}
.ibar{display:flex;align-items:center;gap:7px}
.ibar .b{flex:1;height:4px;border-radius:2px;background:rgba(150,200,240,.12);overflow:hidden}
.ibar .b i{display:block;height:100%;border-radius:2px}
.ibar .v{font-family:var(--m);font-size:8px;color:var(--ink2)}
#insp details,#intel details,.pcard details{margin-top:9px;border-top:1px solid var(--line);padding-top:8px}
#insp summary,#intel summary,.pcard summary{cursor:pointer;font-size:8px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--ink2);list-style:none}
#insp summary::before,#intel summary::before,.pcard summary::before{content:'▸ ';color:var(--ev)}
#insp details[open] summary::before,#intel details[open] summary::before,.pcard details[open] summary::before{content:'▾ '}
#insp details .db,#intel details .db,.pcard details .db{margin-top:7px;font-size:10.6px;line-height:1.65;color:var(--ink2)}
.mini{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.mini .m{display:flex;gap:7px;align-items:baseline;font-size:10.2px;line-height:1.45;color:var(--ink2)}
.mini .m .n{flex:none;font-family:var(--m);font-size:7.5px;color:#fff;border-radius:50%;width:14px;height:14px;
  display:inline-flex;align-items:center;justify-content:center}
#insp .acts,#intel .acts,.pcard .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.abtn{background:none;border:0;border-bottom:1px solid rgba(150,200,240,.4);border-radius:0;padding:3px 1px;cursor:pointer;
  font-size:8px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--ink)}
.abtn:hover{color:var(--ev);border-color:var(--ev)}
.abtn.pri{color:#eef7ff;border-bottom:2px solid #2f88c0}
.abtn.warn{color:var(--bad);border-color:rgba(245,122,122,.45)}

/* global reasoning bar — talk to the operating system from anywhere */
#speak{position:absolute;left:20px;bottom:12px;width:min(460px,32vw);pointer-events:auto;z-index:12}
#speak .srow{display:flex;align-items:center;gap:9px;background:none;border-bottom:1.5px solid rgba(150,200,240,.5);padding:7px 2px}
#speak .sind i{display:block;width:7px;height:7px;border-radius:50%;background:var(--ev);box-shadow:0 0 8px rgba(46,200,245,.9);animation:bl 2.4s infinite}
#speakIn{flex:1;background:none;border:0;outline:0;font-family:var(--f);font-size:11.5px;color:var(--ink)}
#speakIn::placeholder{color:#6d89a2}
#speak .skey{font-family:var(--m);font-size:9px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
#speak .sq{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.echo{background:none;border:0;border-left:3px solid var(--clm);padding:4px 11px;font-size:10.3px;line-height:1.55;color:var(--ink2);animation:fi .4s both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.echo .eq{font-style:italic;color:var(--ink);font-weight:520}
.echo .ev2{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.echo .vb{font-size:9.6px;margin-top:5px}
.echo .vb b{color:var(--ink)}
/* ranked key findings — conclusions first, drill-down for everything else */
.kf{display:flex;gap:8px;align-items:flex-start;padding:6px 4px;border-radius:6px;cursor:pointer}
.kf:hover{background:rgba(150,200,240,.08)}
.kf .sv{flex:none;width:7px;height:7px;border-radius:50%;margin-top:4px}
.kf .kt{font-size:10.8px;line-height:1.5;color:var(--ink);font-weight:600}
.kf .kb{display:none;font-size:10.2px;line-height:1.6;color:var(--ink2);font-weight:400;margin-top:4px}
.kf.open .kb{display:block}
.kf .kb .prov{font-family:var(--m);font-size:8px;color:var(--dim);margin-top:4px;letter-spacing:.04em}
details.grp{border-bottom:1px solid var(--line);padding:7px 0}
details.grp>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;
  font-size:7.4px;letter-spacing:.24em;font-weight:800;color:var(--dim);text-transform:uppercase}
details.grp>summary::before{content:'▸ ';color:var(--ev)}
details.grp[open]>summary::before{content:'▾ '}
details.grp>summary .lv{font-family:var(--m);font-size:6.8px;color:var(--ev)}
details.grp>.gb{padding-top:6px}
/* ---- the document IS the workspace: dense text with figures embedded inside it ---- */
#doc{position:fixed;top:84px;left:0;right:0;bottom:0;overflow:hidden;z-index:5;pointer-events:none}
/* station stepper — one strip, one axis */
#ststep{position:absolute;left:26px;top:16px;width:min(560px,39vw);pointer-events:auto}
#ststep .mt{font-size:7.4px;letter-spacing:.26em;font-weight:800;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
#ststep .row{display:flex;align-items:center;gap:10px}
.stpn{background:none;border:0;cursor:pointer;padding:2px;position:relative}
.stpn i{display:block;width:9px;height:9px;border-radius:50%;border:1.4px solid rgba(150,200,240,.45);background:rgba(13,30,52,.9)}
.stpn.on i{border-color:var(--ev);background:var(--ev);box-shadow:0 0 10px rgba(46,200,245,.85)}
.stpn:hover i{border-color:var(--ev)}
#ststep .cur{margin-top:8px}
#ststep .cur .c1{font-size:13px;font-weight:750;color:#eef7ff}
#ststep .cur .c2{font-family:var(--m);font-size:8px;letter-spacing:.08em;color:var(--dim);margin-top:2px;text-transform:uppercase}
.stpa{background:none;border:0;cursor:pointer;color:var(--ink2);font-size:13px;padding:0 4px}
.stpa:hover{color:var(--ev)}
/* active station: text pane left, visual pane right — both alive */
#stext{position:absolute;left:26px;top:96px;bottom:92px;width:min(560px,39vw);overflow-y:auto;overflow-x:hidden;transition:width .3s}
#stext.wide{width:auto;right:40px;max-width:1080px}
#stext.m{width:min(600px,43vw)}
#svis.m{left:calc(min(600px,43vw) + 56px)}
#svis.full{left:calc(min(560px,39vw) + 44px);right:0;top:34px;bottom:64px}
#svis.full .vin{display:block;height:100%;max-width:none;transform:none!important}

#svis.full #liveFig{position:absolute;inset:0;height:auto;min-height:0}
#svis.full .fcap{position:absolute;left:50%;transform:translateX(-50%);bottom:4px;margin:0;max-width:900px;text-align:center;text-shadow:0 1px 10px rgba(0,0,0,.85)}
.fcap .capline{display:block;margin-top:5px;font-family:var(--m);font-size:9px;letter-spacing:.06em;color:var(--ink2)}
#svis.full #figCtl{position:absolute;top:8px;left:50%;transform:translateX(-50%);margin:0;justify-content:center}
#svis.m .vin{max-width:620px;margin:0 auto;cursor:grab;transition:transform .12s ease-out;transform-style:preserve-3d;will-change:transform}
#svis.m #liveFig{flex:none;height:min(48vh,430px)}
.inlinefig{max-width:560px;margin:8px 0}
.inlinefig svg{width:100%;height:auto}
#stext.wide .sec p{max-width:860px}
#stext-unused{
  pointer-events:auto;scrollbar-width:none;padding-right:10px;mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 26px),transparent 100%)}
#stext::-webkit-scrollbar{display:none}
#svis{position:absolute;left:calc(min(500px,35vw) + 60px);right:14px;top:20px;bottom:86px;
  pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;perspective:1400px}
#svis .vin{width:100%;height:100%;position:relative;display:flex;flex-direction:column;justify-content:center;
  transition:transform .25s ease-out;transform-style:preserve-3d;will-change:transform}


#svis #liveFig{flex:1;min-height:320px}
#svis .fcap{margin-top:10px;font-size:10.6px;line-height:1.6;color:var(--dim);max-width:820px;align-self:center}
#svis .fcap b{color:var(--ink2)}
.stIn{animation:stIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes stIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.vIn{animation:vIn .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes vIn{from{opacity:0;transform:translateY(14px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
svg.xdim [data-hl]{opacity:.28;transition:opacity .16s}
svg.xdim [data-hl].xhl{opacity:1;filter:drop-shadow(0 0 8px rgba(46,200,245,.9))}
tr[data-x]{cursor:crosshair}
tr[data-x]:hover td{background:rgba(46,200,245,.07)}
tr[data-x]:hover td:first-child{box-shadow:inset 2px 0 0 #2ec8f5}
.lvflash{animation:lvf 1s}
@keyframes lvf{0%{filter:drop-shadow(0 0 14px rgba(46,200,245,.55))}100%{filter:none}}
/* the single status band: speak · activity · telemetry · panels — one glance */
#band{position:absolute;left:calc(min(460px,32vw) + 52px);right:16px;bottom:12px;height:52px;pointer-events:auto;
  display:flex;align-items:center;gap:22px;border-top:1px solid rgba(150,200,240,.3);padding-top:8px}
#bandAct{flex:1;min-width:0;font-family:var(--m);font-size:8.4px;letter-spacing:.04em;color:var(--calc);cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bandAct .at{color:var(--dim);margin-right:7px}
#bandAct.hot{color:var(--ev)}
#bandAct:before{content:'◉ ';color:var(--ev)}
#bandTel{display:flex;gap:16px;font-family:var(--m);font-size:8.4px;color:var(--ink2);cursor:pointer;flex:none}
#bandTel b{color:var(--ink);font-weight:650}
#bandTel .bad b{color:var(--bad)}#bandTel .ok b{color:var(--ok)}
#bandBtn{flex:none;background:none;border:0;border-bottom:1px solid rgba(150,200,240,.4);cursor:pointer;
  font-size:7.6px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--ink2);padding:3px 1px}
#bandBtn:hover{color:var(--ev);border-color:var(--ev)}
#bandMenu{position:absolute;right:0;bottom:56px;display:none;flex-direction:column;gap:6px;align-items:flex-end;
  background:rgba(13,30,52,.8);backdrop-filter:blur(18px);border-radius:12px;padding:12px 14px;
  box-shadow:0 18px 48px -20px rgba(10,30,60,.5)}
#bandMenu.on{display:flex}
.sec{pointer-events:auto;background:none;border:0;padding:6px 2px 18px;margin-bottom:10px}
.sec>.sh3{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;border-bottom:1px solid rgba(150,200,240,.25);padding-bottom:6px}
.sec>.sh3 .st3{font-size:8px;letter-spacing:.26em;font-weight:800;color:var(--dim);text-transform:uppercase}
.sec>.sh3 .sl3{font-family:var(--m);font-size:7px;color:var(--ev);letter-spacing:.1em}
.sec h2{margin:0 0 6px;font-weight:420;font-size:19.5px;line-height:1.45;color:#eef7ff}
.sec p{margin:6px 0;font-size:12.3px;line-height:1.75;color:var(--ink2)}
.sec p b{color:var(--ink);font-weight:650}
.sec .fig{border:0;background:none;padding:0;margin:12px 0;position:relative}
.sec .fig svg{display:block;width:100%;height:auto}
.sec .fig .fcap{margin-top:7px;font-size:10.3px;line-height:1.6;color:var(--dim);padding:0 3px}
.sec .fig .fcap b{color:var(--ink2)}
#liveFig{height:440px;border-radius:8px;background:transparent;position:relative;pointer-events:none}
.sec.figsec .fig{background:transparent}

    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.warn(gl.getShaderInfoLog(s));return null;}return s;};

  const t=(now-GL.t0)/1000;

  ctx.beginPath();ctx.rect((FIG.x-FIG.ox)/FIG.s,(FIG.y-FIG.oy)/FIG.s,FIG.w/FIG.s,FIG.h/FIG.s);ctx.clip();

  for(let i=World.objs.length-1;i>=0;i--){

    if(!o.dragging){o.x+=(o.tx-o.x)*0.09;o.y+=(o.ty-o.y)*0.09;}
    o.a+=(o.ta-o.a)*0.08;if(o.dead)o.a*=Math.exp(-7*dt);o.s+=(o.tsc-o.s)*0.1;
    if(o.dead&&o.a<0.02)World.objs.splice(i,1);
  }
  if(FIG.ok&&S.phase==='live'&&MODES_IMPL[S.mode]&&MODES_IMPL[S.mode].draw)MODES_IMPL[S.mode].draw(dt);
  if(FIG.ok)for(const o of World.objs){

  }

  if(/obvious|clearly|certain|definitely|no doubt|must be|surely/.test(t))
    add('bad','OVERCONFIDENCE','Certainty asserted without an admitted test — the referee simulator flags exactly this phrasing.');
  if(/x-?ray|flare|chandra|archiv/.test(t))
    add('ev',S.xmatchRun?'EVIDENCE — RESOLVED':'OMITTED EVIDENCE',S.xmatchRun?'The cross-match is executed: r = 0.04 ± 0.09 — no flare–EVPA correlation.':'34 archival flares overlap six epochs. The cross-match is free and decisive against eruptions.');
  if(/eruption|flux|reorgani/.test(t))

  if(/heating|beta|electron|βi/.test(t))

  if(/calibra|leakage|systematic|instrument/.test(t))

    const atEnd=tx.scrollTop+tx.clientHeight>=tx.scrollHeight-4;
    const atTop=tx.scrollTop<=2;
    if((e.deltaY>0&&!atEnd)||(e.deltaY<0&&!atTop))return;
  }
  const now=performance.now();
  if(now-wheelT<650)return;
  if(Math.abs(e.deltaY)<12)return;
  wheelT=now;
  goStation(e.deltaY>0?1:-1);
},{passive:true});
addEventListener('keydown',e=>{
  if(S.phase!=='live')return;
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
  if(e.key==='ArrowDown'||e.key==='PageDown'){goStation(1);e.preventDefault();}
  if(e.key==='ArrowUp'||e.key==='PageUp'){goStation(-1);e.preventDefault();}
});



/* ============================================================================
   Interrogation engine — ask the operating system a scientific question,
   get a computed, ranked, sourced answer. Wired into the speak bar and
   the command aperture.
   ========================================================================== */
function famScores(){
  const labGone=S.droplab||S.removed.lab;
  return [
   {n:'MAD · laboratory-informed heating',s:labGone?0.30:(S.asm.heating>0.5?0.88:0.80),
    b:labGone?'mapping absent — the widened prior has no physical basis':'containment '+(S.asm.heating>0.5?'9/9 (re-run preview)':'restorable 9/9')+' · m_L consistent · ring consistent',
    req:'laboratory mapping (unreplicated)'},
   {n:'MAD + variable-screen hybrid',s:S.asm.screen==='variable'?0.62:0.34,
    b:'contains the trajectory only if the screen absorbs the residual',req:'sub-0.1 pc screen structure (literature-contested)'},
   {n:'MAD · R_high = 40 (inherited)',s:0.12,b:'containment 0/3 — excluded by the revised trajectory',req:'—'},
   {n:'SANE · any heating',s:0.08,b:'fractional polarisation overproduced ×2.3 — excluded',req:'—'},
   {n:'MAD · inclination > 45°',s:0.05,b:'photon-ring asymmetry violated — excluded',req:'—'}
  ].sort((a,b)=>b.s-a.s);
}
function answerCard(title,rows,basis,actions){
  inspect('<div class="chips">'+chip('calc','computed now')+chip('clm','ranked answer')+'</div>'+
   '<div class="rows">'+rows.map((r,i)=>irow('#'+(i+1),'<b>'+r[0]+'</b>'+(r[1]!==null?ibar(r[1],C.clm):'')+'<span style="font-size:9.6px;color:var(--dim)">'+r[2]+'</span>')).join('')+
   irow('Basis',basis)+'</div>'+
   (actions?'<div class="acts">'+actions+'</div>':''));
  inspTitle(title);
  postEvent('query answered — '+title.toLowerCase(),'hot');
}
const QUERIES=[
 {label:'which model family fits the data best',k:/(model )?famil|family fits|which model(?! famil)? fits|fits (the data )?best/,
  run:()=>{const F=famScores();
   answerCard('Best-fitting model family',
    F.map(f=>[f.n,f.s,f.b+' · requires: '+f.req]),
    'All families scored against identical constraints: revised trajectory containment, fractional polarisation, photon-ring asymmetry — recomputed under your current assumption set.',
    '<button class="abtn sm" data-act="sub:model:default">Physical model</button><button class="abtn sm" data-act="sub:model:sens">Error budget</button>');}},
 {label:'which experiment should I run next',k:/which experiment|next experiment|best (test|observation)|what should i (run|observe|do next)/,
  run:()=>{const E=experiments();
   answerCard('Next experiment — ranked by volume elimination',
    E.map(x=>[x.n,x.p,x.c+' · '+x.tag]),
    '2,400-draw Monte-Carlo over the retained volume under the current assumptions; the order inverts if the screen is released.',
    '<button class="abtn sm" data-act="sub:analyze:pareto">Cost–yield frontier</button><button class="abtn sm" data-act="budget:zero">Best free option</button>');}},
 {label:'which assumption is weakest',k:/weakest assumption|which assumption|most (dangerous|influential) assumption/,
  run:()=>{answerCard('Weakest assumption',
    [['Electron-heating prescription',0.83,'83 % failing-axis variance · 4 downstream claims · unmeasured until S-044'],
     ['Static foreground screen',0.34,'3 dependents · literature-contested (D21, 4.0σ) · bounded at 0.1 pc only']],
    'Score = variance share × downstream load ÷ independent support.',
    '<button class="abtn sm" data-act="sub:model:graph">Dependency graph</button><button class="abtn sm" data-act="asm:screen">Release the screen</button>');}},
 {label:'which paper contradicts my assumptions',k:/which (paper|source)|literature.*(contradict|disagree)|contradict.*(paper|literature|source)/,
  run:()=>{const lit=litAgreement();
   answerCard('Literature contradictions standing',
    lit.conflicts.map(c2=>[c2.label,Math.min(1,c2.t/5),c2.detail]),
    PAPERS.length+' sources · '+lit.pairs+' pairwise comparisons in σ units · your S-097 screen premise inherits the D21 dispute.',
    '<button class="abtn sm" data-act="sub:watch:lit">Agreement instrument</button>');}},
 {label:'which explanation covers the evidence best',k:/which (hypothesis|explanation|configuration)|explains? (the )?(evidence|drift) best/,
  run:()=>{const r=ranked();
   answerCard('Explanation ranking — evidence coverage',
    r.map(h=>[h.full,h.s,'explains '+h.ex.length+' · conflicts '+h.fx.length+' · requires '+h.rq.length+' assumptions · '+h.rep]),
    'Coverage weighted 1/σ², penalised ×0.8 per unmeasured assumption. Recomputed live.',
    '<button class="abtn sm" data-act="sub:analyze:hyps">Evidence landscape</button>');}},
 {label:'cross-analyse the flares against the epochs',k:/cross.?(anal|match)|flare.*epoch|epoch.*flare|x.?ray.*polar/,
  run:()=>{const was=S.xmatchRun;
   if(!S.xmatchRun){S.xmatchRun=true;consistency();renderIntel();}
   answerCard(was?'Cross-analysis (on record)':'Cross-analysis executed now',
    [['flare–EVPA correlation',0.04,'r = 0.04 ± 0.09 across 6 covariance windows — consistent with zero'],
     ['eruption configuration',HYPS[1].s,'demoted to '+(HYPS[1].s*100).toFixed(0)+'% — its predicted signature is absent'],
     ['leading claim',ranked()[0].s,'predicted this null and obtained it']],
    '34 archival flares · 14 catalogues · barycentric alignment · zero observing cost.',
    '<button class="abtn sm" data-act="sub:analyze:hyps">Recomputed ranking</button>');}},
 {label:'what happens if the screen assumption is released',k:/what (if|happens).*screen|release.*screen.*(what|effect)/,
  run:()=>{const cur=covIf(S.asm.screen==='variable'),alt=covIf(S.asm.screen!=='variable');
   answerCard('Counterfactual — screen '+(S.asm.screen==='static'?'released':'restored'),
    [['heating coverage',alt[0],(cur[0]*100).toFixed(0)+'% → '+(alt[0]*100).toFixed(0)+'%'],
     ['eruption coverage',alt[1],(cur[1]*100).toFixed(0)+'% → '+(alt[1]*100).toFixed(0)+'%'],
     ['screen coverage',alt[2],(cur[2]*100).toFixed(0)+'% → '+(alt[2]*100).toFixed(0)+'%']],
    'Full graph recompute under the flipped premise — parameter-volume survival moves '+(S.asm.screen==='static'?'18% → 9%':'9% → 18%')+'.',
    '<button class="abtn sm" data-act="asm:screen">Apply it</button>');}}
];
function runQuery(text){
  const t=text.toLowerCase();
  for(const q of QUERIES)if(q.k.test(t)){q.run();return true;}
  const m=t.match(/(?:search|find|look ?up)\s+(?:for\s+)?(.+)/);
  if(m){
    const term=m[1].trim();
    const hits=[];
    DATASETS.forEach(d=>{if((d.n+d.role+d.src).toLowerCase().includes(term))hits.push(['dataset',d.n,d.role]);});
    PAPERS.forEach(p=>{if((p.label+p.method).toLowerCase().includes(term))hits.push(['paper',p.label,p.method+' · '+p.v+'±'+p.sig]);});
    HYPS.forEach(h2=>{if((h2.full+h2.d).toLowerCase().includes(term))hits.push(['hypothesis',h2.full,(h2.s*100).toFixed(0)+'% coverage']);});
    MEM.forEach(m2=>{if((m2.b+m2.a).toLowerCase().includes(term))hits.push(['memory','S-'+String(m2.d).padStart(3,'0')+' · '+m2.b,m2.w]);});
    EVENTS.forEach(ev=>{if((ev.t+ev.res).toLowerCase().includes(term))hits.push(['change',ev.t,ev.res]);});
    SOURCEDB.forEach(f=>{if((f[0]+' '+f[1]).toLowerCase().includes(term))hits.push(['feed',f[0],f[2].toLocaleString('en-US')+' records this cycle · '+f[3]]);});
    inspect('<div class="chips">'+chip('calc','corpus search')+chip('ev',hits.length+' hits')+'</div>'+
     '<div class="rows">'+(hits.length?hits.slice(0,8).map(h2=>irow(h2[0],'<b>'+h2[1]+'</b><br><span style="font-size:9.6px;color:var(--dim)">'+h2[2]+'</span>')).join(''):irow('Result','nothing in the active model matches “'+esc2(term)+'” — the perimeter continues watching for it'))+'</div>');
    inspTitle('Search — “'+esc2(term)+'”');
    postEvent('corpus search — “'+term+'” · '+hits.length+' hits','hot');
    return true;
  }
  return false;
}

const CSEQ=[
 ['Reconstructing the research problem','217 source families · 146 datasets normalized',0.15],
 ['Assembling the physical system','shadow · photon ring · flow · field geometry',0.35],

$('#go').addEventListener('click',()=>{
  if(S.phase!=='onb')return;S.phase='construct';
  const onb=$('#onb');onb.style.opacity=0;onb.style.filter='blur(8px)';onb.style.pointerEvents='none';
  setTimeout(()=>onb.remove(),1200);
  const cons=$('#cons');cons.classList.add('on');cons.style.opacity=1;
  const cl=$('#cline'),ct=$('#ctick'),cb=$('#cbar');
  let i=0;const stepMs=RM?400:1400;
  function nx(){
    if(i>=CSEQ.length){
      cons.style.opacity=0;cons.style.transition='opacity .8s';setTimeout(()=>cons.remove(),900);
      S.phase='live';$('#chrome').classList.add('on');
      renderDock();nav('watch');
      return;
    }
    const q=CSEQ[i];
    cl.classList.remove('on');ct.classList.remove('on');
    setTimeout(()=>{cl.textContent=q[0];ct.textContent=q[1];cb.style.width=(q[2]*100)+'%';
      cl.classList.add('on');ct.classList.add('on');},300);
    i++;setTimeout(nx,stepMs);
  }
  nx();
});
$('#ta').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#go').click();}});
