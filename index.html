<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PARALLAX — Scientific Operating System</title>
<style>
/* ============================================================
   PARALLAX V4 — scientific operating system
   One live workspace. Six instruments. No pages.
   Provenance: cyan measured · navy calculated · amber assumed ·
   violet proposed · graphite claim.
   ============================================================ */
:root{
  --ev:#0090c4; --calc:#2a4a6c; --asm:#a85e08; --hyp:#6d34c4; --clm:#16202f;
  --ink:#0d2236; --ink2:#24425c; --dim:#4d6a84;
  --line:rgba(13,40,70,.16); --line2:rgba(13,40,70,.3);
  --surf:rgba(252,254,255,.88);
  --ok:#1b7d4f; --bad:#b03636;
  --f:'Inter','SF Pro Display','Helvetica Neue',system-ui,sans-serif;
  --m:ui-monospace,'SF Mono','JetBrains Mono',Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:var(--f);color:var(--ink);
  background:
    radial-gradient(120% 90% at 66% 30%, rgba(240,249,255,.85) 0%, rgba(214,233,247,.5) 34%, rgba(214,233,247,0) 68%),
    radial-gradient(90% 80% at 12% 92%, rgba(168,198,228,.8) 0%, rgba(168,198,228,0) 60%),
    radial-gradient(80% 70% at 90% 6%, rgba(198,232,244,.8) 0%, rgba(198,232,244,0) 55%),
    linear-gradient(180deg,#8fb6d6 0%,#a9c9e2 44%,#c3dcef 100%);
  -webkit-font-smoothing:antialiased;user-select:none;
}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.22;mix-blend-mode:multiply;
  background-image:radial-gradient(rgba(20,50,90,.06) .5px,transparent .6px);background-size:3px 3px;z-index:3}
button{font-family:var(--f)}
canvas{display:block}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:1;opacity:0;transition:opacity .9s;background:#03070e;pointer-events:none}
#gl.on{opacity:1}
#stage{position:fixed;inset:0;z-index:4;touch-action:none}
.vig{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(120% 100% at 50% 45%, rgba(10,30,60,0) 55%, rgba(10,30,60,.16) 100%)}

/* ------- chrome (kept minimal — the stage is the interface) ------- */
#chrome{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity 1s}
#chrome.on{opacity:1}
#brand{position:absolute;top:16px;left:22px;pointer-events:auto}
#brand .p{font-size:13px;letter-spacing:.46em;font-weight:600;color:#0a1c30}
#brand .sim{display:inline-block;margin-left:10px;font-family:var(--m);font-size:7px;letter-spacing:.16em;
  color:var(--asm);border:1px dashed rgba(168,94,8,.55);padding:2px 6px;border-radius:3px;vertical-align:2px}
#brand.dark .p{color:#e8f3fb;text-shadow:0 1px 10px rgba(0,0,0,.5)}
#dock{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:2px;pointer-events:auto;
  background:rgba(250,253,255,.72);border:1px solid var(--line2);border-radius:10px;padding:4px;
  backdrop-filter:blur(12px);box-shadow:0 8px 30px -14px rgba(10,30,60,.4)}
.dk{background:none;border:0;border-radius:7px;padding:8px 14px;cursor:pointer;text-align:center}
.dk .n{font-size:9.5px;letter-spacing:.22em;font-weight:800;color:var(--ink2);text-transform:uppercase}
.dk .d{margin-top:2px;font-size:7.5px;letter-spacing:.06em;color:var(--dim);white-space:nowrap}
.dk:hover{background:rgba(255,255,255,.75)}
.dk.on{background:#13293f}
.dk.on .n{color:#eaf4fb}.dk.on .d{color:#8fb4cf}
.dk .badge{display:inline-block;font-family:var(--m);font-size:7px;color:#fff;background:var(--ev);
  border-radius:6px;padding:0 4px;margin-left:4px;vertical-align:2px}
#cmdHint{position:absolute;top:18px;right:22px;pointer-events:auto;background:rgba(250,253,255,.72);
  border:1px solid var(--line2);border-radius:8px;padding:8px 12px;cursor:pointer;
  font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;color:var(--ink)}
#cmdHint b{font-family:var(--m);font-weight:400;color:var(--ev);margin-left:6px}

/* live model vitals — always present: the model never sleeps */
#vitals{position:absolute;left:22px;bottom:18px;pointer-events:auto;display:flex;flex-direction:column;gap:7px;
  background:rgba(250,253,255,.78);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;
  backdrop-filter:blur(10px);min-width:250px;box-shadow:0 8px 30px -16px rgba(10,30,60,.4)}
#vitals .vh{display:flex;justify-content:space-between;align-items:center}
#vitals .vh .t{font-size:8px;letter-spacing:.26em;font-weight:800;color:var(--ink2);text-transform:uppercase}
#vitals .vh .live{display:flex;align-items:center;gap:5px;font-family:var(--m);font-size:7.5px;color:var(--ev)}
#vitals .vh .live i{width:5px;height:5px;border-radius:50%;background:var(--ev);box-shadow:0 0 7px rgba(0,144,196,.9);animation:bl 2.8s infinite}
@keyframes bl{0%,100%{opacity:.35}50%{opacity:1}}
.vrow{display:flex;align-items:center;gap:8px}
.vrow .k{width:86px;font-size:8px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--dim)}
.vrow .b{flex:1;height:4px;border-radius:2px;background:rgba(13,40,70,.12);overflow:hidden}
.vrow .b i{display:block;height:100%;border-radius:2px;transition:width .7s cubic-bezier(.2,.7,.2,1)}
.vrow .v{font-family:var(--m);font-size:8.5px;color:var(--ink2);min-width:72px;text-align:right}
#vitals .note{font-family:var(--m);font-size:7.5px;color:var(--dim);letter-spacing:.06em}

/* per-mode instrument controls (bottom center) */
#ctl{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;
  pointer-events:auto;flex-wrap:wrap;justify-content:center;max-width:74vw}
.cchip{background:rgba(250,253,255,.78);border:1px solid var(--line2);border-radius:8px;padding:8px 12px;cursor:pointer;
  font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--ink2);backdrop-filter:blur(8px)}
.cchip:hover{background:#fff}
.cchip.on{background:#13293f;color:#eaf4fb;border-color:#13293f}
.cchip.acc{border-color:rgba(0,144,196,.6);color:var(--ev)}
.cslider{display:flex;align-items:center;gap:9px;background:rgba(250,253,255,.78);border:1px solid var(--line2);
  border-radius:8px;padding:7px 12px;backdrop-filter:blur(8px)}
.cslider label{font-size:8px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--asm)}
.cslider input{width:130px;accent-color:#a85e08}
.cslider .rv{font-family:var(--m);font-size:8.5px;color:var(--ink2);min-width:60px}
#ctl .dark{background:rgba(10,22,36,.7);color:#c9dfee;border-color:rgba(159,192,216,.35)}
#ctl .dark.on{background:rgba(0,144,196,.3);border-color:rgba(0,190,255,.7);color:#eaf9ff}

/* inspector — progressive disclosure card, never a wall of text */
#insp{position:absolute;top:70px;right:22px;width:330px;max-height:calc(100% - 160px);overflow-y:auto;
  pointer-events:auto;background:rgba(252,254,255,.92);border:1px solid var(--line2);border-radius:12px;
  padding:14px 16px;backdrop-filter:blur(14px);box-shadow:0 18px 50px -20px rgba(10,30,60,.5);
  transform:translateX(16px);opacity:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s;scrollbar-width:thin}
#insp.on{transform:none;opacity:1}
#insp .ih{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#insp .ih .t{font-size:13px;font-weight:700;color:#0a1c30;line-height:1.4}
#insp .ih .x{background:none;border:0;cursor:pointer;color:var(--dim);font-size:14px;padding:2px 4px}
#insp .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{display:inline-flex;align-items:center;font-family:var(--m);font-size:7.5px;letter-spacing:.14em;
  text-transform:uppercase;padding:2px 7px;border:1px solid;border-radius:3px;white-space:nowrap}
.chip.ev{color:var(--ev);border-color:rgba(0,144,196,.5);background:rgba(0,144,196,.06)}
.chip.calc{color:var(--calc);border-color:rgba(42,74,108,.5);background:rgba(42,74,108,.06)}
.chip.asm{color:var(--asm);border-color:rgba(168,94,8,.5);background:rgba(168,94,8,.07)}
.chip.hyp{color:var(--hyp);border-color:rgba(109,52,196,.5);background:rgba(109,52,196,.06)}
.chip.clm{color:var(--clm);border-color:rgba(22,32,47,.55);background:rgba(255,255,255,.65)}
.chip.ok{color:var(--ok);border-color:rgba(27,125,79,.5);background:rgba(27,125,79,.06)}
.chip.bad{color:var(--bad);border-color:rgba(176,54,54,.5);background:rgba(176,54,54,.06)}
#insp .rows{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.irow{display:flex;gap:8px;font-size:10.8px;line-height:1.5;color:var(--ink2)}
.irow .ik{flex:none;width:88px;font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--dim);padding-top:2px}
.irow b{color:var(--ink);font-weight:650}
.ibar{display:flex;align-items:center;gap:7px}
.ibar .b{flex:1;height:4px;border-radius:2px;background:rgba(13,40,70,.12);overflow:hidden}
.ibar .b i{display:block;height:100%;border-radius:2px}
.ibar .v{font-family:var(--m);font-size:8px;color:var(--ink2)}
#insp details{margin-top:9px;border-top:1px solid var(--line);padding-top:8px}
#insp summary{cursor:pointer;font-size:8px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--ink2);list-style:none}
#insp summary::before{content:'▸ ';color:var(--ev)}
#insp details[open] summary::before{content:'▾ '}
#insp details .db{margin-top:7px;font-size:10.6px;line-height:1.65;color:var(--ink2)}
.mini{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.mini .m{display:flex;gap:7px;align-items:baseline;font-size:10.2px;line-height:1.45;color:var(--ink2)}
.mini .m .n{flex:none;font-family:var(--m);font-size:7.5px;color:#fff;border-radius:50%;width:14px;height:14px;
  display:inline-flex;align-items:center;justify-content:center}
#insp .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.abtn{background:var(--surf);border:1px solid var(--line2);border-radius:6px;padding:6px 10px;cursor:pointer;
  font-size:8px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--ink)}
.abtn:hover{background:#fff;border-color:rgba(13,40,70,.45)}
.abtn.pri{background:#13293f;border-color:#13293f;color:#eaf4fb}
.abtn.warn{color:var(--bad);border-color:rgba(176,54,54,.45)}

/* hint line above ctl */
#hint{position:absolute;left:50%;top:64px;transform:translateX(-50%);pointer-events:none;
  font-family:var(--m);font-size:8.5px;letter-spacing:.18em;color:var(--ink2);text-transform:uppercase;
  background:rgba(250,253,255,.6);padding:5px 12px;border-radius:6px;opacity:0;transition:opacity .5s;white-space:nowrap}
#hint.on{opacity:1}
#hint.dark{background:rgba(10,22,36,.6);color:#9fc0d8}

/* briefing overlay card */
#brief{position:absolute;top:76px;left:22px;width:360px;pointer-events:auto;background:rgba(252,254,255,.94);
  border:1px solid var(--line2);border-radius:12px;padding:16px 18px;backdrop-filter:blur(14px);
  box-shadow:0 18px 50px -20px rgba(10,30,60,.5);display:none}
#brief.on{display:block;animation:slidein .5s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#brief .eb{font-size:7.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:800;color:var(--ev)}
#brief h1{margin:7px 0 0;font-size:14.5px;font-weight:700;line-height:1.5;color:#0a1c30}
#brief .why{margin-top:8px;font-size:11px;line-height:1.65;color:var(--ink2)}
#brief .act{margin-top:9px;border-left:3px solid var(--clm);padding:6px 10px;background:rgba(255,255,255,.7);
  font-size:10.6px;line-height:1.6;color:var(--ink);font-weight:520}
#brief .stats{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
#brief .bacts{display:flex;gap:6px;margin-top:11px}

/* command aperture */
#ap{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;
  background:rgba(180,208,230,.45);backdrop-filter:blur(12px)}
#ap.on{display:flex}
#apBox{margin-top:14vh;width:min(700px,90vw)}
#apBox .lbl{font-size:8.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink2);font-weight:800}
#apIn{width:100%;margin-top:12px;background:transparent;border:0;outline:0;color:#0a1c30;
  font-family:var(--f);font-weight:300;font-size:clamp(16px,2.2vw,22px);padding:0 0 12px}
#apIn::placeholder{color:#5d7a94}
#apRule{height:1px;background:linear-gradient(90deg,rgba(0,144,196,.9),rgba(13,40,70,.1))}
#apSug{margin-top:14px;max-height:46vh;overflow-y:auto;border-radius:8px;scrollbar-width:none}
.sug{display:flex;gap:10px;width:100%;text-align:left;background:rgba(252,254,255,.65);border:0;
  border-bottom:1px solid var(--line);padding:10px 13px;cursor:pointer;font-size:12px;color:var(--ink);align-items:baseline}
.sug:hover,.sug.sel{background:rgba(255,255,255,.95)}
.sug .pfx{font-family:var(--m);font-size:9px;color:var(--ev)}
.sug .where{margin-left:auto;font-family:var(--m);font-size:7.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}

/* onboarding + construction */
#onb{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 1.1s cubic-bezier(.2,.7,.2,1),filter 1.1s}
#onb h1{font-size:clamp(34px,7vw,72px);font-weight:200;letter-spacing:.42em;margin:0 0 0 .42em;color:#0a1c30;text-shadow:0 1px 0 rgba(255,255,255,.6)}
#onb .sub{margin-top:16px;font-size:13px;color:#2c4a63;text-align:center;padding:0 20px;max-width:600px;line-height:1.8}
#field{margin-top:46px;width:min(720px,86vw)}
#field .q{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;font-weight:800}
#field textarea{width:100%;height:68px;resize:none;background:transparent;border:0;outline:0;color:#0d2236;
  font-family:var(--f);font-weight:300;font-size:clamp(14px,1.9vw,19px);line-height:1.6;padding:0 0 12px}
#field textarea::placeholder{color:#6d89a2}
#field .rule{height:1px;background:linear-gradient(90deg,rgba(13,40,70,.6),rgba(13,40,70,.08))}
#go{margin-top:32px;background:#13293f;border:0;border-radius:8px;cursor:pointer;color:#eaf4fb;
  font-size:10px;letter-spacing:.3em;text-transform:uppercase;padding:14px 28px;font-weight:800}
#go:hover{background:#1b3a5a}
#cons{position:fixed;inset:0;z-index:75;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#cons.on{display:flex}
#cons .line{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:#12304e;font-weight:800;
  opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s;text-align:center;padding:0 16px}
#cons .line.on{opacity:1;transform:none}
#cons .tick{margin-top:12px;font-family:var(--m);font-size:8px;letter-spacing:.2em;color:var(--dim);opacity:0;transition:opacity .5s}
#cons .tick.on{opacity:1}
#cons .pb{margin-top:30px;width:min(400px,70vw);height:2px;background:rgba(13,40,70,.14);border-radius:1px;overflow:hidden}
#cons .pb i{display:block;height:100%;background:var(--ev);width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}

@media(max-width:900px){
  #dock{top:auto;bottom:12px;max-width:96vw;overflow-x:auto}
  .dk{padding:7px 9px}.dk .d{display:none}
  #ctl{bottom:74px;max-width:94vw}
  #hint{bottom:120px}
  #vitals{display:none}
  #insp{width:min(330px,92vw);top:56px}
  #brief{width:min(360px,92vw)}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.05s!important}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="vig"></div>
<div id="grain"></div>
<canvas id="stage"></canvas>

<div id="chrome">
  <div id="brand"><span class="p">PARALLAX</span><span class="sim">SIMULATED SCENARIO</span></div>
  <div id="dock"></div>
  <button id="cmdHint">Command<b>/</b></button>
  <div id="vitals"></div>
  <div id="ctl"></div>
  <div id="hint"></div>
  <div id="insp"></div>
  <div id="brief"></div>
</div>

<div id="ap">
  <div id="apBox">
    <div class="lbl">Address the system</div>
    <input id="apIn" placeholder="Parallax, …" autocomplete="off" spellcheck="false">
    <div id="apRule"></div>
    <div id="apSug"></div>
  </div>
</div>

<div id="onb">
  <h1>PARALLAX</h1>
  <div class="sub">A scientific operating system. You do not read about the physics here —
  you manipulate the live research model directly, and every structure recomputes as you touch it.</div>
  <div id="field">
    <div class="q">What are you working on?</div>
    <textarea id="ta" spellcheck="false" placeholder="I study black-hole accretion, magnetic-field behaviour and polarisation variability around Sagittarius A*."></textarea>
    <div class="rule"></div>
  </div>
  <button id="go">Construct live model</button>
</div>
<div id="cons"><div class="line" id="cline"></div><div class="tick" id="ctick"></div><div class="pb"><i id="cbar"></i></div></div>
<script>
'use strict';
/* ============================================================================
   Part 2: scientific data model (engine unchanged from V3 — the redesign is
   the interaction layer). Every number here is recomputed on interaction.
   ========================================================================== */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU=Math.PI*2;
const C={ev:'#0090c4',calc:'#2a4a6c',asm:'#a85e08',hyp:'#6d34c4',clm:'#16202f',ok:'#1b7d4f',bad:'#b03636',dim:'#4d6a84',ink:'#0d2236',ink2:'#24425c'};
const chip=(p,l)=>'<span class="chip '+p+'">'+(l||{ev:'measured',calc:'calculated',asm:'assumed',hyp:'proposed',clm:'claim'}[p])+'</span>';

const S={
  phase:'onb', mode:'watch',
  asm:{screen:'static', heating:0},            /* heating: 0..1 continuous prior width */
  removed:{}, droplab:false, xmatchRun:false,
  memoryLive:false, scrubDay:0,                /* memory scrub position (S-day, 300→0) */
  attached:new Set(), audited:false,
  spoken:0, yaw:0, zoom:1, briefSeen:false,
  counters:{rec:18420, fam:217, mat:4}
};
const HYPS=[
 {id:'heating',n:'Electron heating extended',full:'Underestimated electron-heating range',s:0,
  d:'Heating partition reaches R ≳ 8 near βi ≈ 1; the emission region migrates outward, producing the drift intrinsically.',
  ex:['monotonic 9-epoch drift','stable m_L 4.2 %','flat magnetar sightline'],
  fx:['none — if the laboratory mapping holds'],
  rq:['static foreground screen','lab ↔ simulation mapping'],
  pr:'Drift scales 230→345 GHz in fixed ratio; magnetar stays flat.',
  ct:'Correlated magnetar RM excursion, or failed frequency scaling.',
  disc:'Simultaneous 230/345 GHz EVPA + magnetar RM (21 d).',
  rep:'unreplicated lab mapping'},
 {id:'erupt',n:'Magnetic-flux eruptions',full:'Intrinsic magnetic-flux eruptions',s:0,
  d:'MAD flux eruptions reorganise the field on ~10² gravitational times, driving stochastic excursions.',
  ex:['variability amplitude','MAD-state flux record'],
  fx:['monotonic drift — eruptions predict stochastic excursions'],
  rq:['eruption duty cycle in retained volume'],
  pr:'EVPA excursions locked to X-ray flare timing.',
  ct:'Zero flare–EVPA correlation in the archival cross-match.',
  disc:'Archival Chandra cross-match — zero observing cost.',
  rep:'2 GRMHD codes'},
 {id:'screen',n:'Variable Faraday screen',full:'Temporally variable foreground screen',s:0,
  d:'A rotation-measure screen varying on ≤ 30-day scales produces the drift with no accretion physics.',
  ex:['the drift itself'],
  fx:['flat magnetar sightline 0.1 pc away','stable m_L'],
  rq:['sub-0.1 pc screen structure','release of static-screen assumption'],
  pr:'Equivalent RM drift on any nearby second sightline.',
  ct:'A second flat sightline inside 0.05 pc.',
  disc:'Dense 7-day magnetar RM cadence.',
  rep:'1 control sightline ×2 programmes'}
];
/* evidence ↔ hypothesis structural matrix: 1 supports · -1 conflicts · 0 silent */
const EVMAT={heating:{alma:1,mag:1,lab:1,xray:0},erupt:{alma:-1,mag:0,lab:0,xray:1},screen:{alma:1,mag:-1,lab:0,xray:0}};
function consistency(){
  const f=S.asm.screen==='variable'?1:0, h=S.asm.heating;
  const dl=(S.droplab||S.removed.lab)?0.28:0, xm=S.xmatchRun?0.24:0;
  const gone=id=>S.removed[id]?1:0;
  HYPS[0].s=clamp((0.61-0.20*f+0.14*h-dl)*(gone('alma')?0.3:1)*(gone('mag')?0.85:1),0.05,0.95);

    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.warn(gl.getShaderInfoLog(s));return null;}return s;};

  const pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){GL.ok=false;return false;}

stage.addEventListener('pointermove',e=>{

/* ------- master loop ------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;World.t+=dt;
  const t=(now-GL.t0)/1000;
  glFrame(t);
  ctx.clearRect(0,0,SW,SH);
  /* ease objects */
  for(let i=World.objs.length-1;i>=0;i--){
    const o=World.objs[i];
    if(!o.dragging){o.x+=(o.tx-o.x)*0.09;o.y+=(o.ty-o.y)*0.09;}
    o.a+=(o.ta-o.a)*0.08;if(o.dead)o.a*=Math.exp(-7*dt);o.s+=(o.tsc-o.s)*0.1;
    if(o.dead&&o.a<0.02)World.objs.splice(i,1);
  }
  if(S.phase==='live'&&MODES_IMPL[S.mode]&&MODES_IMPL[S.mode].draw)MODES_IMPL[S.mode].draw(dt);
  /* draw objects */
  for(const o of World.objs){
    if(o.a<0.02)continue;
    ctx.save();ctx.globalAlpha=o.a;
    DRAW[o.kind]&&DRAW[o.kind](o);
    ctx.restore();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

  const words=t.split(' '),lines=[];let cur='';
  words.forEach(w=>{if((cur+' '+w).trim().length>maxChars){lines.push(cur.trim());cur=w;}else cur+=' '+w;});
  if(cur.trim())lines.push(cur.trim());return lines;
}

   if(instant){o.a=1;o.ta=1;}
   this.restack();
 },
 restack(){
   const sts=World.objs.filter(o=>o.kind==='stmt'&&!o.dead).sort((a,b)=>a.i-b.i);
   let y=SH*0.62;
   for(let k=sts.length-1;k>=0;k--){const o=sts[k];o.ty=y-o.hitH/2;y-=o.hitH+18;}
 },
 draw(){
   /* arcs from tags to anchors */
   const anM=findObj('an_model'),anR=findObj('an_mem'),anE=findObj('an_ev');
   World.objs.forEach(o=>{
     if(o.kind!=='stmt'||o.dead)return;
     o.tags.forEach((tg,ti)=>{
       const sx=o.x+o.hitW/2+10+tg[3],sy=o.y-o.hitH/2+10+ti*17;
       const an=tg[0]==='ev'?anE:tg[0]==='asm'?(o.i===5?anR:anM):tg[0]==='calc'?anM:anM;
       if(an)link(sx,sy,an.x-an.r,an.y,C[tg[0]],0.3*Math.min(o.a,an.a),1,[2,4]);
     });
   });
   txt('REASONING CHAMBER — the system listens, verifies, and connects; it does not merely transcribe',SW/2,118,9.5,C.dim,'center',800);
   if(S.spoken>=SPEECH.length){
     mono('SESSION COMPLETE · 6 SUPPORTED STRUCTURES · 3 DEFECTS · 1 RECONNECTION TO S-144',SW/2,136,8,C.hyp);
   }
 },
 click(o){
   if(o.kind==='stmt'){SEL=o;inspectStmt(o);}
   else if(o.kind==='anchor'){
     if(o.id==='an_model')inspectModelState();
     else if(o.id==='an_mem'){inspectMem(MEM[5]);}
     else inspectDataset(DATASETS[0]);
   }
 },
 drop(){}
};
function inspectStmt(o){
  inspect('<div class="chips">'+o.tags.map(t=>chip(t[0],t[2])).join('')+'</div>'+
   '<div class="rows">'+irow('Statement','“'+o.sp.s+'”')+
   o.sp.d.map(d=>irow(d[0]==='asm'?'Assumption':d[0]==='ev'?'Evidence':d[0]==='calc'?'Causal link':'Inference',d[1])).join('')+'</div>'+
   (o.i===3?'<details open><summary>Why this is a defect</summary><div class="db">Screen variation and heating error are not exclusive — the model carries both as weighted configurations. Treating them as exclusive discards survivable volume.</div></details>':'')+
   (o.i===5?'<div class="acts"><button class="abtn pri" data-act="go:memory">Open the S-144 branch</button><button class="abtn" data-act="go:claim">Assemble cautious claim</button></div>':''));
  inspTitle('Statement '+(o.i+1)+' — live verification');
}

const MODEDEFS=[
 ['watch','Watch','evidence stream'],
 ['model','Model','live black hole'],
 ['analyze','Analyze','hypothesis space'],
 ['memory','Memory','time evolution'],
 ['claim','Claim','living claim'],
 ['reason','Reason','think out loud']];
function renderDock(){
  $('#dock').innerHTML=MODEDEFS.map(m=>'<button class="dk'+(S.mode===m[0]?' on':'')+'" data-go="'+m[0]+'">'+
   '<div class="n">'+m[1]+(m[0]==='watch'?'<span class="badge">4</span>':'')+'</div><div class="d">'+m[2]+'</div></button>').join('');
}
function buildCtl(){
  const c=$('#ctl');
  if(S.mode==='model'){
    c.innerHTML='<div class="cslider"><label>Heating prior</label>'+
     '<input id="heatSl" type="range" min="0" max="100" value="'+Math.round(S.asm.heating*100)+'">'+
     '<span class="rv" id="heatRv">±'+sectorW()+'° sector</span></div>'+
     '<button class="cchip dark'+(S.asm.screen==='variable'?' on':'')+'" data-act="asm:screen">Screen: '+S.asm.screen+'</button>'+
     '<button class="cchip dark'+(MODES_IMPL.model.layers.pol?' on':'')+'" data-act="layer:pol">Polarisation</button>'+
     '<button class="cchip dark'+(MODES_IMPL.model.layers.geo?' on':'')+'" data-act="layer:geo">Geometry</button>'+
     '<button class="cchip dark'+(MODES_IMPL.model.layers.region?' on':'')+'" data-act="layer:region">Emission region</button>';
    const sl=$('#heatSl');
    sl.addEventListener('input',()=>{
      S.asm.heating=sl.value/100;GL.heatT=S.asm.heating;consistency();vitals();
      $('#heatRv').textContent='±'+sectorW()+'° sector';
    });
  }else if(S.mode==='analyze'){
    c.innerHTML='<button class="cchip'+(S.asm.screen==='variable'?' on':'')+'" data-act="asm:screen">Screen assumption: '+S.asm.screen+'</button>'+
     '<button class="cchip'+(S.xmatchRun?' on':'')+'" data-act="act:xmatch">'+(S.xmatchRun?'Cross-match ✓ r=0.04':'Run archival cross-match')+'</button>'+
     '<button class="cchip acc" data-act="act:exps">Experiment ranking</button>';
  }else if(S.mode==='memory'){
    c.innerHTML='<button class="cchip'+(S.memoryLive?' on':'')+'" data-act="act:react">'+(S.memoryLive?'Branch reactivated ✓':'Reactivate eligible branch')+'</button>'+
     '<button class="cchip" data-act="act:compare144">Compare S-144 ↔ now</button>';
  }else if(S.mode==='claim'){
    c.innerHTML='<button class="cchip" data-act="clm:all">Attach all</button>'+
     '<button class="cchip" data-act="clm:detachall">Detach all</button>'+
     '<button class="cchip acc" data-act="clm:audit">Adversarial audit</button>';
  }else if(S.mode==='reason'){
    c.innerHTML='<button class="cchip acc" data-act="rsn:next">'+(S.spoken===0?'Begin speaking':S.spoken<SPEECH.length?'Next statement ('+S.spoken+'/'+SPEECH.length+')':'Session complete')+'</button>'+
     (S.spoken>=SPEECH.length?'<button class="cchip" data-act="go:claim">Assemble cautious claim</button>':'');
  }else{
    c.innerHTML='<button class="cchip" data-act="brief:show">Briefing</button>'+
     '<button class="cchip acc" data-act="go:analyze">Why the model is broken</button>';
  }
}
function nav(mode){
  if(S.phase!=='live')return;
  S.mode=mode;
  clearMode();inspect(null);
  glSet(mode==='model');
  $('#brief').classList.remove('on');
  MODES_IMPL[mode].build();
  renderDock();buildCtl();vitals();
}
/* ------- actions ------- */
function act(a){
  const p=a.split(':');
  switch(p[0]){
   case 'insp':inspect(null);break;
   case 'brief':
     if(p[1]==='close')$('#brief').classList.remove('on');
     else if(p[1]==='show')showBrief();
     else{$('#brief').classList.remove('on');const m=findObj('mat0');if(m)inspectEvent(m.ev);}
     break;
   case 'asm':
     if(p[1]==='screen'){S.asm.screen=S.asm.screen==='variable'?'static':'variable';
       GL.scrVarT=S.asm.screen==='variable'?1:0;GL.screenT=S.asm.screen==='variable'?0.85:0.5;}
     consistency();if(MODES_IMPL[S.mode].resize)MODES_IMPL[S.mode].resize();
     buildCtl();vitals();break;
   case 'layer':MODES_IMPL.model.layers[p[1]]=!MODES_IMPL.model.layers[p[1]];buildCtl();break;
   case 'ds':{const id=p[2];if(S.removed[id])delete S.removed[id];else S.removed[id]=true;
     consistency();vitals();
     const c2=findObj('ev_'+id);
     if(c2){const z=findObj('zone');
       if(S.removed[id]&&z){c2.tx=z.x;c2.ty=z.y;}else{c2.tx=c2.homeX;c2.ty=c2.homeY;}}
     if(MODES_IMPL[S.mode].resize)MODES_IMPL[S.mode].resize();
     inspectDataset(DATASETS.find(d=>d.id===id));break;}
   case 'hyp':
     if(p[1]==='expand'){const ho=findObj('hyp_'+p[2]);
       if(ho){ho.h.ex.forEach((x,i)=>{const a2=-Math.PI/2+i/(ho.h.ex.length+ho.h.fx.length)*TAU;
          spawn({kind:'orb',mode:'analyze',text:x,tx:ho.x+Math.cos(a2)*(ho.r+52),ty:ho.y+Math.sin(a2)*(ho.r+42),x:ho.x,y:ho.y,r:5});});
         ho.h.fx.forEach((x,i)=>{const a2=-Math.PI/2+(i+ho.h.ex.length)/(ho.h.ex.length+ho.h.fx.length)*TAU;
          spawn({kind:'orb',mode:'analyze',neg:true,text:x,tx:ho.x+Math.cos(a2)*(ho.r+52),ty:ho.y+Math.sin(a2)*(ho.r+42),x:ho.x,y:ho.y,r:5});});}}
     else if(p[1]==='stress'){const h=HYPS.find(x=>x.id===p[2]);
       inspect('<div class="chips">'+chip('calc','counterfactual sweep')+'</div>'+
        '<div class="rows">'+irow('Screen released',p[2]==='screen'?'coverage rises to parity — ranking inverts':'coverage falls '+(p[2]==='heating'?'5/5 → 3/5':'slightly'))+
        irow('Lab mapping cut',p[2]==='heating'?'collapses to prior statement (33 %)':'unaffected')+
        irow('ALMA removed','all configurations lose their subject')+'</div>');
       inspTitle('Stress test — '+h.n);}
     break;
   case 'act':
     if(p[1]==='xmatch'){S.xmatchRun=true;consistency();
       if(S.mode==='analyze'&&MODES_IMPL.analyze.resize)MODES_IMPL.analyze.resize();
       buildCtl();vitals();
       inspect('<div class="chips">'+chip('ev','archival · zero cost')+chip('ok','executed')+'</div>'+
        '<div class="rows">'+irow('Result','<b>r = 0.04 ± 0.09</b> across 6 windows — no flare–EVPA correlation')+
        irow('Consequence','eruption configuration demoted — its predicted signature is absent')+
        irow('Claim','the leading claim predicted this null and obtained it')+'</div>');
       inspTitle('Archival cross-match — executed');}
     else if(p[1]==='exps')inspectExps();
     else if(p[1]==='react'){S.memoryLive=true;S.scrubDay=0;consistency();buildCtl();vitals();
       const sc=findObj('scrub');if(sc&&MODES_IMPL.memory.x1)sc.tx=MODES_IMPL.memory.x1;}
     else if(p[1]==='compare144')inspectCompare144();
     break;
   case 'clm':
     if(S.mode!=='claim'){nav('claim');}
     if(p[1]==='all'){COMPS.forEach((c,i)=>S.attached.add(i));
       World.objs.forEach(o=>{if(o.kind==='comp'){const q=MODES_IMPL.claim.slot(o.idx,true);o.tx=q.x;o.ty=q.y;}});
       vitals();inspectClaim();}
     else if(p[1]==='detachall'){S.attached.clear();S.audited=false;
       World.objs.forEach(o=>{if(o.kind==='comp'){const q=MODES_IMPL.claim.slot(o.idx,false);o.tx=q.x;o.ty=q.y;}});
       vitals();inspect(null);}
     else if(p[1]==='audit'){
       if(S.attached.size<9){inspectClaim();}
       else{MODES_IMPL.claim.auditI=0;MODES_IMPL.claim.auditT=0.55;}}
     break;
   case 'rsn':
     if(S.spoken<SPEECH.length){MODES_IMPL.reason.addStmt(S.spoken,false);S.spoken++;buildCtl();}
     break;
   case 'go':nav(p[1]);break;
  }
}

const ap=$('#ap'),apIn=$('#apIn'),apSug=$('#apSug');
function openAp(){ap.classList.add('on');apIn.value='';renderSug('');setTimeout(()=>apIn.focus(),40);}
function closeAp(){ap.classList.remove('on');}
function renderSug(q){
  const list=CMDS.filter(c=>!q||c[0].toLowerCase().includes(q));
  apSug.innerHTML=list.map((c,i)=>'<button class="sug'+(i===0&&q?' sel':'')+'" data-i="'+CMDS.indexOf(c)+'"><span class="pfx">→</span><span>'+c[0]+'</span><span class="where">'+c[1]+'</span></button>').join('')||
   '<div class="sug" style="cursor:default;color:var(--dim)">No matching operation.</div>';
}
apIn.addEventListener('input',()=>renderSug(apIn.value.trim().toLowerCase()));
apIn.addEventListener('keydown',e=>{
  if(e.key==='Enter'){const sel=apSug.querySelector('.sug.sel')||apSug.querySelector('.sug[data-i]');
    if(sel&&sel.dataset.i!==undefined){closeAp();CMDS[+sel.dataset.i][2]();}}
});
apSug.addEventListener('click',e=>{const b=e.target.closest('.sug');if(b&&b.dataset.i!==undefined){closeAp();CMDS[+b.dataset.i][2]();}});
ap.addEventListener('click',e=>{if(e.target===ap)closeAp();});
$('#cmdHint').addEventListener('click',openAp);
addEventListener('keydown',e=>{
  if(ap.classList.contains('on')){if(e.key==='Escape')closeAp();return;}
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
  if(S.phase!=='live')return;
  if(e.key==='/'){openAp();e.preventDefault();return;}
  if(e.key==='Escape'){inspect(null);return;}
  const n=parseInt(e.key,10);
  if(n>=1&&n<=6)nav(MODEDEFS[n-1][0]);
});
addEventListener('resize',()=>{if(S.phase==='live')nav(S.mode);});
setInterval(()=>{if(S.phase==='live')vitals();},900);
/* ------- boot ------- */
const CSEQ=[
 ['Reconstructing the research problem','217 source families · 146 datasets normalized',0.15],
 ['Assembling the physical system','shadow · photon ring · flow · field geometry',0.35],
 ['Attaching assumptions to their boundaries','heating prescription · foreground screen',0.55],
 ['Restoring scientific memory','412 reasoning states · rejection conditions live',0.78],
 ['Model live — autonomous watch armed','you are now operating the model directly',1]];
$('#go').addEventListener('click',()=>{
  if(S.phase!=='onb')return;S.phase='construct';
  const onb=$('#onb');onb.style.opacity=0;onb.style.filter='blur(8px)';onb.style.pointerEvents='none';
  setTimeout(()=>onb.remove(),1200);
  const cons=$('#cons');cons.classList.add('on');cons.style.opacity=1;
  const cl=$('#cline'),ct=$('#ctick'),cb=$('#cbar');
  let i=0;const stepMs=RM?400:1400;
  function nx(){
    if(i>=CSEQ.length){
      cons.style.opacity=0;cons.style.transition='opacity .8s';setTimeout(()=>cons.remove(),900);
      S.phase='live';$('#chrome').classList.add('on');
      renderDock();nav('watch');
      return;
    }
    const q=CSEQ[i];
    cl.classList.remove('on');ct.classList.remove('on');
    setTimeout(()=>{cl.textContent=q[0];ct.textContent=q[1];cb.style.width=(q[2]*100)+'%';
      cl.classList.add('on');ct.classList.add('on');},300);
    i++;setTimeout(nx,stepMs);
  }
  nx();
});
$('#ta').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#go').click();}});
